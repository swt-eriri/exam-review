        <span class="chev">${icon('chevronRight', 18)}</span>
      </a>`));
    }
    path.append(sec);
  }
  main.append(path);
}

/* ============================================================
 * 模块页
 * ============================================================ */
function viewModule(main, mid) {
  const m = MOD[mid];
  const s = modStats(mid);
  main.className = 'wide';
  const nl = m.lessons.findIndex((_, i) => !lessonState(mid, i).done);
  main.append(pageHead({
    crumbs: [['学习路线', '#/'], [m.short]],
    eyebrow: esc(m.group || ''),
    title: esc(m.title),
    desc: `考试题号 ${esc(m.exam || '')}`,
    aside: nl >= 0 ? `<a class="btn primary lg" href="#/l/${mid}/${nl}">${nl ? '继续学习' : '开始学习'}${icon('arrowRight', 16)}</a>`
      : `<a class="btn primary lg" href="#/drill/${mid}">去刷题${icon('arrowRight', 16)}</a>`,
  }));
  const allDone = nl < 0;

  const grid = h(`<div class="two-col"><section class="card lessons-card"><div class="card-head"><h3>课程 <span class="muted head-count">${s.lessonsDone}/${s.lessons} 已学</span></h3><button class="btn ghost sm mark-all">${allDone ? `${icon('reset', 14)}全部重新学` : `${icon('skip', 14)}全部标为已学`}</button></div><ol class="timeline"></ol></section><aside class="side-col"></aside></div>`);
  m.lessons.forEach((l, i) => {
    const ls = lessonState(mid, i);
    const prac = m.questions.filter(q => q.lesson === i);
    const pracDone = prac.filter(q => qs(q.id).n).length;
    const isNext = i === nl;
    $('.timeline', grid).append(h(`<li class="${ls.done ? 'done' : ''} ${ls.skipped ? 'skipped' : ''} ${isNext ? 'next' : ''}"><a href="#/l/${mid}/${i}">
      <span class="tl-dot">${ls.done ? (ls.skipped ? icon('skip', 14) : icon('check', 14)) : i + 1}</span>
      <span class="tl-body"><b>${esc(l.title)}</b><span>${ls.skipped ? '已跳过 · ' : ''}${l.cards.length} 步${prac.length ? ` · 课后练习 ${pracDone}/${prac.length}` : ''}</span></span>
      ${isNext ? `<span class="pill accent">${ls.card ? '继续' : '下一节'}</span>` : ''}
      <span class="chev">${icon('chevronRight', 16)}</span></a>
      <button class="tl-toggle ${ls.done ? 'on' : ''}" data-i="${i}" title="${ls.done ? '撤销，改回未学' : '已经学过，跳过这一节'}">${ls.done ? '撤销' : '标为已学'}</button></li>`));
  });
  $('.timeline', grid).addEventListener('click', e => {
    const b = e.target.closest('.tl-toggle'); if (!b) return;
    const i = +b.dataset.i;
    const done = lessonState(mid, i).done;
    setLessonDone(mid, i, !done);
    toast(done ? `已改回未学：${m.lessons[i].title}` : `已标为学过：${m.lessons[i].title}`);
    route();
  });
  $('.mark-all', grid).onclick = async () => {
    if (allDone) {
      if (!(await confirmBox(`把「${esc(m.short)}」的 ${m.lessons.length} 节课都改回未学？<br>做过的题和错题记录不受影响。`, '改回未学'))) return;
      m.lessons.forEach((_, i) => setLessonDone(mid, i, false));
      toast('已全部改回未学');
    } else {
      m.lessons.forEach((_, i) => { if (!lessonState(mid, i).done) setLessonDone(mid, i, true); });
      toast(`「${m.short}」已全部标为学过`);
    }
    route();
  };
  const side = $('.side-col', grid);
  side.append(h(`<section class="card stat-card">
    <div class="card-head"><h3>刷题单</h3></div>
    <div class="ring-stat">${ring(s.total ? s.done / s.total : 0, 76, 6)}<div><b>${s.done}<small> / ${s.total}</small></b><span>已做</span></div></div>
    <dl class="mini-stats"><div><dt>答对</dt><dd>${s.right}</dd></div><div><dt>正确率</dt><dd>${s.done ? Math.round(s.right / s.done * 100) + '%' : '—'}</dd></div><div><dt>没做过</dt><dd>${s.total - s.done}</dd></div></dl>
    <a class="btn secondary block" href="#/drill/${mid}">${icon('list', 16)}刷本模块的题</a>
  </section>`));
  if (m.refs && m.refs.length) {
    side.append(h(`<section class="card"><div class="card-head"><h3>官方资料</h3><span class="muted small">选读</span></div>
      <ul class="ref-list">${m.refs.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${icon('external', 14)}<span>${esc(r.label)}</span></a></li>`).join('')}</ul></section>`));
  }
  main.append(grid);
}

/* ============================================================
 * 讲解：一步一步往下翻
 * ============================================================ */
function viewLesson(main, mid, li) {
  const m = MOD[mid], l = m.lessons[li];
  const key = lessonKey(mid, li);
  const st = S.lessons[key] || (S.lessons[key] = {});
  const practice = m.questions.filter(q => q.lesson === li);
  let idx = Math.min(st.card || 0, l.cards.length - 1);
  if (st.done) idx = 0;
  setLast(`#/l/${mid}/${li}`, `${m.short} · ${l.title}`);

  main.className = 'reading';
  const wrap = h(`<div class="lesson">
    <div class="focus-bar">
      <a class="icon-btn" href="#/m/${mid}" aria-label="返回模块">${icon('x', 20)}</a>
      <div class="focus-progress"><div class="segs"></div></div>
      <span class="focus-count"></span>
      ${st.done ? '' : `<button class="btn ghost sm skip-lesson" title="已经学过，直接跳到下一节">${icon('skip', 14)}跳过本节</button>`}
    </div>
    <div class="lesson-title"><div class="eyebrow">${esc(m.short)} · 第 ${li + 1} 节</div><h1>${esc(l.title)}</h1></div>
    <div class="card-stage"></div>
    <div class="action-bar"><div class="action-inner">
      <button class="btn secondary" data-act="prev">${icon('arrowLeft', 16)}上一步</button>
      <span class="kbd-hint">${icon('keyboard', 15)}<kbd>←</kbd><kbd>→</kbd> 翻页</span>
      <button class="btn primary" data-act="next"></button>
    </div></div></div>`);
  main.append(wrap);
  const stage = $('.card-stage', wrap), segs = $('.segs', wrap);
  const prevBtn = $('[data-act=prev]', wrap), nextBtn = $('[data-act=next]', wrap);

  function show(i, dir = 0) {
    idx = i;
    st.card = i; save();
    const card = md(l.cards[i]);
    card.classList.add('lesson-card', 'prose');
    if (dir) card.classList.add(dir > 0 ? 'in-right' : 'in-left');
    stage.innerHTML = '';
    stage.append(card);
    segs.innerHTML = l.cards.map((_, k) => `<i class="${k < i ? 'past' : k === i ? 'cur' : ''}"></i>`).join('');
    $('.focus-count', wrap).textContent = `${i + 1} / ${l.cards.length}`;
    prevBtn.disabled = i === 0;
    const last = i === l.cards.length - 1;
    nextBtn.innerHTML = last ? (practice.length ? `做课后练习 · ${practice.length} 题${icon('arrowRight', 16)}` : `完成本节${icon('check', 16)}`) : `下一步${icon('arrowRight', 16)}`;
    if (dir) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function finish() {
    st.done = true; delete st.skipped; st.card = 0; save();
    if (practice.length) {
      startSession({
        title: `课后练习 · ${l.title}`, qids: practice.map(q => q.id), mode: 'practice',
        back: `#/m/${mid}`, next: nextLessonHash(mid, li),
      });
    } else {
      go(nextLessonHash(mid, li).hash);
    }
  }
  const skipBtn = $('.skip-lesson', wrap);
  if (skipBtn) skipBtn.onclick = () => {
    setLessonDone(mid, li, true);
    const nx = nextLessonHash(mid, li);
    toast(`已跳过「${l.title}」，想重学可以在模块页撤销`);
    go(nx.hash);
  };
  prevBtn.onclick = () => idx > 0 && show(idx - 1, -1);
  nextBtn.onclick = () => idx < l.cards.length - 1 ? show(idx + 1, 1) : finish();
  viewKeys = e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); nextBtn.click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevBtn.click(); }
    else if (e.key === 'Escape') go(`#/m/${mid}`);
  };
  show(idx);
}
// 标记一节为已学（跳过）或改回未学
function setLessonDone(mid, li, done) {
  const key = lessonKey(mid, li);
  const st = S.lessons[key] || (S.lessons[key] = {});
  if (done) { if (!st.done) { st.done = true; st.skipped = true; } st.card = 0; }
  else { delete st.done; delete st.skipped; st.card = 0; }
  save();
}
function nextLessonHash(mid, li) {
  const m = MOD[mid];
  if (li + 1 < m.lessons.length) return { hash: `#/l/${mid}/${li + 1}`, label: `下一节：${m.lessons[li + 1].title}` };
  return { hash: `#/m/${mid}`, label: '本模块讲完了，回到模块页' };
}

/* ============================================================
 * 题目组件：单选 / 多选 / 简答 / 代码
 *   opts.exam = true 时不给反馈（模拟考）
 * ============================================================ */
const LETTERS = 'ABCDEFGH';

function questionCard(q, opts = {}) {
  const m = MOD[q.m];
  const unsure = !!qs(q.id).unsure;
  const el = h(`<article class="q-card">
    <header class="q-meta">
      <span class="pill type-${q.type}">${TYPE_NAME[q.type]}</span>
      <span class="q-src">${esc(m ? m.short : '')}${opts.label ? ' · ' + esc(opts.label) : ''}</span>
      <button class="unsure-btn ${unsure ? 'on' : ''}" title="标记为不熟，会出现在错题本的「不熟」里（快捷键 U）">${icon('star', 15)}<span>${unsure ? '已标不熟' : '不熟'}</span></button>
    </header>
    <div class="q-stem prose"></div>
    <div class="q-body"></div>
    <div class="feedback" hidden></div>
    <footer class="q-actions"></footer>
  </article>`);
  $('.q-stem', el).append(md(q.stem));
  const unsureBtn = $('.unsure-btn', el);
  const flipUnsure = () => {
    const on = toggleUnsure(q.id);
    unsureBtn.classList.toggle('on', on);
    $('span', unsureBtn).textContent = on ? '已标不熟' : '不熟';
    toast(on ? '已标记不熟，可以在错题本里集中复习' : '已取消不熟标记');
  };
  unsureBtn.onclick = flipUnsure;
  const ctl = { el, answered: false, keys: null };
  const impl = { single: choiceQ, multi: choiceQ, short: shortQ, code: codeQ }[q.type];
  impl(q, el, ctl, opts);
  const inner = ctl.keys;
  ctl.keys = e => {
    if ((e.key === 'u' || e.key === 'U') && !e.ctrlKey && !e.metaKey) { flipUnsure(); return; }
    if (inner) inner(e);
  };
  return ctl;
}

function feedbackHtml(kind, title) {
  const ic = kind === 'ok' ? 'check' : kind === 'no' ? 'x' : 'bulb';
  return `<div class="fb-head"><span class="fb-ic">${icon(ic, 16)}</span><b>${title}</b></div>`;
}

function choiceQ(q, el, ctl, opts) {
  const multi = q.type === 'multi';
  const body = $('.q-body', el), actions = $('.q-actions', el), fb = $('.feedback', el);
  let picked = new Set(opts.value || []);
  const n = q.options.length;
  body.innerHTML = `<div class="q-hint">${multi ? '多选题 · 选出所有正确的选项' : '单选题'}<span class="desk"> · 按数字键 1–${n} ${multi ? '勾选' : '选择'}</span></div>
    <div class="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}">
      <span class="opt-key">${LETTERS[i]}</span>
      <span class="opt-main"><span class="opt-text">${mdInline(o)}</span><span class="opt-why" hidden></span></span>
      <kbd class="opt-kbd">${i + 1}</kbd></button>`).join('')}</div>`;
  const optEls = $$('.opt', body);
  const paint = () => optEls.forEach((b, i) => b.classList.toggle('picked', picked.has(i)));
  paint();

  function pick(i) {
    if (ctl.answered || i >= n) return;
    if (multi) picked.has(i) ? picked.delete(i) : picked.add(i);
    else picked = new Set([i]);
    paint();
    if (opts.exam) opts.onChange([...picked].sort());
    else submitBtn.disabled = picked.size === 0;
  }
  optEls.forEach((b, i) => b.onclick = () => pick(i));

  let submitBtn;
  if (!opts.exam) {
    submitBtn = h(`<button class="btn primary" disabled>提交答案<kbd class="on-btn">Enter</kbd></button>`);
    (opts.bar || actions).append(submitBtn);
    submitBtn.onclick = submit;
  }
  const isRight = () => { const ans = new Set(q.answer); return picked.size === ans.size && [...picked].every(i => ans.has(i)); };
  function submit() {
    if (ctl.answered || !picked.size) return;
    ctl.answered = true;
    const ok = isRight();
    reveal(ok);
    opts.onAnswered && opts.onAnswered(ok);
  }
  function reveal(ok) {
    const ans = new Set(q.answer);
    body.classList.add('revealed');
    optEls.forEach((b, i) => {
      b.disabled = true;
      const key = $('.opt-key', b);
      if (ans.has(i)) { b.classList.add(picked.has(i) ? 'right' : 'missed'); key.innerHTML = icon('check', 15); }
      else if (picked.has(i)) { b.classList.add('wrong'); key.innerHTML = icon('x', 15); }
      const why = q.why && q.why[i];
      if (why) { const w = $('.opt-why', b); w.innerHTML = mdInline(why); w.hidden = false; }
    });
    const letters = q.answer.map(i => LETTERS[i]).join('、');
    fb.hidden = false;
    fb.className = 'feedback ' + (ok ? 'ok' : 'no');
    fb.innerHTML = feedbackHtml(ok ? 'ok' : 'no', ok ? '回答正确' : `正确答案是 ${letters}`);
    if (q.explain) { const d = md(q.explain); d.classList.add('fb-body', 'prose'); fb.append(d); }
    if (submitBtn) submitBtn.remove();
  }
  ctl.reveal = value => { picked = new Set(value || []); paint(); ctl.answered = true; reveal(isRight()); };
  ctl.keys = e => {
    if (/^[1-8]$/.test(e.key)) { e.preventDefault(); pick(+e.key - 1); return; }
    if (e.key === 'Enter' && !opts.exam && !ctl.answered) { e.preventDefault(); submit(); }
  };
}

function shortQ(q, el, ctl, opts) {
  const body = $('.q-body', el), actions = $('.q-actions', el), fb = $('.feedback', el);
  body.innerHTML = `<div class="q-hint">简答题 · 先用自己的话写下来，再对照得分点</div><textarea class="answer-box" placeholder="不用写很长，把要点写到就行…"></textarea>`;
  const ta = $('textarea', body);
  ta.value = opts.value || '';
  ta.oninput = () => opts.onChange && opts.onChange(ta.value);
  if (opts.exam) return;
  const btn = h(`<button class="btn primary">写完了，对照得分点</button>`);
  (opts.bar || actions).append(btn);
  btn.onclick = () => showKeypoints();
  function showKeypoints(readonly) {
    btn.remove();
    fb.hidden = false; fb.className = 'feedback neutral';
    fb.innerHTML = feedbackHtml('neutral', '逐条勾选你写到的得分点')
      + `<ul class="kp">${q.keypoints.map((k, i) => `<li><label><input type="checkbox" data-i="${i}"><span class="kp-box">${icon('check', 13)}</span><span>${mdInline(k)}</span></label></li>`).join('')}</ul>
      <details class="ref"><summary>${icon('eye', 15)}查看参考答案</summary></details>`;
    const ref = md(q.ref); ref.classList.add('prose');
    $('details', fb).append(ref);
    if (readonly) { $('details', fb).open = true; return; }
    const self = h(`<div class="fb-actions"><button class="btn secondary" data-v="0">没写全</button><button class="btn success" data-v="1">${icon('check', 16)}要点都写到了</button></div>`);
    (opts.bar || fb).append(self);
    const boxes = $$('input', fb);
    $$('button', self).forEach(b => b.onclick = () => {
      const ok = b.dataset.v === '1';
      if (ok && !boxes.every(x => x.checked)) { toast('还有得分点没勾上。真写到了就勾上，没写到就算没掌握'); return; }
      ctl.answered = true; self.remove();
      fb.className = 'feedback ' + (ok ? 'ok' : 'no');
      $('.fb-head', fb).outerHTML = feedbackHtml(ok ? 'ok' : 'no', ok ? '要点都答到了' : '这题还没掌握，已放进错题本');
      opts.onAnswered && opts.onAnswered(ok);
    });
  }
  ctl.reveal = () => showKeypoints(true);
  ctl.keys = e => { if (e.key === 'Enter' && btn.isConnected) { e.preventDefault(); showKeypoints(); } };
}

function codeQ(q, el, ctl, opts) {
  const body = $('.q-body', el), actions = $('.q-actions', el), fb = $('.feedback', el);
  const blind = S.settings.blind;
  const saved = opts.value !== undefined ? opts.value : S.code[q.id];
  body.innerHTML = `<div class="editor">
      <div class="editor-bar"><span class="editor-tab">${icon('code', 14)}answer.py</span><span class="editor-tips">Tab 缩进 · 回车自动缩进 · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> ${blind ? '提交' : '运行测试'}</span></div>
      <textarea class="editor-input" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
    <div class="test-out" hidden></div>`;
  const ta = $('.editor-input', body), out = $('.test-out', body);
  ta.value = saved != null ? saved : q.starter;
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.max(240, ta.scrollHeight + 4) + 'px'; };
  bindEditor(ta, () => runBtn.isConnected && runBtn.click());
  let saveTimer;
  ta.addEventListener('input', () => {
    fit();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { if (!opts.exam) { S.code[q.id] = ta.value; save(); } }, 400);
    opts.onChange && opts.onChange(ta.value);
  });
  requestAnimationFrame(fit);

  let sawSolution = false;
  const runBtn = h(`<button class="btn primary">${icon('play', 14)}${blind && !opts.exam ? '提交（盲写模式，只有一次机会）' : '运行测试'}</button>`);
  const resetBtn = h(`<button class="btn secondary">${icon('reset', 15)}恢复初始代码</button>`);
  const solBtn = h(`<button class="btn ghost">${icon('eye', 15)}看参考答案</button>`);
  if (!(opts.exam && blind)) (opts.bar || actions).append(runBtn);
  actions.append(resetBtn);
  if (!opts.exam) actions.append(solBtn);

  resetBtn.onclick = async () => {
    if (ta.value !== q.starter && !(await confirmBox('把编辑器恢复成初始代码？你写的内容会丢掉。', '恢复'))) return;
    ta.value = q.starter; ta.dispatchEvent(new Event('input'));
  };
  solBtn.onclick = () => {
    if (!sawSolution && !ctl.answered) {
      sawSolution = true;
      toast('看过答案，这题就记作“没做出来”，过两天在错题本里再自己写一遍');
    }
    showSolution();
  };
  function showSolution() {
    if ($('.solution', el)) return;
    const box = h(`<div class="solution"><div class="fb-head"><span class="fb-ic">${icon('eye', 16)}</span><b>参考答案</b></div></div>`);
    box.append(md('```python\n' + q.solution + '\n```'));
    if (q.explain) { const d = md(q.explain); d.classList.add('prose'); box.append(d); }
    fb.after(box);
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  runBtn.onclick = async () => {
    runBtn.disabled = true;
    out.hidden = false; out.className = 'test-out loading'; out.innerHTML = `<div class="spinner"></div><span>准备运行…</span>`;
    const r = await runTests(q, ta.value, s => { out.innerHTML = `<div class="spinner"></div><span>${esc(s)}</span>`; });
    runBtn.disabled = false;
    const allOk = renderTestResult(out, r);
    if (opts.exam || ctl.answered) return;
    if (r.offline) { offlineFallback(); return; }
    if (blind) { finish(allOk); return; }
    if (allOk) finish(!sawSolution);
  };
  function finish(ok) {
    ctl.answered = true;
    runBtn.remove();
    fb.hidden = false;
    fb.className = 'feedback ' + (ok ? 'ok' : 'no');
    fb.innerHTML = feedbackHtml(ok ? 'ok' : 'no', ok ? '全部测试通过，这题拿下了'
      : sawSolution ? '测试通过了，但看过答案，记作没做出来，过两天再写一遍' : '有测试没通过（盲写模式只算第一次提交）');
    if (!ok || blind) showSolution();
    opts.onAnswered && opts.onAnswered(ok);
  }
  function offlineFallback() {
    if ($('.offline', el)) return;
    const box = h(`<div class="feedback neutral offline">${feedbackHtml('neutral', '现在没法联网运行代码，改成对照参考答案自查')}
      <div class="fb-actions"><button class="btn secondary" data-v="0">我写得不对</button><button class="btn success" data-v="1">${icon('check', 16)}思路一致，边界都处理了</button></div></div>`);
    fb.before(box);
    showSolution();
    $$('button', box).forEach(b => b.onclick = () => { box.remove(); finish(b.dataset.v === '1'); });
  }
  ctl.reveal = (value, result) => {
    ta.value = value != null ? value : ''; ta.readOnly = true; fit();
    runBtn.remove(); resetBtn.remove();
    if (result) renderTestResult(out, result);
    showSolution();
  };
  ctl.keys = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && runBtn.isConnected) { e.preventDefault(); runBtn.click(); } };
}

function renderTestResult(out, r) {
  out.hidden = false;
  if (!r.ok) {
    out.className = 'test-out err';
    out.innerHTML = `<div class="to-head">${icon('alert', 16)}<b>${r.offline ? '无法运行' : r.phase === 'tests' ? '测试代码运行出错' : '代码运行出错'}</b></div>${r.out ? `<pre>${esc(r.out)}</pre>` : ''}<pre>${esc(r.error)}</pre>`;
    return false;
  }
  const res = r.results || [];
  const pass = res.filter(x => x.ok).length;
  const allOk = res.length > 0 && pass === res.length;
  out.className = 'test-out ' + (allOk ? 'ok' : 'no');
  out.innerHTML = `<div class="to-head">${icon(allOk ? 'check' : 'x', 16)}<b>测试通过 ${pass} / ${res.length}</b><div class="to-bar"><i style="width:${res.length ? pass / res.length * 100 : 0}%"></i></div></div>
    <ul class="tests">${res.map(x => `<li class="${x.ok ? 'pass' : 'fail'}"><span class="t-ic">${icon(x.ok ? 'check' : 'x', 14)}</span><div><span>${esc(x.name)}</span>${x.ok ? '' : `<div class="cmp"><div><em>期望</em><code>${esc(x.expected)}</code></div><div><em>实际</em><code>${esc(x.got)}</code></div></div>`}</div></li>`).join('')}</ul>`
    + (r.out ? `<div class="to-sub">print 输出</div><pre>${esc(r.out)}</pre>` : '');
  return allOk;
}

function bindEditor(ta, onRun) {
  ta.addEventListener('keydown', e => {
    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun(); return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      if (e.shiftKey) {
        const n = v.slice(ls, ls + 4).match(/^ {0,4}/)[0].length;
        ta.setRangeText('', ls, ls + n, 'preserve');
        ta.setSelectionRange(Math.max(ls, s - n), Math.max(ls, en - n));
      } else if (s !== en && v.slice(s, en).includes('\n')) {
        ta.setRangeText(v.slice(ls, en).replace(/^/gm, '    '), ls, en, 'select');
      } else {
        ta.setRangeText('    ', s, en, 'end');
      }
      ta.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && !e.shiftKey && s === en) {
      e.preventDefault();
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const line = v.slice(ls, s);
      let ind = line.match(/^\s*/)[0];
      if (/:\s*(#.*)?$/.test(line)) ind += '    ';
      ta.setRangeText('\n' + ind, s, en, 'end');
      ta.dispatchEvent(new Event('input'));
    } else if (e.key === 'Backspace' && s === en && s > 0) {
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const before = v.slice(ls, s);
      if (before.length && /^ +$/.test(before)) {
        e.preventDefault();
        const n = before.length % 4 || 4;
        ta.setRangeText('', s - n, s, 'end');
        ta.dispatchEvent(new Event('input'));
      }
    }
  });
}

/* ============================================================
 * 连续做题（课后练习 / 刷题单 / 错题复习）
 * ============================================================ */
let SESSION = null;
function startSession(opt) {
  SESSION = Object.assign({ i: 0, results: {} }, opt);
  go('#/run');
}

function barResultText(q, ok) {
  if (q.type === 'single' || q.type === 'multi') return ok ? '回答正确' : `正确答案是 ${q.answer.map(i => LETTERS[i]).join('、')}`;
  if (q.type === 'code') return ok ? '全部测试通过' : '这题记作没做出来';
  return ok ? '要点都答到了' : '已放进错题本';
}

function viewRun(main) {
  if (!SESSION || !SESSION.qids.length) { go('#/'); return; }
  const ss = SESSION;
  main.className = 'reading';
  const wrap = h(`<div class="session">
    <div class="focus-bar">
      <a class="icon-btn" href="${ss.back || '#/'}" aria-label="退出">${icon('x', 20)}</a>
      <div class="focus-progress"><div class="meter lg"><i></i></div></div>
      <span class="focus-count"></span>
    </div>
    <div class="session-head"><span class="eyebrow">${esc(ss.title)}</span><span class="score"></span></div>
    <div class="q-stage"></div>
    <div class="answer-bar"><div class="ab-inner"><div class="ab-status"></div><div class="ab-actions"></div></div></div></div>`);
  main.append(wrap);
  const stage = $('.q-stage', wrap), meter = $('.meter i', wrap);
  const bar = $('.answer-bar', wrap), barStatus = $('.ab-status', wrap), barActs = $('.ab-actions', wrap);

  function paintHead() {
    const vals = Object.values(ss.results);
    const right = vals.filter(Boolean).length, wrong = vals.length - right;
    $('.focus-count', wrap).textContent = `${Math.min(ss.i + 1, ss.qids.length)} / ${ss.qids.length}`;
    meter.style.width = (ss.i / ss.qids.length * 100) + '%';
    $('.score', wrap).innerHTML = vals.length ? `<span class="good">${icon('check', 14)}${right}</span><span class="bad">${icon('x', 14)}${wrong}</span>` : '';
  }

  function show() {
    if (ss.i >= ss.qids.length) return summary();
    const q = QS[ss.qids[ss.i]];
    paintHead();
    const nextBtn = h(`<button class="btn primary next-btn">${ss.i + 1 < ss.qids.length ? '下一题' : '查看结果'}${icon('arrowRight', 16)}</button>`);
    const skipBtn = h(`<button class="btn ghost skip-btn">${icon('skip', 15)}跳过</button>`);
    bar.className = 'answer-bar';
    barStatus.innerHTML = ''; barActs.innerHTML = '';
    barActs.append(skipBtn);
    const ctl = questionCard(q, {
      label: qs(q.id).n ? `做过 ${qs(q.id).n} 次` : '新题',
      bar: barActs,
      onAnswered(ok) {
        ss.results[q.id] = ok;
        record(q.id, ok);
        // 操作栏原位换成「下一题」，并直接显示对错
        bar.className = 'answer-bar ' + (ok ? 'ok' : 'no');
        barStatus.innerHTML = `<span class="ab-ic">${icon(ok ? 'check' : 'x', 16)}</span><span class="ab-text"><b>${barResultText(q, ok)}</b><small>解析在上方，可以往上看</small></span>`;
        barActs.innerHTML = '';
        barActs.append(nextBtn);
        nextBtn.focus({ preventScroll: true });
        paintHead();
        renderNav();
      },
    });
    skipBtn.onclick = () => { ss.i++; show(); };
    nextBtn.onclick = () => { ss.i++; show(); };
    stage.innerHTML = '';
    ctl.el.classList.add('in-right');
    stage.append(ctl.el);
    window.scrollTo({ top: 0 });
    viewKeys = e => {
      if (e.key === 'Enter' && ctl.answered && !(e.ctrlKey || e.metaKey)) { e.preventDefault(); nextBtn.click(); return; }
      if (e.key === 'Escape') { go(ss.back || '#/'); return; }
      ctl.keys && ctl.keys(e);
    };
  }

  function summary() {
    viewKeys = null;
    bar.remove();
    meter.style.width = '100%';
    $('.focus-count', wrap).textContent = '完成';
    const ids = Object.keys(ss.results);
    const wrong = ids.filter(id => !ss.results[id]);
    const right = ids.length - wrong.length;
    const pct = ids.length ? right / ids.length : 0;
    const tone = !ids.length ? 'neutral' : !wrong.length ? 'ok' : pct >= .6 ? 'mid' : 'low';
    stage.innerHTML = '';
    const box = h(`<section class="result-card ${tone}">
      <div class="result-ring">${ring(pct, 120, 9)}<div class="rr-text"><b>${right}<small>/${ids.length}</small></b><span>答对</span></div></div>
      <h2>${!ids.length ? '这一组都跳过了' : !wrong.length ? '全部答对' : pct >= .6 ? '不错，还差一点' : '这部分要再巩固一下'}</h2>
      <p>${wrong.length ? `错的 ${wrong.length} 题已经放进错题本，明天会提醒你再做一遍。` : ids.length ? '状态很好，继续保持。' : '可以回去重新做，或者直接往下学。'}</p>
      <div class="result-actions"></div></section>`);
    const acts = $('.result-actions', box);
    if (wrong.length) {
      const again = h(`<button class="btn secondary">${icon('reset', 15)}马上重做错的 ${wrong.length} 题</button>`);
      again.onclick = () => startSession(Object.assign({}, ss, { i: 0, results: {}, qids: wrong, title: ss.title + ' · 重做错题' }));
      acts.append(again);
    }
    if (ss.next) {
      acts.append(h(`<a class="btn secondary" href="${ss.back || '#/'}">返回</a>`));

  }

}

 * 模拟考
 * ============================================================ */
function drawMock() {
  const pool = drillPool();
  const used = new Set();
  const tier = id => { const s = qs(id); return !s.n ? 0 : (s.box || s.unsure || s.wrong) ? 1 : 2; };
  const pickFrom = cands => {
    cands = cands.filter(q => !used.has(q.id));
    if (!cands.length) return null;
    const best = Math.min(...cands.map(q => tier(q.id)));
    const c = shuffle(cands.filter(q => tier(q.id) === best))[0];
    used.add(c.id);
    return c;
  };
  return BLUEPRINT.map((slot, i) => {
    const q = pickFrom(pool.filter(q => q.m === slot.m && q.type === slot.type && (!slot.tag || q.tags.includes(slot.tag))))
      || pickFrom(pool.filter(q => q.m === slot.m && q.type === slot.type))
      || pickFrom(pool.filter(q => q.type === slot.type));
    return q ? { no: i + 1, qid: q.id } : null;
  }).filter(Boolean);
}
const isAnswered = (q, a) => a != null && (Array.isArray(a) ? a.length > 0 : String(a).trim() !== '' && a !== q.starter);

    let n = 0;

      if (a) n++;
      return `${i === 0 ? '<div class="sheet-sec">单选</div>' : i === 20 ? '<div class="sheet-sec">多选</div>' : i === 28 ? '<div class="sheet-sec">简答</div>' : i === 30 ? '<div class="sheet-sec">代码</div>' : ''}<button class="${i === cur ? 'cur' : ''} ${a ? 'ans' : ''} ${mk.flags[it.qid] ? 'flag' : ''}" data-i="${i}">${it.no}</button>`;
    }).join('');

    $('.meter i', layout).style.width = (n / mk.items.length * 100) + '%';
    return n;
  }
  grid.onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };

  function show(i) {
    cur = i; mk.cur = i; save();
    const it = mk.items[i], q = QS[it.qid];
    const ctl = questionCard(q, {
      exam: true, label: `第 ${it.no} 题`, value: mk.ans[it.qid],
      onChange(v) { mk.ans[it.qid] = v; save(); paintGrid(); },
    });
    const flag = h(`<button class="btn ghost ${mk.flags[it.qid] ? 'flagged' : ''}">${icon('flag', 15)}${mk.flags[it.qid] ? '取消标记' : '标记待查'}</button>`);
    flag.onclick = () => { mk.flags[it.qid] = !mk.flags[it.qid]; save(); show(cur); };
    const prev = h(`<button class="btn secondary" ${i ? '' : 'disabled'}>${icon('arrowLeft', 16)}上一题</button>`);
    const next = h(`<button class="btn primary">${i + 1 < mk.items.length ? '下一题' : '去交卷'}${icon('arrowRight', 16)}</button>`);
    prev.onclick = () => show(i - 1);
    next.onclick = () => i + 1 < mk.items.length ? show(i + 1) : submit();
    $('.ab-flag', layout).innerHTML = ''; $('.ab-flag', layout).append(flag);
    const acts = $('.answer-bar .ab-actions', layout);
    acts.innerHTML = ''; acts.append(prev, next);
    qbox.innerHTML = ''; qbox.append(ctl.el);
    paintGrid();
    window.scrollTo({ top: 0 });
    viewKeys = e => {
      if (e.key === 'ArrowRight' || (e.key === 'Enter' && !(e.ctrlKey || e.metaKey))) { e.preventDefault(); next.click(); return; }
      if (e.key === 'ArrowLeft') { e.preventDefault(); if (i) prev.click(); return; }
      ctl.keys && ctl.keys(e);
    };
  }
  async function submit() {
    const n = paintGrid();
    const left = mk.items.length - n;
    if (!(await confirmBox(left ? `还有 <b>${left}</b> 题没答，确定交卷吗？<br>没答的题算错。` : '全部答完了，确定交卷吗？', '交卷', '再检查一下'))) return;

    qbox.innerHTML = `<div class="card grading"><div class="spinner lg"></div><h3>正在判卷</h3><p class="muted">${mk.items.some(it => QS[it.qid].type === 'code') ? '代码题需要跑一下测试，稍等几秒' : ''}</p></div>`;
    viewKeys = null;
    mk.result = {}; mk.testOut = {};
    for (const it of mk.items) {
      const q = QS[it.qid], a = mk.ans[it.qid];
      if (q.type === 'single' || q.type === 'multi') {
        const ans = new Set(q.answer), p = new Set(a || []);
        mk.result[it.qid] = p.size === ans.size && [...p].every(x => ans.has(x));
      } else if (q.type === 'code') {
        if (!isAnswered(q, a)) { mk.result[it.qid] = false; continue; }
        const r = await runTests(q, a, () => {});
        if (r.offline) mk.result[it.qid] = null;
        else { mk.testOut[it.qid] = r; mk.result[it.qid] = !!(r.ok && r.results.length && r.results.every(x => x.ok)); }
      } else {
        mk.result[it.qid] = isAnswered(q, a) ? null : false; // 简答待自评
      }
    }
    mk.submitted = true;
    for (const it of mk.items) if (mk.result[it.qid] !== null) record(it.qid, mk.result[it.qid]);
    save();
    route();
  }
  $('.submit-btn', layout).onclick = submit;
  show(cur);
}

  const byMod = {};
  mk.items.forEach(it => {
    const q = QS[it.qid];
    const r = byMod[q.m] || (byMod[q.m] = { ok: 0, n: 0 });

  });
  main.append(h(`<section class="card"><div class="card-head"><h3>各模块得分</h3></div><div class="prog-list static">${Object.entries(byMod).map(([mid, r]) =>
    `<div class="prog-row ${r.ok < r.n ? 'weak' : 'good'}"><span class="pr-name">${esc(MOD[mid].short)}</span><span class="pr-num">${r.ok}/${r.n}</span><div class="meter"><i style="width:${r.ok / r.n * 100}%"></i></div></div>`).join('')}</div></section>`));

  const list = h(`<section class="card"><div class="card-head"><h3>逐题回看</h3><div class="seg sm rp-filter"><button class="seg-btn" data-f="wrong">错题与待评</button><button class="seg-btn" data-f="all">全部</button></div></div><div class="rp-list"></div></section>`);

        ctl.reveal(mk.ans[it.qid], mk.testOut && mk.testOut[it.qid]);
        if (res === null) {
          const self = h(`<div class="fb-actions"><button class="btn secondary" data-v="0">没答好，算错</button><button class="btn success" data-v="1">${icon('check', 16)}${q.type === 'code' ? '和答案一致' : '要点都答到了'}</button></div>`);
          $$('button', self).forEach(b => b.onclick = () => {
            const ok = b.dataset.v === '1';
            mk.result[it.qid] = ok; record(it.qid, ok); save(); route();
          });
          ctl.el.append(self);
        }
        d.append(ctl.el);
      };
      d.addEventListener('toggle', () => d.open && build());
      if (d.open) build();
      box.append(d);
    });
    if (!box.children.length) box.append(emptyState('trophy', '没有错题', '这张卷子全对。'));
  }
  $('.rp-filter', list).onclick = e => { const c = e.target.closest('.seg-btn'); if (c) { filter = c.dataset.f; paint(); } };
  paint();
}

/* ============================================================
 * 速查 & 设置
 * ============================================================ */
function viewSheet(main) {
  main.className = 'wide';
  main.append(pageHead({ eyebrow: '考前速查', title: '每个模块最容易错的点', desc: '考前 30 分钟过一遍。' }));
  const c = md(DATA.cheatsheet);
  c.classList.add('card', 'prose', 'sheet');
  main.append(c);
}

function viewSettings(main) {
  main.className = 'wide';
  main.append(pageHead({ eyebrow: '设置', title: '设置与数据' }));
  const sec = h(`<section class="card settings">
    <div class="set-row"><div class="set-ic">${icon('code', 18)}</div><div class="set-text"><b>盲写模式</b><p>代码题不能边写边试运行，写完一次性提交判分，更接近考试时不能反复试错的情况。建议代码题练熟之后再打开。</p></div><label class="switch"><input type="checkbox" ${S.settings.blind ? 'checked' : ''}><i></i></label></div>
    <div class="set-row"><div class="set-ic">${icon('terminal', 18)}</div><div class="set-text"><b>Python 运行环境</b><p>状态：<span id="py-status">${Py.status()}</span>。第一次需要联网下载约 10MB，之后浏览器会缓存。</p></div><button class="btn secondary" data-a="preload">现在加载</button></div>
  </section>`);
  $('input', sec).onchange = e => { S.settings.blind = e.target.checked; save(); toast(e.target.checked ? '盲写模式已开启' : '盲写模式已关闭'); };
  $('[data-a=preload]', sec).onclick = () => Py.preload();
  main.append(sec);
  const data = h(`<section class="card settings">
    <div class="card-head"><h3>进度备份</h3></div>
    <p class="muted">进度保存在当前浏览器里。换浏览器、换电脑、移动这个文件，或者清理浏览器数据之前，先导出一份备份。</p>
    <div class="btn-row"><button class="btn primary" data-a="export">${icon('download', 15)}导出进度文件</button><label class="btn secondary">${icon('upload', 15)}导入进度文件<input type="file" accept=".json" hidden></label><span class="spacer"></span><button class="btn danger" data-a="reset">${icon('trash', 15)}清空所有进度</button></div>
  </section>`);
  $('[data-a=export]', data).onclick = () => {
    const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `考试冲刺进度-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    toast('已导出进度文件');
  };
  $('input[type=file]', data).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const obj = JSON.parse(await f.text());
      if (!obj || typeof obj.q !== 'object') throw new Error('文件格式不对');
      if (!(await confirmBox('导入会覆盖当前进度，确定吗？', '覆盖导入'))) return;
      S = Object.assign(DEFAULT_STATE(), obj); save(); toast('导入成功'); go('#/');
    } catch (err) { toast('导入失败：' + err.message); }
  };
  $('[data-a=reset]', data).onclick = async () => {
    if (!(await confirmBox('清空全部学习进度、错题和模拟考记录？<br><b>这个操作不能撤销</b>，建议先导出备份。', '清空'))) return;
    S = DEFAULT_STATE(); save(); toast('已清空'); go('#/');
  };
  main.append(data);
  main.append(h(`<section class="card"><div class="card-head"><h3>快捷键</h3></div><div class="keys">
    <div><span><kbd>1</kbd>–<kbd>4</kbd></span><span>选择选项（多选题再按一次取消）</span></div>
    <div><span><kbd>Enter</kbd></span><span>提交 / 下一题 / 讲解下一步</span></div>
    <div><span><kbd>←</kbd> <kbd>→</kbd></span><span>讲解翻页、模拟考切换题目</span></div>
    <div><span><kbd>U</kbd></span><span>标记 / 取消「不熟」</span></div>
    <div><span><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span><span>代码题运行测试</span></div>
    <div><span><kbd>Esc</kbd></span><span>退出当前讲解或练习</span></div>
  </div></section>`));
}

initShell();
route();
</script>
