 "if-else 放在前面是合法写法"], "explain": "`if...else` 写在 for 前面，是对每个元素二选一，元素个数不变。", "check": "print([0 if x < 0 else x for x in [-5, 3, -1]])", "lesson": 6}, {"id": "py-26", "m": "py", "type": "single", "tags": [], "stem": "`type((x for x in [1, 2]))` 的结果是？", "options": ["`tuple`", "`list`", "`generator`", "语法错误"], "answer": [2], "why": ["Python 没有\"元组推导式\"", "列表推导式用方括号", "圆括号推导式得到生成器", "这是合法写法"], "explain": "`(x for x in ...)` 是生成器表达式，按需逐个产生值。想要元组要写 `tuple(x for x in ...)`。", "check": "print(type((x for x in [1, 2])).__name__)", "lesson": 6}, {"id": "py-27", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ndef f(x):\n    x * 2\n\nprint(f(3))\n```", "options": ["`6`", "`None`", "`3`", "报错"], "answer": [1], "why": ["算了 `x * 2`，但没有 `return` 交回去", "没有 return 的函数返回 None", "函数没有返回 x", "代码合法"], "explain": "函数只有通过 `return` 才会交回结果；没有 `return` 就返回 `None`。", "check": "def f(x):\n    x * 2\n\nprint(f(3))", "lesson": 7}, {"id": "py-28", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ndef g():\n    return 'a', 'b'\n\nx = g()\nprint(x)\n```", "options": ["`a b`", "`('a', 'b')`", "`['a', 'b']`", "`a`"], "answer": [1], "why": ["那是 `print('a', 'b')` 的效果", "返回的是一个元组", "逗号打包出来的是元组，不是列表", "两个值都会返回"], "explain": "`return 'a', 'b'` 返回元组 `('a', 'b')`，用一个变量接就拿到整个元组。", "check": "def g():\n    return 'a', 'b'\n\nx = g()\nprint(x)", "lesson": 7}, {"id": "py-29", "m": "py", "type": "single", "tags": [], "stem": "执行 `a, *b, c = [1, 2, 3, 4, 5]` 后，`b` 是？", "options": ["`(2, 3, 4)`", "`[2, 3, 4]`", "`[2]`", "报错"], "answer": [1], "why": ["星号变量总是列表", "a 取第一个，c 取最后一个，中间的都给 b", "星号会收集所有剩余的", "有星号时个数可以不同"], "explain": "`*b` 收集\"没被其他变量取走的\"全部元素，结果是列表。", "check": "a, *b, c = [1, 2, 3, 4, 5]\nprint(b)", "lesson": 7}, {"id": "py-30", "m": "py", "type": "single", "tags": [], "stem": "`x, y = 1, 2, 3` 执行会怎样？", "options": ["`x=1, y=2`，3 被丢掉", "`x=1, y=(2, 3)`", "抛出 `ValueError`", "抛出 `TypeError`"], "answer": [2], "why": ["Python 不会自动丢弃多余的值", "不加星号不会收集剩余值", "左边 2 个变量，右边 3 个值，个数不匹配", "个数不匹配是 ValueError"], "explain": "报错信息是 `ValueError: too many values to unpack (expected 2)`。", "lesson": 7}, {"id": "py-31", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\na = [2, 3, 1]\nb = sorted(a)\nprint(a)\n```", "options": ["`[2, 3, 1]`", "`[1, 2, 3]`", "`None`", "报错"], "answer": [0], "why": ["`sorted` 返回新列表，不改原列表", "那是 b 的值", "`sorted` 不改 a，a 还是原来的列表", "代码合法"], "explain": "`sorted()` 不修改原列表；`list.sort()` 才会原地修改。", "check": "a = [2, 3, 1]\nb = sorted(a)\nprint(a)", "lesson": 8}, {"id": "py-32", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\na = [2, 3, 1]\na = a.sort()\nprint(a)\n```", "options": ["`[1, 2, 3]`", "`[2, 3, 1]`", "`None`", "报错"], "answer": [2], "why": ["`a.sort()` 返回 None，又被赋给了 a", "a 已经被重新赋值了", "`sort()` 返回 None，然后 `a = None`", "代码可以运行，只是结果出乎意料"], "explain": "`list.sort()` 原地排序、返回 `None`，千万别写 `a = a.sort()`。", "check": "a = [2, 3, 1]\na = a.sort()\nprint(a)", "lesson": 8}, {"id": "py-33", "m": "py", "type": "single", "tags": [], "stem": "`sorted(['bb', 'a', 'ccc'], key=len, reverse=True)` 的结果是？", "options": ["`['a', 'bb', 'ccc']`", "`['ccc', 'bb', 'a']`", "`['bb', 'a', 'ccc']`", "`['a', 'ccc', 'bb']`"], "answer": [1], "why": ["这是不加 reverse 的结果", "按长度从长到短", "没有排序", "不是任何合理的排序结果"], "explain": "`key=len` 按长度比较，`reverse=True` 从大到小。", "check": "print(sorted(['bb', 'a', 'ccc'], key=len, reverse=True))", "lesson": 8}, {"id": "py-34", "m": "py", "type": "single", "tags": [], "stem": "\"Python 的排序是稳定的\"，意思是？", "options": ["排序结果每次运行都可能不同", "key 相等的元素，排序后保持原来的相对顺序", "排序不会修改原列表", "排序时不会报错"], "answer": [1], "why": ["恰好相反，排序结果是确定的", "这就是\"稳定\"的定义", "那是 `sorted` 的特点，和\"稳定\"无关", "和\"稳定\"无关"], "explain": "稳定性只关心\"比较结果相等\"的元素：它们保持原有先后顺序。", "lesson": 8}, {"id": "py-35", "m": "py", "type": "single", "tags": [], "stem": "运行下面代码，输出是？\n\n```python\na = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)\n```", "options": ["`[1, 2, 3]`", "`[1, 2, 3, 4]`", "`[4]`", "报错"], "answer": [1], "explain": "`b = a` 不复制列表，`a` 和 `b` 指向同一个对象，通过 `b` 修改，`a` 也看得到。", "check": "a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)"}, {"id": "py-36", "m": "py", "type": "single", "tags": [], "stem": "下面哪个表达式得到的是**空集合**？", "options": ["`{}`", "`set()`", "`[]`", "`()`"], "answer": [1], "explain": "`{}` 是空字典；空集合只能用 `set()` 创建。"}, {"id": "py-37", "m": "py", "type": "single", "tags": [], "stem": "`t = (1)` 执行后，`type(t)` 是？", "options": ["`int`", "`tuple`", "`list`", "`set`"], "answer": [0], "explain": "括号在这里只是普通的分组括号，`(1)` 就是 `1`。单元素元组要写 `(1,)`。"}, {"id": "py-38", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nprint([x * 2 for x in range(5) if x % 2 == 1])\n```", "options": ["`[0, 2, 4, 6, 8]`", "`[2, 6]`", "`[1, 3]`", "`[0, 4, 8]`"], "answer": [1], "explain": "`range(5)` 中奇数是 1、3，乘 2 得到 `[2, 6]`。", "check": "print([x * 2 for x in range(5) if x % 2 == 1])"}, {"id": "py-39", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nnums = [3, 1, 2]\nr = nums.sort()\nprint(r)\n```", "options": ["`[1, 2, 3]`", "`[3, 1, 2]`", "`None`", "报错"], "answer": [2], "explain": "`list.sort()` 原地排序，返回 `None`。想要新列表请用 `sorted(nums)`。", "check": "nums = [3, 1, 2]\nr = nums.sort()\nprint(r)"}, {"id": "py-40", "m": "py", "type": "single", "tags": [], "stem": "```python\ndef f():\n    return 1, 2\n```\n\n`type(f())` 的结果是？", "options": ["`list`", "`tuple`", "`int`", "`dict`"], "answer": [1], "explain": "`return 1, 2` 返回一个元组 `(1, 2)`，调用方可以用 `a, b = f()` 解包。"}, {"id": "py-41", "m": "py", "type": "single", "tags": [], "stem": "执行 `a, *b = [1, 2, 3, 4]` 后，`b` 的值是？", "options": ["`(2, 3, 4)`", "`[2, 3, 4]`", "`4`", "`[4]`"], "answer": [1], "explain": "带星号的变量收集剩余元素，并且**总是 list**。", "check": "a, *b = [1, 2, 3, 4]\nprint(b)"}, {"id": "py-42", "m": "py", "type": "single", "tags": [], "stem": "`sorted(['b', 'A', 'c'])` 的结果是？", "options": ["`['b', 'A', 'c']`", "`['A', 'b', 'c']`", "`['b', 'c', 'A']`", "`['c', 'b', 'A']`"], "answer": [1], "explain": "字符串按字符编码比较，大写字母（'A'=65）排在小写字母（'b'=98）之前。", "check": "print(sorted(['b', 'A', 'c']))"}, {"id": "py-43", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nrows = [(\"a\", 2), (\"b\", 1), (\"c\", 2)]\nprint(sorted(rows, key=lambda x: x[1]))\n```", "options": ["`[('b', 1), ('a', 2), ('c', 2)]`", "`[('b', 1), ('c', 2), ('a', 2)]`", "`[('a', 2), ('c', 2), ('b', 1)]`", "顺序不确定"], "answer": [0], "explain": "Python 排序是**稳定**的：key 相同的 `('a', 2)` 和 `('c', 2)` 保持原来的相对顺序。", "check": "rows = [(\"a\", 2), (\"b\", 1), (\"c\", 2)]\nprint(sorted(rows, key=lambda x: x[1]))"}, {"id": "py-44", "m": "py", "type": "single", "tags": [], "stem": "已知 `d = {'a': 1}`，下面哪个操作会抛出 `KeyError`？", "options": ["`d.get('b')`", "`d.get('b', 0)`", "`d['b']`", "`'b' in d`"], "answer": [2], "explain": "用方括号取不存在的键抛 `KeyError`；`get` 返回默认值（不给则为 `None`）；`in` 只返回 `False`。"}, {"id": "py-45", "m": "py", "type": "single", "tags": [], "stem": "下面哪个对象**可以**作为字典的键？", "options": ["`[1, 2]`", "`{1, 2}`", "`(1, 2)`", "`{'a': 1}`"], "answer": [2], "explain": "字典键必须可哈希。list、set、dict 都是可变类型、不可哈希；元素都不可变的 tuple 可以做键。"}, {"id": "py-46", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ngrid = [[0] * 2] * 2\ngrid[0][0] = 1\nprint(grid)\n```", "options": ["`[[1, 0], [0, 0]]`", "`[[1, 0], [1, 0]]`", "`[[1, 1], [0, 0]]`", "报错"], "answer": [1], "explain": "`[[0]*2] * 2` 复制的是对同一个内层列表的引用，两行其实是同一个对象。正确写法：`[[0] * 2 for _ in range(2)]`。", "check": "grid = [[0] * 2] * 2\ngrid[0][0] = 1\nprint(grid)"}, {"id": "py-47", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nx = [1, 2]\ny = x[:]\ny.append(3)\nprint(x, y is x)\n```", "options": ["`[1, 2, 3] True`", "`[1, 2, 3] False`", "`[1, 2] False`", "`[1, 2] True`"], "answer": [2], "explain": "`x[:]` 产生一个新列表（浅拷贝），修改 `y` 不影响 `x`，二者也不是同一个对象。", "check": "x = [1, 2]\ny = x[:]\ny.append(3)\nprint(x, y is x)"}, {"id": "py-48", "m": "py", "type": "single", "tags": [], "stem": "`[x if x > 0 else 0 for x in [-1, 2, -3]]` 的结果是？", "options": ["`[2]`", "`[0, 2, 0]`", "`[-1, 2, -3]`", "语法错误"], "answer": [1], "explain": "写在 `for` 前面的 `if...else` 是条件表达式，对每个元素做变换，不会过滤元素。", "check": "print([x if x > 0 else 0 for x in [-1, 2, -3]])"}, {"id": "py-49", "m": "py", "type": "single", "tags": [], "stem": "有交易列表 `data = [{'id': 'a', 'amt': 5}, {'id': 'b', 'amt': 9}, {'id': 'c', 'amt': 5}]`，要求**金额降序、金额相同按 id 升序**，正确的写法是？", "options": ["`sorted(data, key=lambda r: r['amt'], reverse=True)`", "`sorted(data, key=lambda r: (-r['amt'], r['id']))`", "`sorted(data, key=lambda r: (r['amt'], r['id']), reverse=True)`", "`data.sort(key=lambda r: r['amt'])`"], "answer": [1], "explain": "用元组做 key 实现多关键字排序；数值取负号实现降序。C 会让 id 也降序；A 只按金额排（相同金额靠稳定性保持原序，恰好也对，但没有表达\"按 id 升序\"的要求，换个输入顺序就错）；D 是升序且返回 `None`。"}, {"id": "py-50", "m": "py", "type": "single", "tags": [], "stem": "`a, b = [1, 2, 3]` 执行结果是？", "options": ["`a=1, b=2`", "`a=1, b=[2, 3]`", "抛出 `ValueError`", "抛出 `TypeError`"], "answer": [2], "explain": "左右两边个数不一致：`ValueError: too many values to unpack`。想收集剩余元素要写 `a, *b = ...`。"}, {"id": "py-51", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\na = [1, 2, 3]\na.extend([4, 5])\nprint(len(a))\n```", "options": ["`4`", "`5`", "`3`", "报错"], "answer": [1], "why": ["那是 `append([4, 5])` 的结果", "extend 把 4、5 逐个加进去", "extend 会修改原列表", "代码合法"], "explain": "`extend` 逐个追加；`append` 整体作为一个元素追加。", "check": "a = [1, 2, 3]\na.extend([4, 5])\nprint(len(a))"}, {"id": "py-52", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\na = [5, 6, 7, 8]\nprint(a[-2:])\n```", "options": ["`[7, 8]`", "`[5, 6]`", "`[7]`", "`8`"], "answer": [0], "why": ["从倒数第 2 个取到末尾", "那是 `a[:2]`", "省略结束表示取到末尾", "切片得到的是列表"], "explain": "负下标同样可以用在切片里，`a[-2:]` 是最后两个元素。", "check": "a = [5, 6, 7, 8]\nprint(a[-2:])"}, {"id": "py-53", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nd = {'a': 1, 'b': 2}\nfor k, v in d.items():\n    print(k, end='')\n```", "options": ["`ab`", "`12`", "`a1b2`", "顺序不确定"], "answer": [0], "why": ["按插入顺序遍历，只打印了键", "打印的是 k（键）", "只打印了 k", "字典按插入顺序遍历（3.7+）"], "explain": "`d.items()` 给出 `(键, 值)`，`end=''` 表示打印后不换行。", "check": "d = {'a': 1, 'b': 2}\nfor k, v in d.items():\n    print(k, end='')"}, {"id": "py-54", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nd = {'x': 1}\nd['x'] += 5\nprint(d['x'])\n```", "options": ["`1`", "`6`", "`5`", "抛出 `KeyError`"], "answer": [1], "why": ["值已经被修改", "`d['x'] = d['x'] + 5`", "是在原值 1 的基础上加 5", "'x' 键存在"], "explain": "`+=` 等价于 `d['x'] = d['x'] + 5`。注意：如果键不存在，`d['y'] += 5` 会抛 `KeyError`，所以分组累加要用 `get`。", "check": "d = {'x': 1}\nd['x'] += 5\nprint(d['x'])"}, {"id": "py-55", "m": "py", "type": "single", "tags": [], "stem": "下面代码执行时会怎样？\n\n```python\ntotal = {}\nfor cid in ['A', 'B', 'A']:\n    total[cid] += 1\n```", "options": ["`total` 为 `{'A': 2, 'B': 1}`", "抛出 `KeyError`", "`total` 为 `{'A': 1, 'B': 1}`", "`total` 为空字典"], "answer": [1], "why": ["第一次遇到 'A' 时，键还不存在", "`total['A'] += 1` 要先读 `total['A']`，此时不存在", "代码在第一次循环就出错了", "程序会报错而不是静默"], "explain": "`+=` 需要先读出原值。键不存在时要用 `total[cid] = total.get(cid, 0) + 1`。"}, {"id": "py-56", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nids = ['c', 'a', 'c', 'b', 'a']\nseen, out = set(), []\nfor x in ids:\n    if x not in seen:\n        seen.add(x)\n        out.append(x)\nprint(out)\n```", "options": ["`['c', 'a', 'b']`", "`['a', 'b', 'c']`", "`['c', 'a', 'c', 'b', 'a']`", "`['b', 'a', 'c']`"], "answer": [0], "why": ["按第一次出现的顺序保留", "没有排序，保留的是原始出现顺序", "重复的被跳过了", "不是倒序"], "explain": "这就是**稳定去重**模板：集合负责\"见没见过\"，列表负责保存顺序。", "check": "ids = ['c', 'a', 'c', 'b', 'a']\nseen, out = set(), []\nfor x in ids:\n    if x not in seen:\n        seen.add(x)\n        out.append(x)\nprint(out)"}, {"id": "py-57", "m": "py", "type": "single", "tags": [], "stem": "下面哪种写法能**保持原顺序**地去重？", "options": ["`list(set(ids))`", "`list(dict.fromkeys(ids))`", "`sorted(set(ids))`", "`set(ids)`"], "answer": [1], "why": ["集合无序，转回列表的顺序没有保证", "字典键不重复且保持插入顺序", "这是排序后的顺序，不是原顺序", "结果是集合，而且无序"], "explain": "`dict.fromkeys(ids)` 用每个元素当键（值都是 None），重复键只保留第一次，且字典保持插入顺序。"}, {"id": "py-58", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ns = {1, 2}\ns.add(2)\ns.add(3)\nprint(len(s))\n```", "options": ["`4`", "`3`", "`2`", "报错"], "answer": [1], "why": ["2 已经在集合里，不会重复加入", "集合最终是 {1, 2, 3}", "3 被成功加入了", "重复 add 不报错"], "explain": "向集合添加已存在的元素什么也不会发生。", "check": "s = {1, 2}\ns.add(2)\ns.add(3)\nprint(len(s))"}, {"id": "py-59", "m": "py", "type": "single", "tags": [], "stem": "`{1, 2, 3} - {2, 5}` 的结果是？", "options": ["`{1, 3}`", "`{1, 3, 5}`", "`{2}`", "`{5}`"], "answer": [0], "why": ["左边有、右边没有的", "那是对称差 `^`", "那是交集 `&`", "方向反了"], "explain": "差集 `x - y`：在 x 中但不在 y 中的元素。", "check": "print({1, 2, 3} - {2, 5})"}, {"id": "py-60", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nimport copy\na = [[1, 2], [3]]\nb = copy.deepcopy(a)\nb[0].append(9)\nprint(a)\n```", "options": ["`[[1, 2], [3]]`", "`[[1, 2, 9], [3]]`", "`[[1, 2], [3], 9]`", "报错"], "answer": [0], "why": ["深拷贝连内层列表一起复制", "那是浅拷贝（`a[:]`、`a.copy()`）的结果", "append 加在 b[0] 里", "代码合法"], "explain": "深拷贝后两者完全独立。", "check": "import copy\na = [[1, 2], [3]]\nb = copy.deepcopy(a)\nb[0].append(9)\nprint(a)"}, {"id": "py-61", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\na = [[1], [2]]\nb = list(a)\nb[0].append(5)\nb.append([3])\nprint(a)\n```", "options": ["`[[1], [2]]`", "`[[1, 5], [2]]`", "`[[1, 5], [2], [3]]`", "`[[1], [2], [3]]`"], "answer": [1], "why": ["内层列表是共享的，`b[0].append` 会影响 a", "内层共享（受影响），外层独立（`b.append` 不影响 a）", "外层是新列表，`b.append` 不影响 a", "方向搞反了"], "explain": "`list(a)` 是浅拷贝：外层是新列表，内层元素仍是同一批对象。", "check": "a = [[1], [2]]\nb = list(a)\nb[0].append(5)\nb.append([3])\nprint(a)"}, {"id": "py-62", "m": "py", "type": "single", "tags": [], "stem": "`{k: v * 2 for k, v in {'a': 1, 'b': 2}.items()}` 的结果是？", "options": ["`{'a': 2, 'b': 4}`", "`{'aa': 1, 'bb': 2}`", "`[2, 4]`", "`{2, 4}`"], "answer": [0], "why": ["每个值乘 2，键不变", "乘 2 的是值 v，不是键 k", "花括号 + 冒号是字典推导式", n": "字符串是可迭代对象，可以解包；`*rest` 永远是 list。", "check": "first, *rest = 'abc'\nprint(rest)"}, {"id": "py-68", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ndata = [('x', 3), ('y', 1), ('z', 2)]\ndata.sort(key=lambda t: t[1], reverse=True)\nprint(data[0])\n```", "options": ["`('x', 3)`", "`('y', 1)`", "`None`", "`3`"], "answer": [0], "why": ["按第 2 个元素从大到小，3 最大", "reverse=True 是从大到小", "打印的是 data[0]，不是 sort 的返回值", "data[0] 是整个元组"], "explain": "`sort` 原地排序后 data 变了，再取第一个元素。", "check": "data = [('x', 3), ('y', 1), ('z', 2)]\ndata.sort(key=lambda t: t[1], reverse=True)\nprint(data[0])"}, {"id": "py-69", "m": "py", "type": "single", "tags": [], "stem": "`sorted({'b': 1, 'a': 2})` 的结果是？", "options": ["`['a', 'b']`", "`[1, 2]`", "`{'a': 2, 'b': 1}`", "报错"], "answer": [0], "why": ["对字典排序得到排好序的**键**列表", "遍历字典得到的是键", "sorted 总是返回列表", "字典可以被 sorted"], "explain": "`sorted` 接收任何可迭代对象并返回列表；遍历字典得到键。按值排要写 `sorted(d.items(), key=lambda kv: kv[1])`。", "check": "print(sorted({'b': 1, 'a': 2}))"}, {"id": "py-70", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nd = {'A': 3, 'B': 5, 'C': 1}\nprint(sorted(d, key=lambda k: d[k], reverse=True))\n```", "options": ["`['B', 'A', 'C']`", "`['C', 'A', 'B']`", "`[5, 3, 1]`", "`['A', 'B', 'C']`"], "answer": [0], "why": ["按值 5、3、1 从大到小排的键", "方向反了", "排序的是键，结果也是键", "这是按键本身排序"], "explain": "`key=lambda k: d[k]` 表示\"用每个键对应的值来比较\"，结果仍是键的列表。", "check": "d = {'A': 3, 'B': 5, 'C': 1}\nprint(sorted(d, key=lambda k: d[k], reverse=True))"}, {"id": "py-71", "m": "py", "type": "single", "tags": [], "stem": "`sorted(['10', '9', '2'])` 的结果是？", "options": ["`['2', '9', '10']`", "`['10', '2', '9']`", "`['9', '2', '10']`", "报错"], "answer": [1], "why": ["这是按数值排序的结果，但这些是字符串", "字符串逐字符比较，'1' < '2' < '9'", "不是倒序", "字符串可以比较"], "explain": "字符串比较从第一个字符开始逐个比，`'10'` 的首字符 `'1'` 最小，所以排最前。想按数值排要 `key=int`。", "check": "print(sorted(['10', '9', '2']))"}, {"id": "py-72", "m": "py", "type": "multi", "tags": [], "stem": "下列哪些类型是**可变**（mutable）的？", "options": ["`list`", "`dict`", "`set`", "`tuple`", "`str`"], "answer": [0, 1, 2], "explain": "list、dict、set 可变；tuple、str、int、frozenset 不可变。"}, {"id": "py-73", "m": "py", "type": "multi", "tags": [], "stem": "关于 `sorted()` 与 `list.sort()`，说法正确的有？", "options": ["`sorted()` 返回新列表，原对象不变", "`list.sort()` 原地排序并返回 `None`", "二者都是稳定排序", "`list.sort()` 可以直接用在元组上", "二者都支持 `key` 和 `reverse` 参数"], "answer": [0, 1, 2, 4], "explain": "元组不可变，没有 `sort` 方法，但可以 `sorted(t)` 得到一个新列表。"}, {"id": "py-74", "m": "py", "type": "multi", "tags": [], "stem": "下列哪些解包语句可以**成功执行**？", "options": ["`a, b = (1, 2)`", "`a, *b = [1]`", "`a, b = {'x': 1, 'y': 2}`", "`a, b = [1, 2, 3]`", "`a, b = 'xy'`"], "answer": [0, 1, 2, 4], "explain": "`a, *b = [1]` 得到 `a=1, b=[]`；遍历字典得到键；字符串也是可迭代对象。D 个数不匹配，抛 `ValueError`。"}, {"id": "py-75", "m": "py", "type": "multi", "tags": [], "stem": "关于字典（Python 3.7+），说法正确的有？", "options": ["遍历顺序与插入顺序一致", "键必须是可哈希对象", "`'v' in d` 判断的是 `'v'` 是否为某个**值**", "`d.items()` 可以得到键值对", "`d.get(k, 0)` 在键不存在时返回 0"], "answer": [0, 1, 3, 4], "explain": "`in` 检查的是键。判断值要写 `v in d.values()`。"}, {"id": "py-76", "m": "py", "type": "multi", "tags": [], "stem": "已知 `a = [[1], [2]]`，关于复制，说法正确的有？", "options": ["`b = a` 后，`b is a` 为 `True`", "`c = a[:]` 后，`c is a` 为 `False`", "`c = a[:]` 后执行 `c[0].append(9)`，`a[0]` 也会变成 `[1, 9]`", "`c = a.copy()` 是深拷贝", "`copy.deepcopy(a)` 得到的对象修改内层列表不影响 `a`"], "answer": [0, 1, 2, 4], "explain": "切片和 `.copy()` 都是浅拷贝：外层新、内层共享。深拷贝要用 `copy.deepcopy`。"}, {"id": "py-77", "m": "py", "type": "multi", "tags": [], "stem": "关于集合 `set`，说法正确的有？", "options": ["会自动去掉重复元素", "`x in s` 判断元素是否存在", "可以用 `s[0]` 取第一个元素", "`{}` 创建空集合", "`set(lst)` 去重后，元素顺序不一定和原列表一致"], "answer": [0, 1, 4], "why": ["集合元素唯一", "而且查找速度很快", "集合无序，不支持下标", "`{}` 是空字典", "集合不保证顺序，所以稳定去重不能只靠 set"], "explain": "集合：唯一、无序、不支持下标；空集合用 `set()`。"}, {"id": "py-78", "m": "py", "type": "multi", "tags": [], "stem": "已知 `nums = [3, -1, 4, -2]`，下列表达式结果为 `[3, 4]` 的有？", "options": ["`[x for x in nums if x > 0]`", "`[x if x > 0 else 0 for x in nums]`", "`sorted(x for x in nums if x > 0)`", "`nums[::2]`", "`nums[0:2]`"], "answer": [0, 2, 3], "why": ["过滤出正数", "结果是 `[3, 0, 4, 0]`，不会丢元素", "过滤后排序，3 < 4 顺序不变", "步长 2 取下标 0、2，即 3 和 4", "结果是 `[3, -1]`"], "explain": "后置 if 过滤，前置 if-else 变换。切片 `[开始:结束:步长]`，`[::2]` 表示隔一个取一个。"}, {"id": "py-79", "m": "py", "type": "multi", "tags": [], "stem": "下列哪些写法得到的是**元组**？", "options": ["`(1,)`", "`1, 2`", "`(1)`", "`tuple([1, 2])`", "`(x for x in [1, 2])`"], "answer": [0, 1, 3], "why": ["单元素元组要带逗号", "逗号分隔自动打包", "只是整数 1", "把列表转换成元组", "这是生成器"], "explain": "逗号才是元组的本体；圆括号推导式是生成器。"}, {"id": "py-80", "m": "py", "type": "multi", "tags": [], "stem": "已知 `d = {'a': 1}`，下列操作**不会**抛出异常的有？", "options": ["`d.get('z')`", "`d['z'] = 2`", "`d['z'] + 1`", "`'z' in d`", "`d.get('z', 0) + 1`"], "answer": [0, 1, 3, 4], "why": ["返回 None", "赋值时键不存在就是新增", "读取不存在的键会抛 KeyError", "返回 False", "get 返回 0，结果为 1"], "explain": "只有**读取**不存在的键（`d[k]`）才会抛 `KeyError`。"}, {"id": "py-81", "m": "py", "type": "multi", "tags": [], "stem": "关于函数返回值，说法正确的有？", "options": ["没有 `return` 语句的函数返回 `None`", "`return a, b` 实际返回一个元组", "`print(x)` 和 `return x` 效果相同", "执行到 `return` 后，函数后面的代码不再执行", "一个函数只能写一个 `return`"], "answer": [0, 1, 3], "why": ["隐式返回 None", "逗号打包成元组", "print 是显示，return 是交回结果", "return 立即结束函数", "可以在不同分支写多个 return"], "explain": "`print` 给人看，`return` 给程序用。"}], "refs": [{"label": "Python教程·数据结构", "url": "https://docs.python.org/zh-cn/3/tutorial/datastructures.html"}, {"label": "Python教程·更多控制流工具", "url": "https://docs.python.org/zh-cn/3/tutorial/controlflow.html"}], "id": "py", "title": "Python基础与数据结构", "short": "Python基础", "group": "通用必考模块", "exam": "01—03、10（单选）、21（多选）"}, {"lessons": [{"title": "可变对象 vs 不可变对象", "cards": ["| 不可变（immutable） | 可变（mutable） |\n|---|---|\n| `int` `float` `bool` `str` `tuple` `frozenset` `bytes` `None` | `list` `dict` `set` `bytearray` 自定义类实例 |\n\n**\"修改\"不可变对象，其实是创建了新对象：**\n\n```python\ns = 'ab'\nprint(id(s))\ns += 'c'        # 生成新字符串 'abc'，s 改为指向它\nprint(id(s))    # 与上面不同\n\ns[0] = 'z'      # TypeError: 'str' object does not support item assignment\n```\n\n**元组本身不可变，但里面的列表可以变：**\n\n```python\nt = ([1], 2)\nt[0].append(9)  # 可以：t == ([1, 9], 2)\nt[0] = [0]      # TypeError\n```"]}, {"title": "参数传递：传的是对象引用", "cards": ["Python 函数调用时把**对象的引用**传给形参（官方说法 call by object reference / 共享传参）。\n\n- 在函数里**原地修改**可变对象（`append`、`+=` 列表、`d[k]=v`）→ 调用方能看到。\n- 在函数里**重新赋值**形参（`a = ...`）→ 只是形参换了指向，调用方不受影响。\n\n```python\ndef f1(a):\n    a.append(1)      # 原地修改\ndef f2(a):\n    a = a + [1]      # 创建新列表并重新绑定局部变量 a\n\nx = [0]; f1(x); print(x)   # [0, 1]\ny = [0]; f2(y); print(y)   # [0]\n```\n\n> 注意：对列表来说 `a += [1]` 等同于 `a.extend([1])`，是**原地修改**；而 `a = a + [1]` 是新对象。"]}, {"title": "默认参数求值时机（必考简答）", "cards": ["**默认参数值只在 `def` 执行（函数定义）时求值一次**，之后每次调用都复用**同一个对象**。如果默认值是可变对象（list/dict/set），修改会在多次调用之间累积。\n\n```python\ndef add_item(x, bucket=[]):\n    bucket.append(x)\n    return bucket\n\nprint(add_item(1))   # [1]\nprint(add_item(2))   # [1, 2]   ← 不是 [2]！\nprint(add_item.__defaults__)   # ([1, 2],)  默认值对象就存在函数上\n```\n\n**标准修复：用 `None` 作哨兵，在函数体内新建对象**\n\n```python\ndef add_item(x, bucket=None):\n    if bucket is None:\n        bucket = []      # 每次调用都新建\n    bucket.append(x)\n    return bucket\n```\n\n同理：`def log(msg, ts=datetime.now())` 的时间戳会被永久固定成定义函数时的时间。\n\n**简答题答题模板（建议背下来）**\n\n1. **现象**：多次调用时结果累积 / 互相影响。\n2. **原因**：默认值在函数**定义时只求值一次**；所有未传该参数的调用**共享同一个**默认对象；列表是**可变对象**，`append` 原地修改了它。\n3. **修复**：默认值改为 `None`，在函数体内 `if x is None: x = []`。\n4. **延伸**：不可变默认值（数字、字符串、元组、None）没有这个问题。"]}, {"title": "常见内置类型速记", "cards": ["```python\ntype(1)        # int\ntype(1.0)      # float\ntype('1')      # str\ntype(None)     # NoneType\ntype((1,))     # tuple\nisinstance(True, int)   # True —— bool 是 int 的子类\nTrue + True             # 2\n0.1 + 0.2 == 0.3        # False（浮点近似，金额要用 Decimal）\nbool([]), bool(''), bool(0), bool(None)   # 都是 False\n```\n\n- 判断 `None` 用 `is None`，不要用 `== None`。\n- `is` 比较是否同一对象；`==` 比较值是否相等。"]}], "questions": [{"id": "func-1", "m": "func", "type": "single", "tags": [], "stem": "下面代码最后一行输出是？\n\n```python\ndef add(x, lst=[]):\n    lst.append(x)\n    return lst\n\nadd(1)\nprint(add(2))\n```", "options": ["`[2]`", "`[1, 2]`", "`[1]`", "报错"], "answer": [1], "explain": "默认列表在函数定义时只创建一次，两次调用共享同一个列表。", "check": "def add(x, lst=[]):\n    lst.append(x)\n    return lst\n\nadd(1)\nprint(add(2))"}, {"id": "func-2", "m": "func", "type": "single", "tags": [], "stem": "函数的默认参数值是在什么时候求值的？", "options": ["每次调用函数时", "执行 `def` 语句（定义函数）时，只求值一次", "第一次调用函数时", "函数返回时"], "answer": [1], "explain": "默认值在定义时求值并保存在 `函数.__defaults__` 中，之后每次调用复用。"}, {"id": "func-3", "m": "func", "type": "single", "tags": [], "stem": "下面哪种类型是**不可变**的？", "options": ["`list`", "`dict`", "`tuple`", "`set`"], "answer": [2], "explain": "tuple 创建后不能增删改元素。"}, {"id": "func-4", "m": "func", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ndef f(a):\n    a = a + [1]\n\nx = [0]\nf(x)\nprint(x)\n```", "options": ["`[0]`", "`[0, 1]`", "`[1]`", "`None`"], "answer": [0], "explain": "`a + [1]` 创建新列表，`a = ...` 只改变局部变量的指向，调用方的 `x` 不受影响。", "check": "def f(a):\n    a = a + [1]\n\nx = [0]\nf(x)\nprint(x)"}, {"id": "func-5", "m": "func", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ndef f(a):\n    a += [1]\n\nx = [0]\nf(x)\nprint(x)\n```", "options": ["`[0]`", "`[0, 1]`", "`[1]`", "报错"], "answer": [1], "explain": "对列表而言 `+=` 是原地扩展（相当于 `extend`），修改了调用方传入的同一个对象。", "check": "def f(a):\n    a += [1]\n\nx = [0]\nf(x)\nprint(x)"}, {"id": "func-6", "m": "func", "type": "single", "tags": [], "stem": "修复\"共享默认列表\"问题，最推荐的写法是？", "options": ["`def f(x, lst=list()):`", "`def f(x, lst=[][:]):`", "`def f(x, lst=None):` 并在函数体内 `if lst is None: lst = []`", "`def f(x, lst=()):` 并在函数体内 `lst.append(x)`"], "answer": [2], "explain": "A、B 的默认值同样只在定义时求值一次；D 元组没有 `append`。用 `None` 哨兵在每次调用时新建列表才是标准做法。"}, {"id": "func-7", "m": "func", "type": "single", "tags": [], "stem": "`isinstance(True, int)` 的结果是？", "options": ["`True`", "`False`", "抛出 `TypeError`", "`None`"], "answer": [0], "explain": "`bool` 是 `int` 的子类，`True == 1`，`False == 0`。"}, {"id": "func-8", "m": "func", "type": "single", "tags": [], "stem": "执行 `s = 'abc'; s[0] = 'z'` 的结果是？", "options": ["`s` 变为 `'zbc'`", "`s` 变为 `'z'`", "抛出 `TypeError`", "抛出 `IndexError`"], "answer": [2], "explain": "字符串不可变，不支持元素赋值。要得到新字符串：`'z' + s[1:]`。"}, {"id": "func-9", "m": "func", "type": "multi", "tags": [], "stem": "关于默认参数，说法正确的有？", "options": ["默认值在函数定义时求值一次", "可变默认值会被所有未传该参数的调用共享", "用 `None` 作为默认值并在函数内新建对象可以避免共享问题", "默认值为整数 0 时也会出现\"结果累积\"问题", "可以通过 `func.__defaults__` 看到当前保存的默认值对象"], "answer": [0, 1, 2, 4], "explain": "整数不可变，不可能被原地修改，因此不会累积。"}, {"id": "func-10", "m": "func", "type": "multi", "tags": [], "stem": "下列哪些是**不可变**类型？", "options": ["`int`", "`str`", "`tuple`", "`frozenset`", "`list`", "`set`"], "answer": [0, 1, 2, 3], "explain": "frozenset 是不可变集合，可以作为字典的键。"}, {"id": "func-11", "m": "func", "type": "short", "tags": [], "stem": "阅读代码，写出两次 `print` 的输出，解释原因，并给出修复后的写法。\n\n```python\ndef append_log(msg, logs=[]):\n    logs.append(msg)\n    return logs\n\nprint(append_log('a'))\nprint(append_log('b'))\n```", "keypoints": ["输出分别是 `['a']` 和 `['a', 'b']`", "默认参数在函数定义时只求值一次", "多次调用共享同一个默认列表对象", "列表是可变对象，append 原地修改导致结果累积", "修复：默认值改为 None，在函数体内 `if logs is None: logs = []`"], "ref": "输出：`['a']`，`['a', 'b']`。\n\n原因：`logs=[]` 这个默认值在 `def` 执行时只创建一次，并保存在函数对象上；之后每次调用不传 `logs`，都用的是**同一个**列表。列表是可变对象，`append` 原地修改它，所以第二次调用时能看到第一次添加的 `'a'`。\n\n修复：\n\n```python\ndef append_log(msg, logs=None):\n    if logs is None:\n        logs = []\n    logs.append(msg)\n    return logs\n```"}, {"id": "func-12", "m": "func", "type": "short", "tags": [], "stem": "说明 Python 中可变对象与不可变对象的区别，各举至少 3 个例子，并说明把它们作为参数传入函数并在函数内修改时，调用方会看到什么。", "keypoints": ["不可变对象创建后内容不能改变，例如 int、str、tuple（frozenset、bool）", "可变对象可以原地修改，例如 list、dict、set", "参数传递传的是对象引用", "函数内原地修改可变对象，调用方可见", "对不可变对象\"修改\"或对形参重新赋值，只是绑定了新对象，调用方不受影响"], "ref": "- **不可变对象**：创建后内容不能改变，如 `int`、`float`、`str`、`tuple`、`frozenset`。看似修改（如 `s += 'x'`）实际是创建新对象。\n- **可变对象**：可以原地修改，如 `list`、`dict`、`set`。\n\n函数传参传递的是**对象引用**。若函数内对可变对象做原地修改（`append`、`d[k]=v`），调用方会看到变化；若对形参重新赋值，或\"修改\"不可变对象，只是让局部变量指向新对象，调用方不受影响。"}, {"id": "func-13", "m": "func", "type": "short", "tags": [], "stem": "下面函数希望记录每次调用时的时间，但发现所有调用记录的时间都一样。解释原因并修复。\n\n```python\nfrom datetime import datetime\n\ndef make_event(name, ts=datetime.now()):\n    return {'name': name, 'ts': ts}\n```", "keypoints": ["`datetime.now()` 作为默认值只在函数定义时执行一次", "之后每次调用都复用这个固定的时间值", "修复：默认值设为 None，在函数体内判断 `if ts is None: ts = datetime.now()`"], "ref": "默认参数表达式 `datetime.now()` 在执行 `def` 时就被求值，结果被保存为默认值，之后所有不传 `ts` 的调用都复用这个固定时间。\n\n```python\ndef make_event(name, ts=None):\n    if ts is None:\n        ts = datetime.now()\n    return {'name': name, 'ts': ts}\n```"}], "refs": [{"label": "Python教程·更多控制流工具", "url": "https://docs.python.org/zh-cn/3/tutorial/controlflow.html"}, {"label": "Python教程·类（作用域）", "url": "https://docs.python.org/zh-cn/3/tutorial/classes.html"}], "id": "func", "title": "函数与对象语义", "short": "函数语义", "group": "通用必考模块", "exam": "29（简答）"}, {"lessons": [{"title": "三者的关系（一张图记住）", "cards": ["```text\n可迭代对象 iterable  ⊃  迭代器 iterator  ⊃  生成器 generator\n（能被 for 遍历）       （能 next() 取值）     （用 yield/生成器表达式创建的迭代器）\n```\n\n| 概念 | 关键方法 | 例子 | 能重复遍历吗 |\n|---|---|---|---|\n| 可迭代对象 | `__iter__()`（返回一个迭代器） | list、tuple、str、dict、set、range、文件 | 容器可以，每次 `iter()` 都给新迭代器 |\n| 迭代器 | `__next__()` + `__iter__()`（返回自身） | `iter([1,2])`、`map(...)`、`zip(...)`、文件对象 | **不能**，只能走一遍 |\n| 生成器 | 自动实现迭代器协议 | `def` 里含 `yield` 的函数调用结果、`(x for x in ...)` | **不能**，耗尽后为空 |\n\n- `iter(可迭代对象)` → 得到迭代器；`next(迭代器)` → 取下一个值；没有值了抛 `StopIteration`。\n- `for` 循环内部就是：先 `iter()`，再不停 `next()`，遇到 `StopIteration` 自动结束。\n- **list 是可迭代对象，但不是迭代器**：`next([1,2])` 会抛 `TypeError`。"]}, {"title": "生成器：按需产生数据", "cards": ["```python\ndef count_up(n):\n    print('start')\n    i = 0\n    while i < n:\n        yield i        # 产出一个值并\"暂停\"，下次 next() 从这里继续\n        i += 1\n\ng = count_up(3)        # 此时函数体一行都没执行！只得到生成器对象\nnext(g)                # 打印 start，返回 0\nnext(g)                # 1\nnext(g)                # 2\nnext(g)                # StopIteration\n```\n\n**为什么省内存（惰性求值 / 按需产生）**：生成器不会一次性把所有结果放进内存，而是每次被请求时才计算下一个值。\n\n```python\nsum([x * x for x in range(10**7)])   # 先建 1000 万元素的列表，再求和\nsum(x * x for x in range(10**7))     # 生成器表达式：边产生边累加，内存几乎恒定\n```\n\n适用场景：大文件逐行处理、无限序列、流水线式数据处理。"]}, {"title": "生成器耗尽（高频陷阱）", "cards": ["迭代器 / 生成器**只能遍历一次**，耗尽后再遍历什么也得不到（不会报错，只是为空）。\n\n```python\ng = (x for x in range(3))\nprint(list(g))   # [0, 1, 2]\nprint(list(g))   # []      ← 已耗尽\nprint(sum(g))    # 0\n\nm = map(str, [1, 2])   # Python 3 中 map / zip / filter 返回的都是迭代器\nlist(m)          # ['1', '2']\nlist(m)          # []\n\nit = iter([1, 2, 3])\nnext(it)         # 1\nlist(it)         # [2, 3]  从当前位置继续\n\nnext(g, 'END')   # 耗尽时返回默认值 'END'，不抛异常\n```\n\n需要多次使用：先 `data = list(g)` 保存，或者重新调用生成器函数得到新的生成器。"]}, {"title": "简答题答题模板（题号 30）", "cards": ["1. **可迭代对象**：实现了 `__iter__`、能被 `for` 遍历的对象，如 list、str、dict；可以用 `iter()` 得到迭代器。\n2. **迭代器**：实现了 `__next__`（和返回自身的 `__iter__`），通过 `next()` 逐个取值，取完抛 `StopIteration`；迭代器本身也是可迭代对象。\n3. **生成器**：一种特殊的迭代器，由含 `yield` 的函数或生成器表达式创建，自动实现迭代器协议。\n4. **关系**：生成器 ⊂ 迭代器 ⊂ 可迭代对象。\n5. **按需产生**：惰性计算，每次请求才产生下一个值，节省内存，适合大数据 / 无限序列。\n6. **耗尽**：只能遍历一次，耗尽后再遍历得到空结果；`next()` 抛 `StopIteration`；要重用需重新创建或先转成 list。"]}], "questions": [{"id": "iter-1", "m": "iter", "type": "single", "tags": [], "stem": "下面代码第二个 `print` 输出是？\n\n```python\ng = (x for x in range(3))\nprint(list(g))\nprint(list(g))\n```", "options": ["`[0, 1, 2]`", "`[]`", "`None`", "抛出 `StopIteration`"], "answer": [1], "explain": "生成器只能遍历一次，第一次 `list(g)` 已经把它耗尽；再次遍历得到空列表，不会报错。", "check": "g = (x for x in range(3))\nlist(g)\nprint(list(g))"}, {"id": "iter-2", "m": "iter", "type": "single", "tags": [], "stem": "下面哪个对象是**迭代器**？", "options": ["`[1, 2, 3]`", "`'abc'`", "`iter([1, 2, 3])`", "`range(3)`"], "answer": [2], "explain": "list、str、range 都是可迭代对象但不是迭代器（不能直接 `next()`）；`iter(...)` 返回迭代器。"}, {"id": "iter-3", "m": "iter", "type": "single", "tags": [], "stem": "对一个已经耗尽的生成器调用 `next(g)`（不提供默认值），会发生什么？", "options": ["返回 `None`", "从头重新开始", "抛出 `StopIteration`", "抛出 `IndexError`"], "answer": [2], "explain": "迭代器协议规定没有更多元素时抛 `StopIteration`。`next(g, default)` 可以返回默认值代替。"}, {"id": "iter-4", "m": "iter", "type": "single", "tags": [], "stem": "```python\ndef gen():\n    print('run')\n    yield 1\ng = gen()\n```\n执行完上述代码后，屏幕上会输出什么？", "options": ["`run`", "`1`", "什么都不输出", "`run` 和 `1`"], "answer": [2], "explain": "调用生成器函数只是创建生成器对象，函数体直到第一次 `next()` 才开始执行。"}, {"id": "iter-5", "m": "iter", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nit = iter([1, 2, 3])\nnext(it)\nprint(list(it))\n```", "options": ["`[1, 2, 3]`", "`[2, 3]`", "`[3]`", "`[]`"], "answer": [1], "explain": "迭代器记住当前位置，`next` 取走了 1，`list` 从 2 继续。", "check": "it = iter([1, 2, 3])\nnext(it)\nprint(list(it))"}, {"id": "iter-6", "m": "iter", "type": "single", "tags": [], "stem": "`sum(x * x for x in range(10**7))` 相比 `sum([x * x for x in range(10**7)])` 的主要优势是？", "options": ["计算结果更精确", "不需要一次性在内存中构建完整列表，节省内存", "自动利用多核并行", "可以重复遍历"], "answer": [1], "explain": "生成器表达式惰性求值，按需产生每个值。"}, {"id": "iter-7", "m": "iter", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nm = map(str, [1, 2])\na = list(m)\nb = list(m)\nprint(len(a), len(b))\n```", "options": ["`2 2`", "`2 0`", "`0 0`", "报错"], "answer": [1], "explain": "Python 3 中 `map` 返回迭代器，只能消费一次。", "check": "m = map(str, [1, 2])\na = list(m)\nb = list(m)\nprint(len(a), len(b))"}, {"id": "iter-8", "m": "iter", "type": "multi", "tags": [], "stem": "关于可迭代对象、迭代器、生成器，说法正确的有？", "options": ["生成器是一种迭代器", "迭代器也是可迭代对象", "所有可迭代对象都可以直接调用 `next()`", "生成器按需产生值，适合处理大数据流", "生成器耗尽后再次遍历得到空结果"], "answer": [0, 1, 3, 4], "explain": "list 等容器是可迭代对象但不是迭代器，需要先 `iter()` 才能 `next()`。"}, {"id": "iter-9", "m": "iter", "type": "multi", "tags": [], "stem": "下列哪些写法会得到**生成器**对象？", "options": ["`(x for x in range(3))`", "`[x for x in range(3)]`", "调用一个函数体中包含 `yield` 的函数", "`{x for x in range(3)}`", "`tuple(range(3))`"], "answer": [0, 2], "explain": "圆括号推导式是生成器表达式；方括号是列表、花括号是集合；`tuple(...)` 得到元组。"}, {"id": "iter-10", "m": "iter", "type": "short", "tags": [], "stem": "请说明可迭代对象、迭代器和生成器三者的关系，并说明\"按需产生数据\"的含义以及生成器耗尽后的表现。", "keypoints": ["可迭代对象：实现 `__iter__`、可被 for 遍历，如 list、str、dict", "迭代器：实现 `__next__`，用 next() 逐个取值，取完抛 StopIteration", "生成器是用 yield 或生成器表达式创建的特殊迭代器", "包含关系：生成器 ⊂ 迭代器 ⊂ 可迭代对象", "按需产生：惰性计算，请求时才产生下一个值，节省内存", "耗尽后再遍历为空 / next 抛 StopIteration，只能遍历一次"], "ref": "- **可迭代对象**：实现了 `__iter__` 方法，可以被 `for` 遍历，如 list、str、dict、文件；调用 `iter()` 可以得到迭代器。\n- **迭代器**：实现了 `__next__`（以及返回自身的 `__iter__`），用 `next()` 逐个取值，没有元素时抛出 `StopIteration`。迭代器也是可迭代对象。\n- **生成器**：由含 `yield` 的函数或生成器表达式创建，是自动实现迭代器协议的特殊迭代器。\n- 关系：生成器 ⊂ 迭代器 ⊂ 可迭代对象。\n\n**按需产生**：生成器不会预先算好全部结果，而是每次被 `next()` 请求时才执行到下一个 `yield` 产出一个值，因此内存占用小，适合大数据或无限序列。\n\n**耗尽**：生成器只能遍历一次，所有值产出后再遍历得到空结果（如 `list(g)` 返回 `[]`），继续 `next(g)` 会抛 `StopIteration`；需要复用时应重新创建生成器或先转成列表保存。"}, {"id": "iter-11", "m": "iter", "type": "short", "tags": [], "stem": "下面代码第二次打印为空，请解释原因并给出两种解决方法。\n\n```python\nrows = (line.strip() for line in ['a ', 'b '])\nprint(list(rows))\nprint(list(rows))\n```", "keypoints": ["rows 是生成器（生成器表达式）", "生成器只能遍历一次，第一次 list 已将其耗尽", "耗尽后再遍历得到空列表", "方法一：先 `data = list(rows)` 保存结果，多次使用 data", "方法二：需要时重新创建生成器（如封装成函数每次调用）"], "ref": "`rows` 是生成器表达式创建的生成器。第一次 `list(rows)` 已经把所有值取完，生成器耗尽；第二次遍历得不到任何值，所以输出 `[]`。\n\n解决：① 先物化保存 `data = list(rows)`，之后重复使用 `data`；② 改成列表推导式 `[...]`；③ 封装成生成器函数，每次需要时重新调用得到新的生成器。"}, {"id": "iter-12", "m": "iter", "type": "short", "tags": [], "stem": "写一个生成器函数 `read_amounts(lines)`，逐行产出可转换为整数的金额（跳过无法转换的行），并说明与\"先构建完整列表再返回\"相比的优点。", "keypoints": ["函数内使用 yield 逐个产出", "用 try/except ValueError 跳过无法转换的行", "惰性求值，按需产生，内存占用小", "可以处理很大的输入甚至流式输入"], "ref": "```python\ndef read_amounts(lines):\n    for line in lines:\n        try:\n            yield int(line)\n        except ValueError:\n            continue\n```\n\n优点：调用方每取一个值才处理一行，不需要把全部结果放进内存，适合大文件逐行处理或流式数据；同时可以与其他迭代工具组成流水线（如 `sum(read_amounts(f))`）。"}], "refs": [{"label": "Python术语对照表（iterable、iterator、generator）", "url": "https://docs.python.org/zh-cn/3/glossary.html"}], "id": "iter", "title": "迭代概念：可迭代对象 / 迭代器 / 生成器", "short": "迭代与生成器", "group": "通用必考模块", "exam": "30（简答）"}, {"lessons": [{"title": "int() 转换与 ValueError", "cards": ["`int()` 把字符串转整数时，字符串必须是**合法的整数字面量**，否则抛 `ValueError`。\n\n| 表达式 | 结果 |\n|---|---|\n| `int('42')` | `42` |\n| `int(' 42\\n')` | `42`（**首尾空白会被忽略**） |\n| `int('-7')`、`int('+7')` | `-7`、`7` |\n| `int('3.14')` | ❌ `ValueError`（小数字符串不行） |\n| `int('abc')` | ❌ `ValueError` |\n| `int('')` | ❌ `ValueError` |\n| `int(3.99)` | `3`（浮点数向零截断，不是四舍五入） |\n| `int(None)` | ❌ `TypeError`（类型不对是 TypeError） |\n| `int('1A', 16)` | `26`（指定进制） |\n\n> 区分：**值不合法 → ValueError；类型不对 → TypeError**。\n\n```python\ndef safe_int(s, default=None):\n    try:\n        return int(s)\n    except ValueError:\n        return default\n```"]}, {"title": "try / except / else / finally 执行顺序", "cards": ["```python\ntry:\n    可能出错的代码\nexcept ValueError as e:     # 匹配到才执行；可以写多个，从上到下匹配\n    处理\nelse:                       # try 中没有异常才执行\n    ...\nfinally:                    # 无论如何都会执行（有异常、没异常、return、break 都执行）\n    清理资源\n```\n\n| 情况 | 执行顺序 |\n|---|---|\n| 没有异常 | try → else → finally |\n| 有异常且被捕获 | try（出错处中断）→ except → finally |\n| 有异常没被捕获 | try → finally → 异常继续向外抛出 |\n| try 中 return | 先执行 finally，再真正返回 |\n\n**陷阱**\n\n- except 从上到下匹配，**先写具体的，后写宽泛的**。`except Exception` 写在 `except ValueError` 前面，后者永远走不到。\n- `except (ValueError, TypeError):` 一次捕获多种。\n- 不要写裸 `except:` 再 `pass`，会把错误静默吞掉（连 Ctrl+C 都吞）。\n- finally 里写 `return` 会覆盖 try 里的返回值并吞掉异常（不要这么写）。\n\n```python\ndef f():\n    try:\n        return 'try'\n    finally:\n        print('finally')\n\nprint(f())   # 先打印 finally，再打印 try\n```"]}, {"title": "with 管理文件资源", "cards": ["`with` 语句使用**上下文管理器**，在代码块结束时**自动释放资源**（文件自动 `close()`），**即使块内抛出异常也会关闭**。\n\n```python\nwith open('data.txt', encoding='utf-8') as f:\n    for line in f:          # 文件对象本身就是迭代器，可逐行读取\n        print(line.strip())\nprint(f.closed)             # True：离开 with 后已关闭\n\n# 等价于（但更啰嗦）：\nf = open('data.txt', encoding='utf-8')\ntry:\n    data = f.read()\nfinally:\n    f.close()\n```\n\n**打开模式**：`'r'` 读（默认）、`'w'` 写（**会清空**原文件）、`'a'` 追加、`'x'` 新建（已存在则报错）、`'b'` 二进制。\n\n**最佳实践**：始终用 `with`；文本文件始终显式写 `encoding='utf-8'`（不同系统默认编码不同，Windows 中文环境常为 GBK）。\n\n```python\nwith open('a.txt', encoding='utf-8') as src, open('b.txt', 'w', encoding='utf-8') as dst:\n    dst.write(src.read())\n```"]}], "questions": [{"id": "exc-1", "m": "exc", "type": "single", "tags": [], "stem": "`int('3.14')` 的执行结果是？", "options": ["`3`", "`3.14`", "抛出 `ValueError`", "抛出 `TypeError`"], "answer": [2], "explain": "`int()` 不接受小数形式的字符串。可以 `int(float('3.14'))` 得到 3，金额场景应使用 `Decimal`。"}, {"id": "exc-2", "m": "exc", "type": "single", "tags": [], "stem": "`int(' 42 ')` 的执行结果是？", "options": ["`42`", "抛出 `ValueError`", "`' 42 '`", "抛出 `TypeError`"], "answer": [0], "explain": "`int()` 会忽略字符串首尾的空白字符。", "check": "print(int(' 42 '))"}, {"id": "exc-3", "m": "exc", "type": "single", "tags": [], "stem": "下面代码的输出顺序是？\n\n```python\ntry:\n    x = int('10')\n    print('A')\nexcept ValueError:\n    print('B')\nelse:\n    print('C')\nfinally:\n    print('D')\n```", "options": ["`A D`", "`A C D`", "`A B C D`", "`B D`"], "answer": [1], "explain": "没有异常：try → else → finally。", "check": "try:\n    x = int('10')\n    print('A')\nexcept ValueError:\n    print('B')\nelse:\n    print('C')\nfinally:\n    print('D')"}, {"id": "exc-4", "m": "exc", "type": "single", "tags": [], "stem": "下面代码的输出顺序是？\n\n```python\ntry:\n    x = int('ten')\n    print('A')\nexcept ValueError:\n    print('B')\nelse:\n    print('C')\nfinally:\n    print('D')\n```", "options": ["`A B D`", "`B D`", "`B C D`", "`D`"], "answer": [1], "explain": "`int('ten')` 抛出 ValueError，try 中后续代码不执行；进入 except，else 不执行，finally 总会执行。", "check": "try:\n    x = int('ten')\n    print('A')\nexcept ValueError:\n    print('B')\nelse:\n    print('C')\nfinally:\n    print('D')"}, {"id": "exc-5", "m": "exc", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ndef f():\n    try:\n        return 'try'\n    finally:\n        print('finally')\n\nprint(f())\n```", "options": ["只输出 `try`", "只输出 `finally`", "先输出 `finally`，再输出 `try`", "先输出 `try`，再输出 `finally`"], "answer": [2], "explain": "`return` 之前会先执行 finally 块，然后函数才真正返回，外层 `print` 才打印返回值。"}, {"id": "exc-6", "m": "exc", "type": "single", "tags": [], "stem": "执行完下面代码后，`f.closed` 的值是？\n\n```python\nwith open('a.txt', 'w', encoding='utf-8') as f:\n    f.write('hi')\n```", "options": ["`True`", "`False`", "抛出 `NameError`", "`None`"], "answer": [0], "explain": "离开 with 块时文件自动关闭；变量 `f` 仍然存在，只是文件已关闭。"}, {"id": "exc-7", "m": "exc", "type": "single", "tags": [], "stem": "读取文本文件，下面哪种写法**最规范**？", "options": ["`f = open('a.txt'); data = f.read()`", "`with open('a.txt', encoding='utf-8') as f: data = f.read()`", "`data = open('a.txt').read()`", "`with open('a.txt', 'w') as f: data = f.read()`"], "answer": [1], "explain": "with 保证文件关闭，显式编码避免平台差异。D 用 `'w'` 会清空文件且不能读。"}, {"id": "exc-8", "m": "exc", "type": "single", "tags": [], "stem": "```python\ndef safe_int(s, default=0):\n    try:\n        return int(s)\n    except ValueError:\n        return default\n```\n`safe_int('12a', -1)` 返回？", "options": ["`12`", "`0`", "`-1`", "抛出 `ValueError`"], "answer": [2], "explain": "`int('12a')` 抛 ValueError，被捕获后返回传入的默认值 -1。"}, {"id": "exc-9", "m": "exc", "type": "single", "tags": [], "stem": "下面代码中，输入 `'abc'` 时会输出什么？\n\n```python\ntry:\n    int('abc')\nexcept Exception:\n    print('general')\nexcept ValueError:\n    print('value')\n```", "options": ["`general`", "`value`", "`general` 和 `value`", "报错"], "answer": [0], "explain": "except 子句从上到下匹配，ValueError 是 Exception 的子类，先被第一个分支捕获。应把具体异常写在前面。"}, {"id": "exc-10", "m": "exc", "type": "single", "tags": [], "stem": "`int(None)` 抛出的异常类型是？", "options": ["`ValueError`", "`TypeError`", "`KeyError`", "`AttributeError`"], "answer": [1], "explain": "参数类型不对（不是字符串/数字）抛 TypeError；类型对但内容不合法才是 ValueError。"}, {"id": "exc-11", "m": "exc", "type": "multi", "tags": [], "stem": "下列哪些表达式会抛出 `ValueError`？", "options": ["`int('abc')`", "`int('1.5')`", "`int('')`", "`int(' 7 ')`", "`int(None)`"], "answer": [0, 1, 2], "explain": "`int(' 7 ')` 返回 7；`int(None)` 抛 TypeError。"}, {"id": "exc-12", "m": "exc", "type": "multi", "tags": [], "stem": "关于 `try/except/else/finally`，说法正确的有？", "options": ["finally 块无论是否发生异常都会执行", "else 块只在 try 块没有发生异常时执行", "try 中执行 `return` 时，finally 仍会在函数返回前执行", "一个 try 只能写一个 except", "`except (ValueError, TypeError) as e:` 可以同时捕获两种异常"], "answer": [0, 1, 2, 4], "explain": "可以写多个 except 分支，按顺序匹配。"}, {"id": "exc-13", "m": "exc", "type": "multi", "tags": [], "stem": "关于用 `with open(...) as f` 读写文件，说法正确的有？", "options": ["代码块结束时会自动关闭文件", "代码块中抛出异常时，文件也会被关闭", "可以在一个 with 语句中同时打开多个文件", "使用 with 后就不会再出现任何异常", "建议显式指定 `encoding` 参数"], "answer": [0, 1, 2, 4], "explain": "with 只负责资源释放，不会吞掉异常；异常会在文件关闭后继续向外抛出。"}, {"id": "exc-14", "m": "exc", "type": "multi", "tags": [], "stem": "下列哪些写法可以保证文件在使用后被关闭？", "options": ["`with open(p, encoding='utf-8') as f: data = f.read()`", "`f = open(p); try: data = f.read() finally: f.close()`（多行写法）", "`f = open(p); data = f.read()`，之后不调用 close", "`f = open(p); data = f.read(); f.close()`，且 read 可能抛异常", "`with open(p, 'rb') as f: data = f.read()`"], "answer": [0, 1, 4], "explain": "D 中 read 抛异常时 close 不会被执行；with 或 try/finally 才能保证关闭。"}], "refs": [{"label": "Python教程（错误和异常 / 输入与输出）", "url": "https://docs.python.org/zh-cn/3/tutorial/"}], "id": "exc", "title": "异常及资源管理", "short": "异常与with", "group": "通用必考模块", "exam": "06—07（单选）、23（多选）"}, {"lessons": [{"title": "CSV：字段里有逗号怎么办", "cards": ["CSV 规定：字段内容含逗号、引号或换行时，用**双引号**把整个字段括起来；字段内部的双引号写成两个 `\"\"`。\n\n```text\nid,name,amount\n1001,\"Zhang, San\",100\n1002,\"He said \"\"hi\"\"\",50\n```\n\n**不要用 `line.split(',')` 解析 CSV**，会把 `\"Zhang, San\"` 拆成两段：\n\n```python\nline = '1001,\"Zhang, San\",100'\nline.split(',')        # ['1001', '\"Zhang', ' San\"', '100']  ← 4 段，错！\n\nimport csv, io\nnext(csv.reader(io.StringIO(line)))   # ['1001', 'Zhang, San', '100'] ← 3 段，对\n```\n\n**标准读写姿势**\n\n```python\nimport csv\n\nwith open('trades.csv', newline='', encoding='utf-8') as f:\n    for row in csv.DictReader(f):      # 第一行当表头，每行是 dict\n        print(row['name'], row['amount'])   # 注意：所有值都是 str！\n\nwith open('out.csv', 'w', newline='', encoding='utf-8') as f:\n    w = csv.writer(f)\n    w.writerow(['1001', 'Zhang, San', '100'])  # 自动给含逗号的字段加引号\n```\n\n- 打开 CSV 文件时官方推荐 `newline=''`（避免多余空行、正确处理字段内换行）。\n- csv 模块读出的**所有字段都是字符串**，金额要自己转换（金额用 `Decimal`）。\n- 默认引用策略 `QUOTE_MINIMAL`：只在需要时加引号。"]}, {"title": "文件编码", "cards": ["- 文本文件读写**始终显式指定** `encoding`，不要依赖系统默认（Windows 中文环境默认常为 GBK/cp936，Linux/macOS 常为 UTF-8）。\n- 编码不匹配 → `UnicodeDecodeError` 或乱码。\n- **Excel 导出的 UTF-8 CSV 常带 BOM**，用 `encoding='utf-8'` 读时第一个表头会变成 `'﻿id'`，导致 `row['id']` 报 `KeyError`。解决：`encoding='utf-8-sig'`。\n- 老系统导出的中文文件可能是 `gbk` 编码。\n\n```python\nwith open('export.csv', newline='', encoding='utf-8-sig') as f:\n    reader = csv.DictReader(f)\n```"]}, {"title": "JSON：json.loads 与类型映射", "cards": ["| 函数 | 作用 |\n|---|---|\n| `json.loads(s)` | **字符串** → Python 对象 |\n| `json.load(f)` | **文件对象** → Python 对象 |\n| `json.dumps(obj)` | Python 对象 → 字符串 |\n| `json.dump(obj, f)` | Python 对象 → 写入文件 |\n\n| JSON | Python |\n|---|---|\n| object `{}` | `dict` |\n| array `[]` | `list` |\n| string | `str` |\n| number（整数/小数） | `int` / `float` |\n| `true` / `false` | `True` / `False` |\n| `null` | `None` |\n\n```python\nimport json\njson.loads('{\"ok\": true, \"v\": null, \"n\": [1, 2.5]}')\n# {'ok': True, 'v': None, 'n': [1, 2.5]}\n\njson.loads(\"{'a': 1}\")       # json.JSONDecodeError（JSON 只认双引号）\njson.dumps({'名': '张'})                      # '{\"\\\\u540d\": \"\\\\u5f20\"}'\njson.dumps({'名': '张'}, ensure_ascii=False)  # '{\"名\": \"张\"}'\njson.loads('{\"amt\": 0.1}', parse_float=Decimal)   # 金额直接解析为 Decimal\n```\n\n- `json.JSONDecodeError` 是 `ValueError` 的子类，可以用 `except ValueError` 捕获。\n- 元组 dumps 后变成 JSON 数组，loads 回来是 list。"]}, {"title": "安全：外部字符串绝不能直接 eval", "cards": ["`eval()` 会把字符串当作 **Python 代码执行**。外部输入（接口参数、文件、用户输入、大模型输出）如果被 eval，攻击者可以执行任意代码：\n\n```python\nuser_input = \"__import__('os').system('rm -rf /')\"\neval(user_input)        # 💀 任意代码执行\n```\n\n**正确做法**\n\n- 解析 JSON → `json.loads(s)`（只做数据解析，不执行代码）\n- 解析 Python 字面量（如 `\"[1, 2, {'a': 3}]\"`）→ `ast.literal_eval(s)`（只接受字面量）\n- 解析失败时捕获 `json.JSONDecodeError` / `ValueError`，返回明确错误"]}], "questions": [{"id": "data-1", "m": "data", "type": "single", "tags": [], "stem": "用 `csv.reader` 解析下面这一行，得到多少个字段？\n\n```text\n1001,\"Zhang, San\",100\n```", "options": ["4", "3", "2", "1"], "answer": [1], "explain": "双引号内的逗号属于字段内容。若用 `split(',')` 会错误地得到 4 段。", "check": "import csv, io\nprint(len(next(csv.reader(io.StringIO('1001,\"Zhang, San\",100')))))"}, {"id": "data-2", "m": "data", "type": "single", "tags": [], "stem": "`json.loads('{\"ok\": true, \"v\": null}')` 的结果是？", "options": ["`{'ok': 'true', 'v': 'null'}`", "`{'ok': True, 'v': None}`", "`{'ok': 1, 'v': 0}`", "抛出异常"], "answer": [1], "explain": "JSON 的 true/false/null 分别映射为 Python 的 True/False/None。", "check": "import json\nprint(json.loads('{\"ok\": true, \"v\": null}'))"}, {"id": "data-3", "m": "data", "type": "single", "tags": [], "stem": "`json.loads(\"{'a': 1}\")` 的结果是？", "options": ["`{'a': 1}`", "`{\"a\": 1}`", "抛出 `json.JSONDecodeError`", "返回 `None`"], "answer": [2], "explain": "JSON 标准要求字符串和键使用双引号，单引号不合法。"}, {"id": "data-4", "m": "data", "type": "single", "tags": [], "stem": "接口收到外部字符串 `s = '{\"amount\": 100}'`，要把它转成字典，正确做法是？", "options": ["`eval(s)`", "`exec(s)`", "`json.loads(s)`", "`dict(s)`"], "answer": [2], "explain": "`eval/exec` 会执行任意代码，存在严重安全风险；`dict(s)` 不能解析字符串。"}, {"id": "data-5", "m": "data", "type": "single", "tags": [], "stem": "用 `encoding='utf-8'` 读取 Excel 导出的 CSV，发现第一列表头变成了 `'﻿id'`，最合适的修复是？", "options": ["改用 `encoding='ascii'`", "改用 `encoding='utf-8-sig'`", "改用 `split(',')` 手动解析", "改用 `eval` 解析每行"], "answer": [1], "explain": "`﻿` 是 UTF-8 BOM，`utf-8-sig` 编码会自动去掉它。"}, {"id": "data-6", "m": "data", "type": "single", "tags": [], "stem": "用 `csv.DictReader` 读取 `amount` 列为 `100` 的行，`row['amount']` 的类型是？", "options": ["`int`", "`float`", "`str`", "`Decimal`"], "answer": [2], "explain": "csv 模块不做类型推断，所有字段都是字符串，需要自己转换。"}, {"id": "data-7", "m": "data", "type": "single", "tags": [], "stem": "Python 官方文档建议用 `open()` 打开供 csv 模块读写的文件时，传入哪个参数？", "options": ["`mode='rb'`", "`newline=''`", "`buffering=0`", "`errors='ignore'`"], "answer": [1], "explain": "`newline=''` 可以避免 Windows 下写出多余空行，并正确处理引号内的换行符。"}, {"id": "data-8", "m": "data", "type": "single", "tags": [], "stem": "`json.dumps({'名': '张'}, ensure_ascii=False)` 的结果是？", "options": ["`{\"名\": \"张\"}`", "`{'名': '张'}`", "`{\"名\": \"张\"}`", "抛出异常"], "answer": [0], "explain": "默认 `ensure_ascii=True` 会把非 ASCII 字符转义为 `\\uXXXX`；设为 False 保留中文。注意 JSON 字符串用双引号。", "check": "import json\nprint(json.dumps({'名': '张'}, ensure_ascii=False))"}, {"id": "data-9", "m": "data", "type": "multi", "tags": [], "stem": "关于 CSV 处理，下列做法正确的有？", "options": ["使用 `csv.reader` / `csv.DictReader` 解析，而不是 `split(',')`", "字段中含逗号时用双引号包围", "打开文件时指定 `newline=''` 和明确的 `encoding`", "csv 模块会自动把数字字段转换成 int", "字段内部的双引号写成两个连续双引号 `\"\"`"], "answer": [0, 1, 2, 4], "explain": "csv 读出的都是字符串。"}, {"id": "data-10", "m": "data", "type": "multi", "tags": [], "stem": "关于 `eval` 与外部输入，说法正确的有？", "options": ["对外部字符串直接 `eval` 可能导致任意代码执行", "解析 JSON 字符串应使用 `json.loads`", "解析仅包含 Python 字面量的字符串可以用 `ast.literal_eval`", "只要字符串来自大模型输出就可以放心 `eval`", "解析失败时应捕获异常并返回明确的错误信息"], "answer": [0, 1, 2, 4], "explain": "大模型输出同样是不可信外部输入，可能被提示注入操纵。"}, {"id": "data-11", "m": "data", "type": "multi", "tags": [], "stem": "`json.loads` 解析 JSON 时，下列类型映射正确的有？", "options": ["`true` → `True`", "`null` → `None`", "数组 → `list`", "数组 → `tuple`", "对象 → `dict`"], "answer": [0, 1, 2, 4], "explain": "JSON 数组总是解析为 list。"}, {"id": "data-12", "m": "data", "type": "multi", "tags": [], "stem": "关于文件编码，说法正确的有？", "options": ["不同操作系统的默认编码可能不同，应显式指定 `encoding`", "用错误的编码读取文件可能抛出 `UnicodeDecodeError`", "`utf-8-sig` 可以自动去除 UTF-8 BOM", "所有中文文件都是 UTF-8 编码，无需考虑其他编码", "部分老系统导出的中文文件可能是 GBK 编码"], "answer": [0, 1, 2, 4], "explain": "GBK、GB18030 等编码在国内老系统中仍很常见。"}], "refs": [{"label": "csv — CSV 文件读写", "url": "https://docs.python.org/zh-cn/3/library/csv.html"}, {"label": "json — JSON 编码和解码器", "url": "https://docs.python.org/zh-cn/3/library/json.html"}], "id": "data", "title": "结构化数据读写：CSV / JSON / 编码", "short": "CSV与JSON", "group": "通用必考模块", "exam": "08（单选）、22（多选）"}, {"lessons": [{"title": "为什么金额不能用 float", "cards": ["float 是**二进制浮点数**，很多十进制小数（如 0.1）无法精确表示，只能存一个近似值：\n\n```python\n0.1 + 0.2            # 0.30000000000000004\n0.1 + 0.2 == 0.3     # False\nround(2.675, 2)      # 2.67（因为 2.675 实际存的是 2.67499999...）\n```\n\n金额计算需要**十进制精确运算** → 使用标准库 `decimal.Decimal`。"]}, {"title": "从字符串构造 Decimal（核心考点）", "cards": ["```python\nfrom decimal import Decimal\n\nDecimal('0.1')       # Decimal('0.1')  ✅ 精确\nDecimal(0.1)         # Decimal('0.1000000000000000055511151231257827021181583404541015625') ❌\nDecimal('0.1') + Decimal('0.2') == Decimal('0.3')   # True\nDecimal(0.1) == Decimal('0.1')                       # False\n```\n\n> **从 float 构造会把 float 的二进制误差原样带进来**。金额一律用字符串（或整数）构造：`Decimal('19.99')`、`Decimal(str(x))`、`Decimal(100)`。\n\n**运算规则**\n\n```python\nDecimal('1.10') + Decimal('2.205')   # Decimal('3.305')\nDecimal('1.5') * 2                   # Decimal('3.0')   与 int 运算 ✅\nDecimal('1.5') + 1.5                 # TypeError        与 float 混算 ❌\nsum([Decimal('1.1'), Decimal('2.2')])   # Decimal('3.3')\nDecimal('1.0') == Decimal('1')       # True（比较的是数值）\nstr(Decimal('1.10'))                 # '1.10'（保留尾随零）\n```\n\n- 解析非法字符串 `Decimal('abc')` 抛 `decimal.InvalidOperation`（属于 ArithmeticError，**不是 ValueError**），清洗脏数据时要 `except InvalidOperation`。\n- 默认上下文精度 `getcontext().prec == 28`（有效数字位数），不是小数位数。\n- 解析 JSON 金额：`json.loads(s, parse_float=Decimal)`。"]}, {"title": "quantize：保留两位小数与舍入方式", "cards": ["```python\nfrom decimal import Decimal, ROUND_HALF_UP\n\nDecimal('2.675').quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)  # Decimal('2.68') 四舍五入\nDecimal('2.665').quantize(Decimal('0.01'))                          # Decimal('2.66') 默认 ROUND_HALF_EVEN\nDecimal('2.675').quantize(Decimal('0.01'))                          # Decimal('2.68')\n```\n\n- 默认舍入模式是 **ROUND_HALF_EVEN（银行家舍入，\"四舍六入五成双\"）**：正好 .5 时向偶数靠拢。\n- 业务要求\"四舍五入\"时，显式写 `rounding=ROUND_HALF_UP`。"]}], "questions": [{"id": "dec-1", "m": "dec", "type": "single", "tags": [], "stem": "`0.1 + 0.2 == 0.3` 的结果是？", "options": ["`True`", "`False`", "抛出异常", "`None`"], "answer": [1], "explain": "二进制浮点数无法精确表示 0.1 和 0.2，相加得到 0.30000000000000004。", "check": "print(0.1 + 0.2 == 0.3)"}, {"id": "dec-2", "m": "dec", "type": "single", "tags": [], "stem": "`Decimal('0.1') + Decimal('0.2') == Decimal('0.3')` 的结果是？", "options": ["`True`", "`False`", "抛出 `TypeError`", "结果不确定"], "answer": [0], "explain": "从字符串构造的 Decimal 是精确的十进制数，运算结果精确。", "check": "from decimal import Decimal\nprint(Decimal('0.1') + Decimal('0.2') == Decimal('0.3'))"}, {"id": "dec-3", "m": "dec", "type": "single", "tags": [], "stem": "表示金额 19.99 元，推荐哪种写法？", "options": ["`Decimal(19.99)`", "`Decimal('19.99')`", "`float('19.99')`", "`round(19.99, 2)`"], "answer": [1], "explain": "从字符串构造才能得到精确的十进制值；`Decimal(19.99)` 会带入 float 的二进制误差。"}, {"id": "dec-4", "m": "dec", "type": "single", "tags": [], "stem": "`Decimal('1.10') + Decimal('2.205')` 的结果是？", "options": ["`Decimal('3.31')`", "`Decimal('3.305')`", "`3.3049999999999997`", "`Decimal('3.30')`"], "answer": [1], "explain": "Decimal 加法精确，结果的小数位数取两者中较多的那个。", "check": "from decimal import Decimal\nprint(repr(Decimal('1.10') + Decimal('2.205')))"}, {"id": "dec-5", "m": "dec", "type": "single", "tags": [], "stem": "`Decimal('1.5') + 1.5` 的执行结果是？", "options": ["`Decimal('3.0')`", "`3.0`", "抛出 `TypeError`", "`Decimal('3')`"], "answer": [2], "explain": "Decimal 不允许与 float 直接做算术运算（避免引入浮点误差），但可以与 int 运算。"}, {"id": "dec-6", "m": "dec", "type": "single", "tags": [], "stem": "`Decimal(0.1) == Decimal('0.1')` 的结果是？", "options": ["`True`", "`False`", "抛出 `TypeError`", "取决于精度设置"], "answer": [1], "explain": "`Decimal(0.1)` 精确保留了 float 0.1 的二进制近似值 0.1000000000000000055511...，与十进制的 0.1 不相等。", "check": "from decimal import Decimal\nprint(Decimal(0.1) == Decimal('0.1'))"}, {"id": "dec-7", "m": "dec", "type": "single", "tags": [], "stem": "`Decimal('2.675').quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)` 的结果是？", "options": ["`Decimal('2.67')`", "`Decimal('2.68')`", "`Decimal('2.675')`", "`2.67`"], "answer": [1], "explain": "ROUND_HALF_UP 即常规四舍五入。对比：`round(2.675, 2)` 因 float 误差得到 2.67。", "check": "from decimal import Decimal, ROUND_HALF_UP\nprint(repr(Decimal('2.675').quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)))"}, {"id": "dec-8", "m": "dec", "type": "single", "tags": [], "stem": "不指定 `rounding` 时，`Decimal('2.665').quantize(Decimal('0.01'))` 的结果是？", "options": ["`Decimal('2.66')`", "`Decimal('2.67')`", "`Decimal('2.665')`", "抛出异常"], "answer": [0], "explain": "默认舍入方式是 ROUND_HALF_EVEN（银行家舍入），正好为 5 时舍入到偶数位，6 是偶数。", "check": "from decimal import Decimal\nprint(repr(Decimal('2.665').quantize(Decimal('0.01'))))"}, {"id": "dec-9", "m": "dec", "type": "single", "tags": [], "stem": "`Decimal('abc')` 会抛出什么异常？", "options": ["`ValueError`", "`TypeError`", "`decimal.InvalidOperation`", "返回 `Decimal('NaN')`"], "answer": [2], "explain": "Decimal 解析非法字符串时抛 `InvalidOperation`，它继承自 ArithmeticError，用 `except ValueError` 捕获不到。"}, {"id": "dec-10", "m": "dec", "type": "multi", "tags": [], "stem": "关于金额计算，说法正确的有？", "options": ["float 是二进制近似表示，不适合直接做金额计算", "应使用 `Decimal('12.34')` 这样从字符串构造金额", "`Decimal(12.34)` 与 `Decimal('12.34')` 完全相等", "需要四舍五入到分时可用 `quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)`", "从 JSON 解析金额可使用 `json.loads(s, parse_float=Decimal)`"], "answer": [0, 1, 3, 4], "explain": "`Decimal(12.34)` 带有浮点误差。"}, {"id": "dec-11", "m": "dec", "type": "multi", "tags": [], "stem": "下列哪些表达式可以**正常执行**（不抛异常）？", "options": ["`Decimal('1') + 1`", "`Decimal('1.1') * Decimal('3')`", "`sum([Decimal('1.1'), Decimal('2.2')])`", "`Decimal('1') + 0.5`", "`Decimal('1.0') == Decimal('1')`"], "answer": [0, 1, 2, 4], "explain": "Decimal 可以与 int 运算，不能与 float 运算。"}], "refs": [{"label": "decimal — 十进制定点和浮点算术", "url": "https://docs.python.org/zh-cn/3/library/decimal.html"}], "id": "dec", "title": "金额精度：Decimal", "short": "Decimal金额", "group": "金融数据处理模块", "exam": "09（单选）"}, {"lessons": [{"title": "代码题总览：两道题考什么", "cards": ["考纲原文：\n\n- **31 交易汇总**：成功且正金额交易按客户汇总；客户编号首尾空白清理；保留前导零与大小写。\n- **32 稳定去重**：用基础容器实现编号稳定去重；处理空输入及题干指定边界。\n\n这两道题只用 **dict / list / set / for / if** 就能写完，难点全在**细节**：\n\n| 细节 | 正确做法 | 常见错误 |\n|---|---|---|\n| 只要成功交易 | `status == 'success'`（按题干给定的值判断） | 忘记过滤 |\n| 只要正金额 | `amount > 0`（**严格大于**，0 不算） | 写成 `>= 0` |\n| 清理编号 | `cid.strip()` 只去首尾空白 | `int(cid)` 丢掉前导零；`lstrip('0')`；`lower()` 改大小写；`replace(' ', '')` 删了中间空格 |\n| 金额精度 | 用 `Decimal` 累加 | 转成 float 累加 |\n| 空输入 | 返回 `{}` / `[]` | 返回 None 或报错 |\n| 稳定去重 | `seen` 集合 + `result` 列表，保留**首次出现**顺序 | `list(set(x))` 打乱顺序 |\n| 返回值 | `return` 结果 | 只 `print` 不 `return` |\n| 不改输入 | 新建 dict/list | 直接修改传入的记录 |"]}, {"title": "第 31 题模板：按客户汇总", "cards": ["```python\nfrom decimal import Decimal\n\ndef summarize_success(records):\n    \"\"\"成功且金额为正的交易，按清理后的客户编号汇总金额。\"\"\"\n    totals = {}\n    for r in records:\n        if r['status'] != 'success':      # 1. 只要成功\n            continue\n        amount = r['amount']\n        if amount <= 0:                   # 2. 只要正金额（0 和负数都排除）\n            continue\n        cid = r['customer_id'].strip()    # 3. 只去首尾空白，保留前导零、大小写\n        totals[cid] = totals.get(cid, Decimal('0')) + amount   # 4. 累加\n    return totals                         # 5. 空输入自然返回 {}\n```\n\n**用 `defaultdict` 的写法**（`Decimal()` 的值是 `Decimal('0')`）：\n\n```python\nfrom collections import defaultdict\ntotals = defaultdict(Decimal)\ntotals[cid] += amount\nreturn dict(totals)      # 转回普通 dict 再返回\n```\n\n**如果金额是字符串**（比如从 CSV 读的）：`amount = Decimal(r['amount'].strip())`。解析失败会抛 `decimal.InvalidOperation`（注意它**不是** ValueError）。\n\n**写完自测**：\n\n```python\nassert summarize_success([]) == {}\nrecs = [\n    {'customer_id': ' 007 ', 'amount': Decimal('10.5'), 'status': 'success'},\n    {'customer_id': '007',   'amount': Decimal('4.5'),  'status': 'success'},\n    {'customer_id': 'A01',   'amount': Decimal('0'),    'status': 'success'},\n    {'customer_id': 'a01',   'amount': Decimal('3'),    'status': 'failed'},\n]\nassert summarize_success(recs) == {'007': Decimal('15.0')}\n```"]}, {"title": "第 32 题模板：稳定去重", "cards": ["**稳定**去重 = 去掉重复项，同时**保留每个元素第一次出现的位置顺序**。\n\n```python\ndef stable_unique(ids):\n    seen = set()          # 集合：O(1) 判断是否出现过\n    result = []           # 列表：保持顺序\n    for raw in ids:\n        cid = raw.strip()         # 按题干：先清理首尾空白\n        if not cid:               # 按题干：清理后为空则跳过\n            continue\n        if cid not in seen:\n            seen.add(cid)\n            result.append(cid)\n    return result\n```\n\n**为什么不能 `list(set(ids))`**：集合无序，结果顺序不确定，不满足\"稳定\"。\n\n**一行写法（了解）**：`list(dict.fromkeys(ids))` —— dict 保持插入顺序且键唯一，也是稳定去重；但题目有清理/跳过空值等要求时，循环写法更清晰、更不容易漏边界。\n\n**边界清单**（题干说什么就做什么，没说就别自作主张）：\n\n- 空列表 → `[]`\n- 全是重复 → 只留一个\n- `'001'` 和 `'1'` 是**不同**编号（保留前导零）\n- `'A1'` 和 `'a1'` 是**不同**编号（区分大小写）\n- `' 001 '` 和 `'001'` 是**相同**编号（清理首尾空白后比较）\n- 元素可能是 `None` 时（若题干说明）→ 先判断 `if raw is None: continue`"]}, {"title": "答题步骤与检查清单", "cards": ["1. **圈关键词**：成功？正金额？清理什么？保留什么？返回什么类型？空输入返回什么？\n2. **先写函数签名和 return**，保证至少有结构分。\n3. **按\"过滤 → 清理 → 累加/判重 → 返回\"的顺序写**。\n4. **手动跑 3 个用例**：空输入、正常用例、边界用例（0 金额、前导零、大小写、空白、重复）。\n5. 检查：没有 `print` 代替 `return`；没有修改入参；没有用 float 累加金额；没有 `int()` 编号。\n\n> 在本软件里做代码题时，可以直接在编辑框写代码，点「运行测试」自动判分（需联网加载一次 Python 运行环境，之后会缓存）。"]}], "questions": [{"id": "code-1", "m": "code", "type": "single", "tags": [], "stem": "需要对编号列表去重并**保留首次出现的顺序**，下面哪种写法正确？", "options": ["`list(set(ids))`", "`list(dict.fromkeys(ids))`", "`sorted(set(ids))`", "`set(ids)`"], "answer": [1], "explain": "dict 键唯一且保持插入顺序；set 无序，sorted 会改变原始顺序。", "check": "ids = ['b', 'a', 'b', 'c', 'a']\nassert list(dict.fromkeys(ids)) == ['b', 'a', 'c']\nprint('list(dict.fromkeys(ids))')"}, {"id": "code-2", "m": "code", "type": "single", "tags": [], "stem": "客户编号原始值为 `' 007 '`，要求\"清理首尾空白，保留前导零与大小写\"，正确的清理方式是？", "options": ["`int(cid)`", "`cid.strip().lstrip('0')`", "`cid.strip()`", "`cid.strip().lower()`"], "answer": [2], "explain": "`int` 和 `lstrip('0')` 会丢掉前导零，`lower()` 会改变大小写。"}, {"id": "code-3", "m": "code", "type": "single", "tags": [], "stem": "题干要求\"只统计金额为正的交易\"，下面哪个判断条件正确？", "options": ["`amount >= 0`", "`amount > 0`", "`amount != 0`", "`abs(amount) > 0`"], "answer": [1], "explain": "正数不包含 0；`!= 0` 和 `abs(...) > 0` 会把负数也算进来。"}, {"id": "code-4", "m": "code", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\ntotals = {}\nfor cid, amt in [('a', 1), ('b', 2), ('a', 3)]:\n    totals[cid] = totals.get(cid, 0) + amt\nprint(totals)\n```", "options": ["`{'a': 3, 'b': 2}`", "`{'a': 4, 'b': 2}`", "`{'a': 1, 'b': 2}`", "抛出 `KeyError`"], "answer": [1], "explain": "`get(cid, 0)` 在键不存在时返回 0，然后累加。", "check": "totals = {}\nfor cid, amt in [('a', 1), ('b', 2), ('a', 3)]:\n    totals[cid] = totals.get(cid, 0) + amt\nprint(totals)"}, {"id": "code-5", "m": "code", "type": "single", "tags": [], "stem": "`stable_unique([' 01', '01 ', '1', 'A', 'a'])`（先 strip，再稳定去重）的结果是？", "options": ["`['01', '1', 'A']`", "`['01', '1', 'A', 'a']`", "`['1', 'A', 'a']`", "`['01', 'A']`"], "answer": [1], "explain": "' 01' 与 '01 ' 清理后相同；'01' 与 '1' 不同（前导零）；'A' 与 'a' 不同（大小写）。"}, {"id": "code-6", "m": "code", "type": "single", "tags": [], "stem": "用 `defaultdict(Decimal)` 累加金额时，访问一个不存在的键得到的初始值是？", "options": ["`None`", "`0.0`", "`Decimal('0')`", "抛出 `KeyError`"], "answer": [2], "explain": "defaultdict 调用工厂函数 `Decimal()` 生成默认值，`Decimal()` 等于 `Decimal('0')`。"}, {"id": "code-7", "m": "code", "type": "code", "tags": ["sum"], "stem": "**题目：成功交易按客户汇总**\n\n编写函数 `summarize_success(records)`。`records` 是交易记录列表，每条记录是字典：\n\n- `customer_id`：字符串，可能带首尾空白\n- `amount`：`Decimal` 类型的金额\n- `status`：字符串，取值如 `'success'`、`'failed'`、`'pending'`\n\n要求：\n\n1. 只统计 `status == 'success'` **且** `amount > 0` 的记录；\n2. 客户编号去除首尾空白后作为分组键，**保留前导零和大小写**（`'007'` 与 `'7'` 不同，`'A01'` 与 `'a01'` 不同）；\n3. 返回字典 `{客户编号: 金额合计}`，合计为 `Decimal`；\n4. 输入为空列表时返回 `{}`；不要修改输入数据。", "explain": "过滤（成功 + 正金额）→ 清理编号（只 strip）→ 用 `dict.get` 累加 → 返回。空列表时循环不执行，直接返回 `{}`。", "starter": "from decimal import Decimal\n\ndef summarize_success(records):\n    # 在这里写代码\n    pass", "tests": "from decimal import Decimal\nD = Decimal\ncheck('空输入返回 {}', lambda: summarize_success([]), {})\ncheck('首尾空白合并 + 保留前导零', lambda: summarize_success([\n    {'customer_id': ' 007 ', 'amount': D('10.5'), 'status': 'success'},\n    {'customer_id': '007', 'amount': D('4.5'), 'status': 'success'},\n    {'customer_id': '7', 'amount': D('1'), 'status': 'success'},\n]), {'007': D('15.0'), '7': D('1')})\ncheck('区分大小写', lambda: summarize_success([\n    {'customer_id': 'A01', 'amount': D('1'), 'status': 'success'},\n    {'customer_id': 'a01', 'amount': D('2'), 'status': 'success'},\n]), {'A01': D('1'), 'a01': D('2')})\ncheck('排除非成功交易', lambda: summarize_success([\n    {'customer_id': 'C1', 'amount': D('5'), 'status': 'failed'},\n    {'customer_id': 'C1', 'amount': D('6'), 'status': 'pending'},\n    {'customer_id': 'C2', 'amount': D('7'), 'status': 'success'},\n]), {'C2': D('7')})\ncheck('排除 0 和负金额', lambda: summarize_success([\n    {'customer_id': 'C1', 'amount': D('0'), 'status': 'success'},\n    {'customer_id': 'C1', 'amount': D('-3'), 'status': 'success'},\n    {'customer_id': 'C3', 'amount': D('0.01'), 'status': 'success'},\n]), {'C3': D('0.01')})\ncheck('Decimal 精确累加', lambda: summarize_success([\n    {'customer_id': 'X', 'amount': D('0.1'), 'status': 'success'},\n    {'customer_id': 'X', 'amount': D('0.2'), 'status': 'success'},\n]), {'X': D('0.3')})\n_recs = [{'customer_id': ' K ', 'amount': D('1'), 'status': 'success'}]\ncheck('不修改输入', lambda: (summarize_success(_recs), _recs[0]['customer_id'])[1], ' K ')", "solution": "from decimal import Decimal\n\ndef summarize_success(records):\n    totals = {}\n    for r in records:\n        if r['status'] != 'success':\n            continue\n        amount = r['amount']\n        if amount <= 0:\n            continue\n        cid = r['customer_id'].strip()\n        totals[cid] = totals.get(cid, Decimal('0')) + amount\n    return totals"}, {"id": "code-8", "m": "code", "type": "code", "tags": ["sum"], "stem": "**题目：字符串金额的交易汇总**\n\n交易数据从 CSV 读取，所有字段都是字符串。编写函数 `summarize_rows(rows)`，`rows` 中每个元素是字典：\n\n- `cid`：客户编号字符串，可能带首尾空白\n- `amount`：金额字符串，如 `'12.30'`、`' 5 '`，也可能是无法解析的脏数据（如 `'abc'`、`''`）\n- `status`：状态字符串，大小写和首尾空白不统一，如 `'SUCCESS '`、`'Success'`\n\n要求：\n\n1. 状态去除首尾空白并转小写后等于 `'success'` 才统计；\n2. 金额用 `Decimal` 解析（解析前先 strip），**无法解析的行跳过**；只统计金额 `> 0` 的行；\n3. 客户编号只去除首尾空白，保留前导零和大小写；\n4. 返回 `{客户编号: Decimal 合计}`；空输入返回 `{}`。\n\n提示：`Decimal('abc')` 抛出的是 `decimal.InvalidOperation`。", "explain": "关键点：状态规范化比较；`Decimal` 解析放进 try，捕获 `InvalidOperation`（不是 ValueError）；先解析再判断 `> 0`。", "starter": "from decimal import Decimal, InvalidOperation\n\ndef summarize_rows(rows):\n    pass", "tests": "from decimal import Decimal as D\ncheck('空输入', lambda: summarize_rows([]), {})\ncheck('状态大小写与空白', lambda: summarize_rows([\n    {'cid': '001', 'amount': '10', 'status': 'SUCCESS '},\n    {'cid': '001', 'amount': '2.5', 'status': ' Success'},\n    {'cid': '002', 'amount': '9', 'status': 'fail'},\n]), {'001': D('12.5')})\ncheck('脏金额跳过', lambda: summarize_rows([\n    {'cid': 'A', 'amount': 'abc', 'status': 'success'},\n    {'cid': 'A', 'amount': '', 'status': 'success'},\n    {'cid': 'A', 'amount': ' 3.30 ', 'status': 'success'},\n]), {'A': D('3.30')})\ncheck('排除 0 与负数', lambda: summarize_rows([\n    {'cid': 'B', 'amount': '0', 'status': 'success'},\n    {'cid': 'B', 'amount': '-1', 'status': 'success'},\n]), {})\ncheck('编号清理保留前导零大小写', lambda: summarize_rows([\n    {'cid': ' 0012 ', 'amount': '1', 'status': 'success'},\n    {'cid': '12', 'amount': '1', 'status': 'success'},\n    {'cid': 'ab', 'amount': '1', 'status': 'success'},\n    {'cid': 'AB', 'amount': '1', 'status': 'success'},\n]), {'0012': D('1'), '12': D('1'), 'ab': D('1'), 'AB': D('1')})\ncheck('精确累加', lambda: summarize_rows([\n    {'cid': 'Z', 'amount': '0.1', 'status': 'success'},\n    {'cid': 'Z', 'amount': '0.2', 'status': 'success'},\n])['Z'], D('0.3'))", "solution": "from decimal import Decimal, InvalidOperation\n\ndef summarize_rows(rows):\n    totals = {}\n    for row in rows:\n        if row['status'].strip().lower() != 'success':\n            continue\n        try:\n            amount = Decimal(row['amount'].strip())\n        except InvalidOperation:\n            continue\n        if amount <= 0:\n            continue\n        cid = row['cid'].strip()\n        totals[cid] = totals.get(cid, Decimal('0')) + amount\n    return totals"}, {"id": "code-9", "m": "code", "type": "code", "tags": ["sum"], "stem": "**题目：客户成交额排行**\n\n编写函数 `top_customers(records, n)`，记录格式与 `summarize_success` 相同（`customer_id` 字符串、`amount` 为 Decimal、`status` 字符串）。\n\n要求：\n\n1. 只统计 `status == 'success'` 且 `amount > 0` 的记录，客户编号只 strip；\n2. 返回列表 `[(客户编号, 合计), ...]`，按**合计降序**排序，合计相同时按**客户编号升序**；\n3. 只返回前 `n` 个；`n <= 0` 或输入为空时返回 `[]`。", "explain": "先汇总成 dict，再 `sorted(totals.items(), key=lambda kv: (-kv[1], kv[0]))` 实现\"金额降序、编号升序\"，最后切片取前 n 个。", "starter": "from decimal import Decimal\n\ndef top_customers(records, n):\n    pass", "tests": "from decimal import Decimal as D\ndef R(c, a, s='success'):\n    return {'customer_id': c, 'amount': D(a), 'status': s}\ncheck('空输入', lambda: top_customers([], 3), [])\ncheck('n<=0', lambda: top_customers([R('A', '1')], 0), [])\ncheck('降序 + 同额按编号升序', lambda: top_customers([\n    R('B', '5'), R('A', '5'), R('C', '9'), R('D', '1')\n], 3), [('C', D('9')), ('A', D('5')), ('B', D('5'))])\ncheck('合并 + 过滤', lambda: top_customers([\n    R(' 01', '2'), R('01 ', '3'), R('1', '4'), R('02', '100', 'failed'), R('03', '0')\n], 5), [('01', D('5')), ('1', D('4'))])\ncheck('n 大于客户数', lambda: len(top_customers([R('A', '1'), R('B', '2')], 10)), 2)", "solution": "from decimal import Decimal\n\ndef top_customers(records, n):\n    if n <= 0:\n        return []\n    totals = {}\n    for r in records:\n        if r['status'] != 'success' or r['amount'] <= 0:\n            continue\n        cid = r['customer_id'].strip()\n        totals[cid] = totals.get(cid, Decimal('0')) + r['amount']\n    ranked = sorted(totals.items(), key=lambda kv: (-kv[1], kv[0]))\n    return ranked[:n]"}, {"id": "code-10", "m": "code", "type": "code", "tags": ["dedup"], "stem": "**题目：编号稳定去重**\n\n编写函数 `stable_unique(ids)`，`ids` 是客户编号字符串列表。\n\n要求：\n\n1. 每个编号先去除首尾空白；去除后为空字符串的跳过；\n2. 去重时**保留每个编号第一次出现的顺序**；\n3. 区分大小写，保留前导零（`'A1'` 与 `'a1'` 不同，`'001'` 与`'1'` 不同）；\n4. 返回新列表；空输入返回 `[]`；不要使用 `list(set(...))`。", "explain": "`seen` 集合负责快速判重，`result` 列表负责保持顺序。先清理再判重，空串用 `if not cid` 跳过。", "starter": "def stable_unique(ids):\n    pass", "tests": "check('空输入', lambda: stable_unique([]), [])\ncheck('基本去重保序', lambda: stable_unique(['b', 'a', 'b', 'c', 'a']), ['b', 'a', 'c'])\ncheck('清理空白后去重', lambda: stable_unique([' 001', '001 ', '001']), ['001'])\ncheck('保留前导零与大小写', lambda: stable_unique(['001', '1', 'A1', 'a1']), ['001', '1', 'A1', 'a1'])\ncheck('跳过空串和纯空白', lambda: stable_unique(['', '  ', 'X', '\\t']), ['X'])\ncheck('综合', lambda: stable_unique([' 001', '001 ', '1', 'A1', 'a1', '', '  ', 'A1']), ['001', '1', 'A1', 'a1'])\n_ids = [' x ']\ncheck('不修改输入', lambda: (stable_unique(_ids), _ids)[1], [' x '])", "solution": "def stable_unique(ids):\n    seen = set()\n    result = []\n    for raw in ids:\n        cid = raw.strip()\n        if not cid:\n            continue\n        if cid not in seen:\n            seen.add(cid)\n            result.append(cid)\n    return result"}, {"id": "code-11", "m": "code", "type": "code", "tags": ["dedup"], "stem": "**题目：从交易记录中提取不重复客户编号**\n\n编写函数 `unique_customer_ids(records)`，`records` 是字典列表，每条记录**可能没有** `customer_id` 键，或该键的值为 `None`。\n\n要求：\n\n1. 跳过没有 `customer_id` 键、值为 `None`、或去除首尾空白后为空的记录；\n2. 编号去除首尾空白，保留前导零与大小写；\n3. 按第一次出现的顺序返回不重复的编号列表；\n4. `records` 为空列表或 `None` 时返回 `[]`。", "explain": "`r.get('customer_id')` 同时处理缺键和 None；`if not records` 同时处理 None 和空列表。", "starter": "def unique_customer_ids(records):\n    pass", "tests": "check('None 输入', lambda: unique_customer_ids(None), [])\ncheck('空列表', lambda: unique_customer_ids([]), [])\ncheck('缺键 / None / 空白', lambda: unique_customer_ids([\n    {'customer_id': None}, {}, {'customer_id': '   '}, {'customer_id': ' 09 '}\n]), ['09'])\ncheck('稳定去重', lambda: unique_customer_ids([\n    {'customer_id': 'B2'}, {'customer_id': 'a1'}, {'customer_id': ' B2'}, {'customer_id': 'A1'}\n]), ['B2', 'a1', 'A1'])", "solution": "def unique_customer_ids(records):\n    if not records:\n        return []\n    seen = set()\n    result = []\n    for r in records:\n        raw = r.get('customer_id')\n        if raw is None:\n            continue\n        cid = raw.strip()\n        if not cid or cid in seen:\n            continue\n        seen.add(cid)\n        result.append(cid)\n    return result"}, {"id": "code-12", "m": "code", "type": "code", "tags": ["dedup"], "stem": "**题目：按客户编号保留首条记录**\n\n编写函数 `dedupe_records(records)`，`records` 是交易字典列表，每条都有 `customer_id`（字符串）。\n\n要求：\n\n1. 客户编号去除首尾空白后相同，视为同一客户；\n2. 每个客户只保留**第一次出现**的那条记录，结果保持原始顺序；\n3. 返回的新记录中 `customer_id` 为清理后的值，其他字段保持不变；\n4. **不能修改**传入的原始字典；空输入返回 `[]`。", "explain": "用 `dict(r)` 或 `{**r}` 复制记录再修改，否则会改到调用方的数据（对象引用！）。", "starter": "def dedupe_records(records):\n    pass", "tests": "check('空输入', lambda: dedupe_records([]), [])\ncheck('保留首条', lambda: dedupe_records([\n    {'customer_id': ' 01', 'amt': 1},\n    {'customer_id': '02', 'amt': 2},\n    {'customer_id': '01 ', 'amt': 3},\n]), [{'customer_id': '01', 'amt': 1}, {'customer_id': '02', 'amt': 2}])\ncheck('大小写不同视为不同客户', lambda: [r['customer_id'] for r in dedupe_records([\n    {'customer_id': 'ab'}, {'customer_id': 'AB'}, {'customer_id': 'ab '}\n])], ['ab', 'AB'])\n_src = [{'customer_id': ' 7 ', 'amt': 1}]\ncheck('不修改原始字典', lambda: (dedupe_records(_src), _src[0]['customer_id'])[1], ' 7 ')", "solution": "def dedupe_records(records):\n    seen = set()\n    result = []\n    for r in records:\n        cid = r['customer_id'].strip()\n        if cid in seen:\n            continue\n        seen.add(cid)\n        new_r = dict(r)          # 复制一份，避免修改原始数据\n        new_r['customer_id'] = cid\n        result.append(new_r)\n    return result"}, {"id": "code-13", "m": "code", "type": "short", "tags": [], "stem": "说明如何用 Python 基础容器实现\"稳定去重\"，并解释为什么不能直接用 `list(set(items))`。", "keypoints": ["稳定去重指去重后保留元素第一次出现的顺序", "用 set 记录已出现元素（判重快），用 list 按顺序保存结果", "遍历时元素不在 set 中才加入 set 和结果列表", "set 无序，list(set(...)) 结果顺序不确定，不满足稳定要求", "也可用 list(dict.fromkeys(items))，依赖字典保持插入顺序"], "ref": "稳定去重：去掉重复元素，同时保留每个元素第一次出现时的相对顺序。\n\n```python\ndef stable_unique(items):\n    seen, result = set(), []\n    for x in items:\n        if x not in seen:\n            seen.add(x)\n            result.append(x)\n    return result\n```\n\n`set` 负责 O(1) 判重，`list` 负责保序。`list(set(items))` 虽然能去重，但集合是无序的，结果顺序不确定，不满足\"稳定\"。另一种写法是 `list(dict.fromkeys(items))`，利用字典键唯一且保持插入顺序。"}], "refs": [{"label": "Python教程·数据结构", "url": "https://docs.python.org/zh-cn/3/tutorial/datastructures.html"}, {"label": "Python教程·更多控制流工具", "url": "https://docs.python.org/zh-cn/3/tutorial/controlflow.html"}], "id": "code", "title": "记录清洗汇总 & 手写函数（代码题）", "short": "代码题专项", "group": "金融数据处理 / 编程综合模块", "exam": "31—32（代码题，分值最高）"}, {"lessons": [{"title": "示例表（本模块题目都用它）", "cards": ["表 `trades`：\n\n| id | customer | amount | status |\n|---|---|---|---|\n| 1 | A | 100 | success |\n| 2 | A | 200 | fail |\n| 3 | B | 150 | success |\n| 4 | C | 100 | success |\n| 5 | B | 300 | success |"]}, {"title": "SELECT / WHERE：行级筛选", "cards": ["```sql\nSELECT id, amount\nFROM trades\nWHERE amount > 100 AND status = 'success'\nORDER BY amount DESC;\n```\n\n**严格大于的边界**：题目说\"大于 100\" → `amount > 100`，**不含** 100；\"不少于/至少 100\" → `>= 100`。\n\n| 运算 | 含义 |\n|---|---|\n| `>` `<` | 严格大于 / 小于（不含边界） |\n| `>=` `<=` | 含边界 |\n| `BETWEEN 100 AND 200` | `>= 100 AND <= 200`（**两端都包含**） |\n| `<>` 或 `!=` | 不等于 |\n| `IN ('A', 'B')` | 属于集合 |\n| `IS NULL` | 判断空值（`= NULL` 永远不成立） |\n\n**AND 优先级高于 OR**（类似乘法高于加法）：\n\n```sql\nWHERE status = 'success' OR status = 'fail' AND amount > 150\n-- 等价于： status = 'success' OR (status = 'fail' AND amount > 150)\n\nWHERE (status = 'success' OR status = 'fail') AND amount > 150\n-- 加括号后才是\"两种状态中金额大于 150 的\"\n```\n\n> 混用 AND 与 OR 时**一律加括号**。"]}, {"title": "GROUP BY / 聚合 / HAVING", "cards": ["```sql\nSELECT customer, SUM(amount) AS total, COUNT(*) AS cnt\nFROM trades\nWHERE status = 'success'          -- ① 先按行筛选\nGROUP BY customer                 -- ② 再分组\nHAVING SUM(amount) > 200          -- ③ 再筛选分组\nORDER BY total DESC;              -- ④ 最后排序\n```\n\n结果：只有 B（150 + 300 = 450）。A 的成功交易只有 100，C 只有 100。\n\n**逻辑执行顺序**：`FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT`\n\n| | WHERE | HAVING |\n|---|---|---|\n| 作用对象 | **单行** | **分组** |\n| 执行时机 | 分组之前 | 分组之后 |\n| 能否用聚合函数 | ❌ `WHERE SUM(x) > 1` 报错 | ✅ |\n\n**聚合函数**：`SUM` `COUNT` `AVG` `MAX` `MIN`\n\n- `COUNT(*)` 统计行数；`COUNT(列)` **不统计 NULL**。\n- `SUM`、`AVG` 忽略 NULL。\n- SELECT 中的非聚合列应出现在 GROUP BY 中。"]}], "questions": [{"id": "sql-1", "m": "sql", "type": "single", "tags": ["where"], "stem": "对示例表执行下面的查询，返回几行？\n\n```sql\nSELECT id FROM trades WHERE amount > 100 AND status = 'success';\n```", "options": ["1", "2", "3", "4"], "answer": [1], "explain": "amount > 100 的成功交易：id 3（150）和 id 5（300）。id 1、4 金额等于 100，不满足严格大于。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table trades(id, customer, amount, status)')\nc.executemany('insert into trades values (?,?,?,?)', [(1,'A',100,'success'),(2,'A',200,'fail'),(3,'B',150,'success'),(4,'C',100,'success'),(5,'B',300,'success')])\nprint(len(c.execute(\"SELECT id FROM trades WHERE amount > 100 AND status = 'success'\").fetchall()))"}, {"id": "sql-2", "m": "sql", "type": "single", "tags": ["where"], "stem": "对示例表执行下面的查询，返回几行？\n\n```sql\nSELECT id FROM trades WHERE amount >= 100 AND status = 'success';\n```", "options": ["2", "3", "4", "5"], "answer": [2], "explain": "`>=` 包含边界：id 1、3、4、5 共 4 行。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table trades(id, customer, amount, status)')\nc.executemany('insert into trades values (?,?,?,?)', [(1,'A',100,'success'),(2,'A',200,'fail'),(3,'B',150,'success'),(4,'C',100,'success'),(5,'B',300,'success')])\nprint(len(c.execute(\"SELECT id FROM trades WHERE amount >= 100 AND status = 'success'\").fetchall()))"}, {"id": "sql-3", "m": "sql", "type": "single", "tags": ["where"], "stem": "对示例表执行下面的查询，返回几行？\n\n```sql\nSELECT id FROM trades\nWHERE status = 'success' OR status = 'fail' AND amount > 150;\n```", "options": ["2", "3", "4", "5"], "answer": [3], "explain": "AND 优先：`status='success' OR (status='fail' AND amount>150)`。4 条成功交易 + id 2（fail, 200）= 5 行。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table trades(id, customer, amount, status)')\nc.executemany('insert into trades values (?,?,?,?)', [(1,'A',100,'success'),(2,'A',200,'fail'),(3,'B',150,'success'),(4,'C',100,'success'),(5,'B',300,'success')])\nprint(len(c.execute(\"SELECT id FROM trades WHERE status = 'success' OR status = 'fail' AND amount > 150\").fetchall()))"}, {"id": "sql-4", "m": "sql", "type": "single", "tags": ["where"], "stem": "对示例表执行下面的查询，返回几行？\n\n```sql\nSELECT id FROM trades\nWHERE (status = 'success' OR status = 'fail') AND amount > 150;\n```", "options": ["1", "2", "3", "5"], "answer": [1], "explain": "括号先算，所有行都满足状态条件；再要求 amount > 150：id 2（200）、id 5（300）。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table trades(id, customer, amount, status)')\nc.executemany('insert into trades values (?,?,?,?)', [(1,'A',100,'success'),(2,'A',200,'fail'),(3,'B',150,'success'),(4,'C',100,'success'),(5,'B',300,'success')])\nprint(len(c.execute(\"SELECT id FROM trades WHERE (status = 'success' OR status = 'fail') AND amount > 150\").fetchall()))"}, {"id": "sql-5", "m": "sql", "type": "single", "tags": ["where"], "stem": "对示例表执行下面的查询，`BETWEEN` 返回几行？\n\n```sql\nSELECT id FROM trades WHERE amount BETWEEN 100 AND 200;\n```", "options": ["1", "2", "3", "4"], "answer": [3], "explain": "BETWEEN 两端都包含：100、200、150、100 共 4 行，只有 300 不满足。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table trades(id, customer, amount, status)')\nc.executemany('insert into trades values (?,?,?,?)', [(1,'A',100,'success'),(2,'A',200,'fail'),(3,'B',150,'success'),(4,'C',100,'success'),(5,'B',300,'success')])\nprint(len(c.execute(\"SELECT id FROM trades WHERE amount BETWEEN 100 AND 200\").fetchall()))"}, {"id": "sql-6", "m": "sql", "type": "single", "tags": ["group"], "stem": "对示例表执行下面的查询，结果是？\n\n```sql\nSELECT customer FROM trades\nWHERE status = 'success'\nGROUP BY customer\nHAVING SUM(amount) > 200;\n```", "options": ["A", "B", "A 和 B", "A、B、C"], "answer": [1], "explain": "成功交易汇总：A=100，B=450，C=100。只有 B 满足 > 200。注意 A 的 200 那笔是 fail，在 WHERE 阶段已被过滤。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table trades(id, customer, amount, status)')\nc.executemany('insert into trades values (?,?,?,?)', [(1,'A',100,'success'),(2,'A',200,'fail'),(3,'B',150,'success'),(4,'C',100,'success'),(5,'B',300,'success')])\nprint(' 和 '.join(r[0] for r in c.execute(\"SELECT customer FROM trades WHERE status = 'success' GROUP BY customer HAVING SUM(amount) > 200\")))"}, {"id": "sql-7", "m": "sql", "type": "single", "tags": ["group"], "stem": "对示例表执行下面的查询（**没有** WHERE），结果是？\n\n```sql\nSELECT customer FROM trades\nGROUP BY customer\nHAVING SUM(amount) > 200\nORDER BY customer;\n```", "options": ["B", "A 和 B", "A、B、C", "空结果"], "answer": [1], "explain": "不过滤状态时 A=100+200=300 > 200，B=450 > 200，C=100。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table trades(id, customer, amount, status)')\nc.executemany('insert into trades values (?,?,?,?)', [(1,'A',100,'success'),(2,'A',200,'fail'),(3,'B',150,'success'),(4,'C',100,'success'),(5,'B',300,'success')])\nprint(' 和 '.join(r[0] for r in c.execute(\"SELECT customer FROM trades GROUP BY customer HAVING SUM(amount) > 200 ORDER BY customer\")))"}, {"id": "sql-8", "m": "sql", "type": "single", "tags": ["group"], "stem": "下面哪条 SQL 会**报错**？", "options": ["`SELECT customer, SUM(amount) FROM trades GROUP BY customer`", "`SELECT customer FROM trades WHERE SUM(amount) > 100 GROUP BY customer`", "`SELECT customer FROM trades GROUP BY customer HAVING COUNT(*) >= 2`", "`SELECT COUNT(*) FROM trades WHERE amount > 100`"], "answer": [1], "explain": "WHERE 在分组之前逐行执行，不能使用聚合函数；对分组结果的条件要写在 HAVING 中。"}, {"id": "sql-9", "m": "sql", "type": "single", "tags": ["group"], "stem": "SQL 子句的逻辑执行顺序，正确的是？", "options": ["SELECT → FROM → WHERE → GROUP BY → HAVING", "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY", "FROM → GROUP BY → WHERE → HAVING → SELECT", "FROM → HAVING → WHERE → GROUP BY → SELECT"], "answer": [1], "explain": "先取表，WHERE 过滤行，GROUP BY 分组，HAVING 过滤组，然后 SELECT 计算输出列，最后排序。"}, {"id": "sql-10", "m": "sql", "type": "single", "tags": ["where"], "stem": "需求\"查询金额**大于** 1000 的交易\"，WHERE 条件应写为？", "options": ["`amount > 1000`", "`amount >= 1000`", "`amount BETWEEN 1000 AND 99999999`", "`HAVING amount > 1000`"], "answer": [0], "explain": "\"大于\"是严格大于，不包含 1000；BETWEEN 包含两端。"}, {"id": "sql-11", "m": "sql", "type": "single", "tags": ["group"], "stem": "表中 `amount` 列有 5 行，其中 1 行为 NULL。`SELECT COUNT(amount), COUNT(*) FROM t` 的结果是？", "options": ["`5, 5`", "`4, 5`", "`5, 4`", "`4, 4`"], "answer": [1], "explain": "`COUNT(列)` 不统计 NULL，`COUNT(*)` 统计所有行。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table t(amount)')\nc.executemany('insert into t values (?)', [(1,),(2,),(None,),(4,),(5,)])\nprint('%s, %s' % c.execute('SELECT COUNT(amount), COUNT(*) FROM t').fetchone())"}, {"id": "sql-12", "m": "sql", "type": "single", "tags": ["group"], "stem": "对示例表执行下面的查询，结果是？\n\n```sql\nSELECT customer FROM trades\nWHERE amount > 100\nGR
