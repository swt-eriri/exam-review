OUP BY customer\nHAVING COUNT(*) >= 2;\n```", "options": ["A", "B", "A 和 B", "空结果"], "answer": [1], "explain": "amount > 100 的行：id 2（A）、3（B）、5（B）。A 只有 1 行，B 有 2 行。", "check": "import sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('create table trades(id, customer, amount, status)')\nc.executemany('insert into trades values (?,?,?,?)', [(1,'A',100,'success'),(2,'A',200,'fail'),(3,'B',150,'success'),(4,'C',100,'success'),(5,'B',300,'success')])\nprint(' 和 '.join(r[0] for r in c.execute(\"SELECT customer FROM trades WHERE amount > 100 GROUP BY customer HAVING COUNT(*) >= 2\")))"}, {"id": "sql-13", "m": "sql", "type": "multi", "tags": [], "stem": "关于 WHERE 与 HAVING，说法正确的有？", "options": ["WHERE 在分组前筛选行", "HAVING 在分组后筛选分组", "HAVING 中可以使用 `SUM`、`COUNT` 等聚合函数", "WHERE 中可以使用 `SUM(amount) > 100`", "同一条查询中可以同时使用 WHERE 和 HAVING"], "answer": [0, 1, 2, 4], "explain": "WHERE 中不能直接使用聚合函数。"}, {"id": "sql-14", "m": "sql", "type": "multi", "tags": [], "stem": "要查询\"成功交易合计金额超过 200 的客户\"，下列写法正确的有？", "options": ["`SELECT customer FROM trades WHERE status='success' GROUP BY customer HAVING SUM(amount) > 200`", "`SELECT customer, SUM(amount) AS total FROM trades WHERE status='success' GROUP BY customer HAVING SUM(amount) > 200`", "`SELECT customer FROM trades WHERE status='success' AND SUM(amount) > 200 GROUP BY customer`", "`SELECT customer FROM trades GROUP BY customer HAVING SUM(amount) > 200`", "`SELECT customer FROM trades WHERE status='success' GROUP BY customer HAVING SUM(amount) >= 200`"], "answer": [0, 1], "explain": "C 在 WHERE 中用了聚合函数；D 没过滤成功状态；E 把\"超过\"写成了 `>=`。"}, {"id": "sql-15", "m": "sql", "type": "multi", "tags": [], "stem": "关于 SQL 条件，说法正确的有？", "options": ["`AND` 的优先级高于 `OR`", "`BETWEEN a AND b` 包含 a 和 b 两个端点", "判断空值应使用 `IS NULL`", "`amount > 100` 包含 amount 等于 100 的行", "混用 AND 和 OR 时建议使用括号明确意图"], "answer": [0, 1, 2, 4], "explain": "`>` 是严格大于，不含边界值。"}], "refs": [{"label": "SQLite SELECT", "url": "https://sqlite.org/lang_select.html"}, {"label": "SQLite 聚合函数", "url": "https://www.sqlite.org/lang_aggfunc.html"}], "id": "sql", "title": "SQL 数据查询：WHERE / GROUP BY / HAVING", "short": "SQL查询", "group": "SQL数据查询模块", "exam": "04—05（单选）"}, {"lessons": [{"title": "ndarray 与 shape", "cards": ["```python\nimport numpy as np\na = np.array([[1, 2, 3],\n              [4, 5, 6]])\na.shape    # (2, 3)  —— 2 行 3 列\na.ndim     # 2       —— 维数\na.size     # 6       —— 元素总数\na.dtype    # int64（整数数组）\n\nnp.array([1, 2, 3]).shape   # (3,)   一维数组，不是 (1, 3) 也不是 (3, 1)\na.reshape(3, 2).shape       # (3, 2) 元素总数必须不变\nnp.zeros((2, 3))            # 2×3 全 0（float）\nnp.arange(6)                # [0 1 2 3 4 5]\n```"]}, {"title": "axis：沿哪个方向聚合", "cards": ["> 口诀：**axis=0 竖着压（跨行，按列算）；axis=1 横着压（跨列，按行算）**。聚合后**该轴消失**。\n\n```python\na = np.array([[1, 2, 3],\n              [4, 5, 6]])     # shape (2, 3)\n\na.sum()          # 21          全部元素\na.sum(axis=0)    # [5 7 9]     每列求和，结果 shape (3,)\na.sum(axis=1)    # [ 6 15]     每行求和，结果 shape (2,)\na.mean(axis=0)   # [2.5 3.5 4.5]\na.mean(axis=1)   # [2. 5.]\na.max(axis=1)    # [3 6]\na.mean(axis=1, keepdims=True).shape   # (2, 1)  保留维度\n```\n\n- 整数数组求 `mean` 结果是**浮点数**。\n- 数组含 `np.nan` 时 `mean` 结果是 nan；忽略 nan 用 `np.nanmean`。"]}, {"title": "逐元素运算与标量广播", "cards": ["NumPy 的算术运算是**逐元素**（element-wise）的，这与 Python 列表完全不同：\n\n```python\n[1, 2] * 2              # [1, 2, 1, 2]   列表：重复\nnp.array([1, 2]) * 2    # [2 4]          数组：每个元素乘 2（标量广播）\n\nx = np.array([1, 2, 3])\nx + x                   # [2 4 6]\nx * x                   # [1 4 9]        逐元素乘，不是矩阵乘法！\nx @ x                   # 14             矩阵/点积用 @ 或 np.dot\nx > 1                   # [False  True  True]   比较也逐元素，得到布尔数组\nx[x > 1]                # [2 3]          布尔索引\n```\n\n**广播规则**：从**最后一维**开始对齐比较，每一维要么相等，要么其中一个是 1（或缺失）。\n\n| 形状 A | 形状 B | 结果 |\n|---|---|---|\n| (2, 3) | 标量 | ✅ (2, 3) |\n| (2, 3) | (3,) | ✅ (2, 3)：每一行都加上这个向量 |\n| (2, 3) | (2, 1) | ✅ (2, 3)：每一列都加上这个列向量 |\n| (2, 3) | (2,) | ❌ 最后一维 3 vs 2 不兼容，`ValueError` |\n\n```python\na = np.array([[1, 2, 3], [4, 5, 6]])\na + np.array([10, 20, 30])   # [[11 22 33] [14 25 36]]\na - a.mean(axis=0)           # 每列减去该列均值（中心化）\n```"]}], "questions": [{"id": "np-1", "m": "np", "type": "single", "tags": [], "stem": "`np.array([[1, 2, 3], [4, 5, 6]]).shape` 的值是？", "options": ["`(2, 3)`", "`(3, 2)`", "`(6,)`", "`6`"], "answer": [0], "explain": "外层 2 个元素（2 行），每行 3 个元素（3 列）。", "check": "import numpy as np\nprint(np.array([[1, 2, 3], [4, 5, 6]]).shape)"}, {"id": "np-2", "m": "np", "type": "single", "tags": [], "stem": "`a = np.array([[1, 2, 3], [4, 5, 6]])`，`print(a.sum(axis=0))` 的输出是？", "options": ["`[5 7 9]`", "`[ 6 15]`", "`21`", "`[[5 7 9]]`"], "answer": [0], "explain": "axis=0 沿行方向压缩，对每一列求和：1+4、2+5、3+6。", "check": "import numpy as np\na = np.array([[1, 2, 3], [4, 5, 6]])\nprint(a.sum(axis=0))"}, {"id": "np-3", "m": "np", "type": "single", "tags": [], "stem": "`a = np.array([[1, 2, 3], [4, 5, 6]])`，`print(a.mean(axis=1))` 的输出是？", "options": ["`[2.5 3.5 4.5]`", "`[2. 5.]`", "`3.5`", "`[2 5]`"], "answer": [1], "explain": "axis=1 对每一行求均值：(1+2+3)/3=2，(4+5+6)/3=5；均值结果为浮点数。", "check": "import numpy as np\na = np.array([[1, 2, 3], [4, 5, 6]])\nprint(a.mean(axis=1))"}, {"id": "np-4", "m": "np", "type": "single", "tags": [], "stem": "`print(np.array([1, 2, 3]) * 2)` 的输出是？", "options": ["`[1 2 3 1 2 3]`", "`[2 4 6]`", "`12`", "报错"], "answer": [1], "explain": "标量与数组运算会广播到每个元素。对比：Python 列表 `[1,2,3]*2` 是重复拼接。", "check": "import numpy as np\nprint(np.array([1, 2, 3]) * 2)"}, {"id": "np-5", "m": "np", "type": "single", "tags": [], "stem": "`x = np.array([1, 2, 3])`，`print(x * x)` 的输出是？", "options": ["`[1 4 9]`", "`14`", "`[2 4 6]`", "报错"], "answer": [0], "explain": "`*` 是逐元素相乘；点积要用 `x @ x` 或 `np.dot(x, x)`，结果为 14。", "check": "import numpy as np\nx = np.array([1, 2, 3])\nprint(x * x)"}, {"id": "np-6", "m": "np", "type": "single", "tags": [], "stem": "形状为 `(2, 3)` 的数组与下列哪个形状的数组相加会**报错**？", "options": ["`(3,)`", "`(2, 1)`", "`(2,)`", "`(1, 3)`"], "answer": [2], "explain": "广播从最后一维对齐：3 与 2 既不相等也不是 1，无法广播。"}, {"id": "np-7", "m": "np", "type": "single", "tags": [], "stem": "`np.array([1, 2, 3]).shape` 的值是？", "options": ["`(1, 3)`", "`(3, 1)`", "`(3,)`", "`3`"], "answer": [2], "explain": "一维数组的 shape 是只有一个元素的元组 `(3,)`。", "check": "import numpy as np\nprint(np.array([1, 2, 3]).shape)"}, {"id": "np-8", "m": "np", "type": "single", "tags": [], "stem": "对形状为 `(4, 5)` 的数组执行 `.sum(axis=0)`，结果的形状是？", "options": ["`(4,)`", "`(5,)`", "`(4, 5)`", "`(1,)`"], "answer": [1], "explain": "沿哪个轴聚合，哪个轴就消失：去掉第 0 维（4），剩 `(5,)`。", "check": "import numpy as np\nprint(np.ones((4, 5)).sum(axis=0).shape)"}, {"id": "np-9", "m": "np", "type": "single", "tags": [], "stem": "`x = np.array([3, 8, 1, 9])`，`print(x[x > 2])` 的输出是？", "options": ["`[ True  True False  True]`", "`[3 8 9]`", "`[8 9]`", "`3`"], "answer": [1], "explain": "`x > 2` 得到布尔数组，再用它索引取出为 True 的元素。", "check": "import numpy as np\nx = np.array([3, 8, 1, 9])\nprint(x[x > 2])"}, {"id": "np-10", "m": "np", "type": "single", "tags": [], "stem": "`np.mean(np.array([1, 2, np.nan]))` 的结果是？", "options": ["`1.5`", "`nan`", "`1.0`", "抛出异常"], "answer": [1], "explain": "nan 会\"传染\"给聚合结果。忽略 nan 求均值用 `np.nanmean`，结果 1.5。", "check": "import numpy as np\nprint(np.mean(np.array([1, 2, np.nan])))"}, {"id": "np-11", "m": "np", "type": "single", "tags": [], "stem": "`a = np.array([[1, 2], [3, 4]])`，`print(a + np.array([10, 20]))` 的输出是？", "options": ["`[[11 22] [13 24]]`", "`[[11 12] [23 24]]`", "`[[11 22]]`", "报错"], "answer": [0], "explain": "形状 (2,) 广播到每一行：第一列都加 10，第二列都加 20。", "check": "import numpy as np\na = np.array([[1, 2], [3, 4]])\nprint(str(a + np.array([10, 20])).replace('\\n', ''))"}, {"id": "np-12", "m": "np", "type": "multi", "tags": [], "stem": "`a = np.array([[1, 2, 3], [4, 5, 6]])`，下列说法正确的有？", "options": ["`a.shape == (2, 3)`", "`a.sum(axis=0)` 得到每列之和 `[5, 7, 9]`", "`a.sum(axis=1)` 得到每行之和 `[6, 15]`", "`a.mean()` 的结果是 `[2.5, 3.5, 4.5]`", "`a.size == 6`"], "answer": [0, 1, 2, 4], "explain": "不指定 axis 时 `mean()` 对全部元素求均值，结果是标量 3.5。"}, {"id": "np-13", "m": "np", "type": "multi", "tags": [], "stem": "关于 NumPy 运算，说法正确的有？", "options": ["数组之间的 `+ - * /` 默认是逐元素运算", "数组与标量运算时标量会被广播到每个元素", "`np.array([1, 2]) * 2` 的结果是 `[1, 2, 1, 2]`", "矩阵乘法可以使用 `@` 运算符", "数组比较运算（如 `x > 0`）返回布尔数组"], "answer": [0, 1, 3, 4], "explain": "`[1, 2, 1, 2]` 是 Python 列表 `* 2` 的行为；数组得到 `[2, 4]`。"}, {"id": "np-14", "m": "np", "type": "multi", "tags": [], "stem": "形状为 `(3, 4)` 的数组 `a`，下列哪些运算**可以**正常广播？", "options": ["`a + 1`", "`a + np.ones(4)`", "`a + np.ones((3, 1))`", "`a + np.ones(3)`", "`a + np.ones((1, 4))`"], "answer": [0, 1, 2, 4], "explain": "`np.ones(3)` 形状 (3,) 与最后一维 4 不兼容。"}, {"id": "np-15", "m": "np", "type": "multi", "tags": [], "stem": "关于 axis 与聚合，说法正确的有？", "options": ["对二维数组 `axis=0` 聚合得到每一列的结果", "对二维数组 `axis=1` 聚合得到每一行的结果", "聚合后被指定的轴会消失（除非 `keepdims=True`）", "整数数组的 `mean` 结果一定是整数", "忽略 nan 求均值可以使用 `np.nanmean`"], "answer": [0, 1, 2, 4], "explain": "mean 的结果是浮点数。"}], "refs": [{"label": "NumPy quickstart", "url": "https://numpy.org/doc/stable/user/quickstart.html"}], "id": "np", "title": "NumPy 数组基础", "short": "NumPy", "group": "科学计算模块", "exam": "11—13（单选）、24（多选）"}, {"lessons": [{"title": "zscore 是干什么的（只需识别用途）", "cards": ["`scipy.stats.zscore` 计算**标准分数（Z 分数）**：每个值距离均值有几个标准差。\n\n```text\nz = (x - mean) / std\n```\n\n```python\nfrom scipy import stats\nimport numpy as np\n\nx = np.array([1, 2, 3])\nstats.zscore(x)    # array([-1.22474487,  0.        ,  1.22474487])\n```\n\n**记住这些就够了**\n\n| 要点 | 说明 |\n|---|---|\n| 用途 | **标准化**数据；**检测异常值**（常用 \\|z\\| > 3 视为异常） |\n| 输出形状 | 与输入**相同形状**（逐元素计算），不是一个数 |\n| 结果特征 | 标准化后均值≈0、标准差≈1 |\n| 常用参数 | `axis=0`（默认按列）、`ddof=0`（默认总体标准差）、`nan_policy` |\n| **不是** | 不是假设检验/p 值；不是缩放到 [0, 1] 的 min-max 归一化；不是求均值 |\n\n```python\ndata = np.array([10, 11, 9, 10, 12, 10, 11, 9, 10, 50])\nz = stats.zscore(data)\ndata[np.abs(z) > 2.5]   # array([50])  找出偏离均值很远的点\n```"]}], "questions": [{"id": "sp-1", "m": "sp", "type": "single", "tags": [], "stem": "`scipy.stats.zscore` 的主要用途是？", "options": ["计算两组数据差异的 p 值", "把数据转换为标准分数，常用于标准化和异常值识别", "把数据线性缩放到 [0, 1] 区间", "计算数据的中位数"], "answer": [1], "explain": "z = (x - 均值) / 标准差。缩放到 [0, 1] 的是 min-max 归一化。"}, {"id": "sp-2", "m": "sp", "type": "single", "tags": [], "stem": "对一个长度为 100 的一维数组调用 `scipy.stats.zscore`，返回值是？", "options": ["一个标量", "长度为 100 的数组", "长度为 2 的元组（统计量, p 值）", "长度为 1 的数组"], "answer": [1], "explain": "zscore 对每个元素计算标准分数，输出形状与输入相同。"}, {"id": "sp-3", "m": "sp", "type": "single", "tags": [], "stem": "数据经过 `zscore` 标准化后，其均值和标准差大约是？", "options": ["均值 1，标准差 0", "均值 0，标准差 1", "均值 0.5，标准差 0.5", "与原数据相同"], "answer": [1], "explain": "减去均值后均值为 0，再除以标准差后标准差为 1。"}, {"id": "sp-4", "m": "sp", "type": "single", "tags": [], "stem": "用 `zscore` 做异常值检测时，常见的判断规则是？", "options": ["z 值等于 0 的点是异常值", "|z| 大于某个阈值（如 3）的点视为异常值", "z 值为负的点都是异常值", "z 值小于 1 的点是异常值"], "answer": [1], "explain": "|z| 越大说明离均值越远（以标准差计），超过 2.5～3 常被视为异常。"}, {"id": "sp-5", "m": "sp", "type": "single", "tags": [], "stem": "`scipy.stats.zscore(x)` 中参数 `ddof` 的默认值是？", "options": ["0", "1", "2", "None"], "answer": [0], "explain": "默认 ddof=0，即用总体标准差（除以 n）。"}], "refs": [{"label": "scipy.stats.zscore", "url": "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.zscore.html"}], "id": "sp", "title": "SciPy 浅层统计：zscore", "short": "SciPy zscore", "group": "科学计算模块", "exam": "20（单选）"}, {"lessons": [{"title": "示例数据与客户编号 dtype", "cards": ["```python\nimport pandas as pd\nimport io\n\ncsv_text = \"\"\"cid,amount,status\n007,100,success\n008,,fail\n007,50,success\n010,200,success\n\"\"\"\ndf = pd.read_csv(io.StringIO(csv_text))\ndf['cid'].tolist()      # [7, 8, 7, 10]  ← 前导零丢了！被推断成整数\n\ndf = pd.read_csv(io.StringIO(csv_text), dtype={'cid': str})\ndf['cid'].tolist()      # ['007', '008', '007', '010']  ✅\n```\n\n> **客户编号、身份证号、手机号、账号**这类\"长得像数字的标识符\"必须按**字符串**读：`dtype={'cid': str}`（或 `'string'`）。读成数字会丢失前导零、长数字还可能变成科学计数法。事后 `astype(str)` 找不回已丢失的零。"]}, {"title": "布尔筛选", "cards": ["```python\ndf[df['amount'] > 60]                                   # 单条件\ndf[(df['amount'] > 60) & (df['status'] == 'success')]   # 且：&\ndf[(df['amount'] > 150) | (df['status'] == 'fail')]     # 或：|\ndf[~(df['status'] == 'fail')]                           # 非：~\ndf[df['status'].isin(['success', 'pending'])]           # 属于集合\ndf.loc[df['amount'] > 60, ['cid', 'amount']]            # 筛选行 + 选列\n```\n\n**三大陷阱**\n\n1. 用 `&` `|` `~`，**不能用 `and` `or` `not`**（会报 `ValueError: The truth value of a Series is ambiguous`）。\n2. 每个条件**必须加括号**：`&` 的优先级高于 `>`、`==`。\n3. 筛选返回新的 DataFrame，原 df 不变。"]}, {"title": "groupby 汇总", "cards": ["```python\ndf.groupby('cid')['amount'].sum()\n# cid\n# 007    150.0\n# 008      0.0      ← sum 默认跳过 NaN，全是 NaN 的组得 0\n# 010    200.0\n# 结果是 Series，索引是分组键，默认按键排序\n\ndf.groupby('cid', as_index=False)['amount'].sum()   # 分组键作为普通列，得到 DataFrame\ndf.groupby('cid')['amount'].sum().reset_index()     # 同上\ndf.groupby('cid')['amount'].agg(['sum', 'count', 'mean'])  # 多个聚合\ndf[df['status'] == 'success'].groupby('cid')['amount'].sum()  # 先筛选再分组（相当于 SQL 的 WHERE + GROUP BY）\n```\n\n- `count()` 统计**非空**值的个数；`size()` 统计行数（含 NaN）。"]}, {"title": "缺失值：isna / fillna", "cards": ["```python\ndf['amount'].isna()           # 布尔 Series：是不是缺失\ndf['amount'].isna().sum()     # 缺失值个数（True 当 1 算）\ndf.isna().sum()               # 每列的缺失个数\ndf['amount'].notna()          # 非缺失\n\ndf['amount'].fillna(0)        # 返回新 Series，原数据不变！\ndf['amount'] = df['amount'].fillna(0)   # 要生效必须赋值回去\ndf.dropna(subset=['amount'])  # 删除该列为缺失的行\n```\n\n- **不能用 `== np.nan` 判断缺失**：`NaN == NaN` 结果是 False。必须用 `isna()`。\n- `sum()`、`mean()` 默认跳过 NaN：`pd.Series([1, None, 3]).mean()` → 2.0。"]}, {"title": "去重与排序", "cards": ["```python\ndf.drop_duplicates()                              # 整行完全相同才算重复\ndf.drop_duplicates(subset=['cid'])                # 按列去重，默认 keep='first' 保留首次出现\ndf.drop_duplicates(subset=['cid'], keep='last')   # 保留最后一次\n\ndf.sort_values('amount')                          # 升序（默认），NaN 默认放最后\ndf.sort_values('amount', ascending=False)         # 降序\ndf.sort_values(['cid', 'amount'], ascending=[True, False])  # 多列排序\ndf.sort_index()                                   # 按索引排序\n```\n\n这些方法默认都**返回新对象**，不修改原 df。"]}], "questions": [{"id": "pd-1", "m": "pd", "type": "single", "tags": [], "stem": "CSV 中客户编号列 `cid` 的值为 `007`、`010`，要在 pandas 中保留前导零，正确做法是？", "options": ["`pd.read_csv(path)` 后执行 `df['cid'].astype(str)`", "`pd.read_csv(path, dtype={'cid': str})`", "`pd.read_csv(path)` 后执行 `df['cid'].fillna('0')`", "`pd.read_csv(path, sep='0')`"], "answer": [1], "explain": "默认会被推断为整数，读入时前导零已经丢失，事后 astype(str) 只能得到 '7'、'10'。必须在读取时指定字符串类型。", "check": "import pandas as pd, io\ndf = pd.read_csv(io.StringIO('cid\\n007\\n010\\n'), dtype={'cid': str})\nassert df['cid'].tolist() == ['007', '010']\ndf2 = pd.read_csv(io.StringIO('cid\\n007\\n010\\n'))\nassert df2['cid'].astype(str).tolist() == ['7', '10']\nprint('pd.read_csv(path, dtype={\\'cid\\': str})')"}, {"id": "pd-2", "m": "pd", "type": "single", "tags": [], "stem": "筛选 `amount > 100` **且** `status == 'success'` 的行，正确写法是？", "options": ["`df[df['amount'] > 100 and df['status'] == 'success']`", "`df[df['amount'] > 100 & df['status'] == 'success']`", "`df[(df['amount'] > 100) & (df['status'] == 'success')]`", "`df[(df['amount'] > 100) and (df['status'] == 'success')]`"], "answer": [2], "explain": "pandas 逐元素逻辑运算用 `&`，每个条件要加括号。`and` 会抛 ValueError；B 因优先级问题会出错。"}, {"id": "pd-3", "m": "pd", "type": "single", "tags": [], "stem": "`df.groupby('cid')['amount'].sum()` 返回的结果类型是？", "options": ["`list`", "`dict`", "以 `cid` 为索引的 `Series`", "与原 df 行数相同的 DataFrame"], "answer": [2], "explain": "对单列分组聚合得到 Series，索引为分组键。需要 DataFrame 可以用 `as_index=False` 或 `reset_index()`。"}, {"id": "pd-4", "m": "pd", "type": "single", "tags": [], "stem": "```python\ns = pd.Series([1, None, 3])\ns.fillna(0)\nprint(s.isna().sum())\n```\n输出是？", "options": ["`0`", "`1`", "`2`", "`3`"], "answer": [1], "explain": "`fillna` 默认返回新对象，没有赋值回 `s`，原 Series 仍有 1 个缺失值。", "check": "import pandas as pd\ns = pd.Series([1, None, 3])\ns.fillna(0)\nprint(s.isna().sum())"}, {"id": "pd-5", "m": "pd", "type": "single", "tags": [], "stem": "判断 `amount` 列中哪些值是缺失值，正确写法是？", "options": ["`df['amount'] == np.nan`", "`df['amount'] is None`", "`df['amount'].isna()`", "`df['amount'] == 'NaN'`"], "answer": [2], "explain": "NaN 与任何值（包括自身）比较都不相等，必须用 `isna()`。"}, {"id": "pd-6", "m": "pd", "type": "single", "tags": [], "stem": "`pd.Series([1, None, 3]).mean()` 的结果是？", "options": ["`nan`", "`1.3333333333333333`", "`2.0`", "抛出异常"], "answer": [2], "explain": "pandas 聚合默认 `skipna=True`，跳过缺失值：(1+3)/2 = 2.0。（与 NumPy 的 `np.mean` 对 nan 的处理不同。）", "check": "import pandas as pd\nprint(pd.Series([1, None, 3]).mean())"}, {"id": "pd-7", "m": "pd", "type": "single", "tags": [], "stem": "按 `cid` 列去重并保留每个客户**第一次出现**的行，正确写法是？", "options": ["`df.drop_duplicates()`", "`df.drop_duplicates(subset=['cid'], keep='first')`", "`df.drop_duplicates(subset=['cid'], keep='last')`", "`df['cid'].unique()`"], "answer": [1], "explain": "A 要求整行完全相同；C 保留最后一次；D 只得到编号数组而不是行。"}, {"id": "pd-8", "m": "pd", "type": "single", "tags": [], "stem": "按 `amount` **降序**排序，正确写法是？", "options": ["`df.sort_values('amount')`", "`df.sort_values('amount', ascending=False)`", "`df.sort_values('amount', reverse=True)`", "`df.sort('amount', desc=True)`"], "answer": [1], "explain": "pandas 用 `ascending=False` 表示降序；`reverse=True` 是 Python `sorted` 的参数。"}, {"id": "pd-9", "m": "pd", "type": "single", "tags": [], "stem": "```python\ndf = pd.DataFrame({'cid': ['A', 'B', 'A'], 'amount': [10, 20, 30]})\nprint(df.groupby('cid')['amount'].sum()['A'])\n```\n输出是？", "options": ["`10`", "`40`", "`30`", "`60`"], "answer": [1], "explain": "A 组的金额 10 + 30 = 40。", "check": "import pandas as pd\ndf = pd.DataFrame({'cid': ['A', 'B', 'A'], 'amount': [10, 20, 30]})\nprint(df.groupby('cid')['amount'].sum()['A'])"}, {"id": "pd-10", "m": "pd", "type": "single", "tags": [], "stem": "```python\ndf = pd.DataFrame({'amount': [5, None, 8, None]})\nprint(df['amount'].isna().sum())\n```\n输出是？", "options": ["`0`", "`2`", "`4`", "`[False, True, False, True]`"], "answer": [1], "explain": "`isna()` 得到布尔 Series，`sum()` 把 True 当 1 相加，得到缺失值个数。", "check": "import pandas as pd\ndf = pd.DataFrame({'amount': [5, None, 8, None]})\nprint(df['amount'].isna().sum())"}, {"id": "pd-11", "m": "pd", "type": "single", "tags": [], "stem": "```python\ndf = pd.DataFrame({'cid': ['A', 'B', 'A', 'C'], 'amount': [1, 2, 3, 4]})\nprint(len(df[df['amount'] > 1]))\n```\n输出是？", "options": ["1", "2", "3", "4"], "answer": [2], "explain": "amount 为 2、3、4 的三行满足条件。", "check": "import pandas as pd\ndf = pd.DataFrame({'cid': ['A', 'B', 'A', 'C'], 'amount': [1, 2, 3, 4]})\nprint(len(df[df['amount'] > 1]))"}, {"id": "pd-12", "m": "pd", "type": "multi", "tags": [], "stem": "关于 pandas 布尔筛选，说法正确的有？", "options": ["多个条件\"且\"使用 `&`，\"或\"使用 `|`", "每个条件需要用括号括起来", "`~` 表示取反", "可以直接使用 Python 的 `and` / `or` 连接两个条件 Series", "`df['status'].isin(['a', 'b'])` 可用于判断是否属于某个集合"], "answer": [0, 1, 2, 4], "explain": "`and`/`or` 会尝试把整个 Series 转成单个布尔值，从而抛出 ValueError。"}, {"id": "pd-13", "m": "pd", "type": "multi", "tags": [], "stem": "关于缺失值处理，说法正确的有？", "options": ["`isna()` 可以判断缺失值", "`fillna(0)` 默认返回新对象，需要赋值回去才会改变原数据", "`sum()` 和 `mean()` 默认跳过缺失值", "`df['x'] == np.nan` 可以准确找到缺失值", "`df.isna().sum()` 可以统计每列的缺失值数量"], "answer": [0, 1, 2, 4], "explain": "NaN 不等于任何值，`== np.nan` 全部为 False。"}, {"id": "pd-14", "m": "pd", "type": "multi", "tags": [], "stem": "关于 groupby / 去重 / 排序，说法正确的有？", "options": ["`df.groupby('cid')['amount'].sum()` 按客户汇总金额", "`drop_duplicates(subset=['cid'])` 默认保留第一次出现的行", "`sort_values('amount', ascending=False)` 按金额降序", "`sort_values` 默认会直接修改原 DataFrame", "`groupby(..., as_index=False)` 使分组键成为普通列"], "answer": [0, 1, 2, 4], "explain": "大多数 pandas 方法默认返回新对象。"}, {"id": "pd-15", "m": "pd", "type": "multi", "tags": [], "stem": "处理客户编号列（如 `007`、`0100`）时，下列做法正确的有？", "options": ["读取 CSV 时指定 `dtype={'cid': str}`", "将客户编号视为标识符而非数值", "默认读取后再用 `astype(str)` 就能恢复前导零", "对客户编号求和、求均值是有意义的操作", "读成整数会丢失前导零"], "answer": [0, 1, 4], "explain": "前导零在读取为整数时已经丢失，无法恢复。"}], "refs": [{"label": "10 minutes to pandas", "url": "https://pandas.pydata.org/docs/user_guide/10min.html"}, {"label": "Working with missing data", "url": "https://pandas.pydata.org/docs/user_guide/missing_data.html"}], "id": "pd", "title": "pandas 基础", "short": "pandas", "group": "数据分析模块", "exam": "14—16（单选）、25（多选）"}, {"lessons": [{"title": "协程三件套：async def / await / asyncio.run", "cards": ["```python\nimport asyncio\n\nasync def fetch(name, delay):        # async def 定义\"协程函数\"\n    await asyncio.sleep(delay)       # await 等待另一个可等待对象，期间让出控制权\n    return f'{name} done'\n\nasync def main():\n    r = await fetch('A', 1)\n    print(r)\n\nasyncio.run(main())                  # 程序入口：创建事件循环并运行协程\n```\n\n- 调用协程函数 `fetch('A', 1)` **不会执行函数体**，只返回一个**协程对象**；必须 `await` 它或交给 `asyncio.run` / `create_task` 才会运行。忘了 await 会得到警告 `coroutine ... was never awaited`。\n- `await` 只能写在 `async def` 内部（普通函数里写是语法错误）。"]}, {"title": "非阻塞 sleep vs 阻塞 sleep", "cards": ["| | `await asyncio.sleep(1)` | `time.sleep(1)` |\n|---|---|---|\n| 类型 | 非阻塞 | **阻塞** |\n| 效果 | 当前协程挂起，事件循环去运行其他协程 | 整个线程（包括事件循环）卡住 1 秒，其他协程也动不了 |\n\n> 在协程里调用 `time.sleep`、同步的 `requests.get` 等阻塞操作，会让并发完全失效。"]}, {"title": "gather：并发运行", "cards": ["```python\nimport asyncio, time\n\nasync def job(n):\n    await asyncio.sleep(n)\n    return n\n\nasync def sequential():\n    await job(1); await job(2); await job(3)     # 依次等待：约 1+2+3 = 6 秒\n\nasync def concurrent():\n    results = await asyncio.gather(job(3), job(1), job(2))   # 并发：约 max = 3 秒\n    print(results)       # [3, 1, 2]  ← 按传入顺序返回，不是完成顺序\n\nstart = time.perf_counter()\nasyncio.run(concurrent())\nprint(round(time.perf_counter() - start))   # 3\n```\n\n- `asyncio.gather(*aws)`：并发运行，全部完成后返回结果列表，**顺序与传入参数顺序一致**。\n- 默认任一任务抛异常会传播给 await gather 的地方；`return_exceptions=True` 则把异常对象当作结果返回。\n- `asyncio.create_task(coro)`：把协程包装成任务，立即排入事件循环调度。\n- `asyncio.wait_for(aw, timeout=秒)`：超时抛 `TimeoutError`（3.11+ 中 `asyncio.TimeoutError` 就是内置 `TimeoutError`）。"]}, {"title": "async 不等于 CPU 并行", "cards": ["asyncio 是**单线程**的事件循环：同一时刻只有一个协程在执行，靠在 `await` 处**切换**来实现\"并发\"。\n\n- ✅ 适合 **I/O 密集型**：网络请求、数据库、文件、调用大模型 API —— 等待期间可以去做别的事。\n- ❌ 不能加速 **CPU 密集型**：大量数学计算、图片处理。给计算函数加 `async` 不会让它跑在多个核上，反而会阻塞事件循环。\n- CPU 密集型要用**多进程**（`multiprocessing`、`ProcessPoolExecutor`）；在协程中调用阻塞代码可用 `asyncio.to_thread(func)` 放到线程里避免卡住事件循环。\n\n> 一句话：**并发（concurrency）≠ 并行（parallelism）**。async 提供的是并发。"]}], "questions": [{"id": "async-1", "m": "async", "type": "single", "tags": [], "stem": "下面代码运行总耗时约为？\n\n```python\nimport asyncio\n\nasync def job(n):\n    await asyncio.sleep(n)\n\nasync def main():\n    await asyncio.gather(job(1), job(2), job(3))\n\nasyncio.run(main())\n```", "options": ["约 1 秒", "约 3 秒", "约 6 秒", "约 0 秒"], "answer": [1], "explain": "gather 并发运行三个协程，等待时间重叠，总耗时约等于最长的那个（3 秒）。"}, {"id": "async-2", "m": "async", "type": "single", "tags": [], "stem": "下面代码运行总耗时约为？\n\n```python\nasync def main():\n    await job(1)\n    await job(2)\n    await job(3)\n```\n\n（`job` 定义同上：`await asyncio.sleep(n)`）", "options": ["约 1 秒", "约 3 秒", "约 6 秒", "约 2 秒"], "answer": [2], "explain": "依次 await：前一个完成后才开始下一个，总耗时 1+2+3=6 秒。"}, {"id": "async-3", "m": "async", "type": "single", "tags": [], "stem": "`async def f(): return 1`，直接调用 `f()`（不 await）得到的是？", "options": ["`1`", "`None`", "一个协程对象", "抛出 `SyntaxError`"], "answer": [2], "explain": "调用协程函数只创建协程对象，函数体不会执行，需要 `await f()` 或 `asyncio.run(f())`。"}, {"id": "async-4", "m": "async", "type": "single", "tags": [], "stem": "在协程中使用 `time.sleep(2)` 而不是 `await asyncio.sleep(2)`，会导致？", "options": ["没有区别", "阻塞整个事件循环，其他协程在这 2 秒内都无法运行", "抛出 `RuntimeError`", "只阻塞当前协程，其他协程照常运行"], "answer": [1], "explain": "time.sleep 是同步阻塞调用，会卡住运行事件循环的线程。"}, {"id": "async-5", "m": "async", "type": "single", "tags": [], "stem": "```python\nasync def job(n):\n    await asyncio.sleep(n)\n    return n\n\nasync def main():\n    print(await asyncio.gather(job(3), job(1), job(2)))\n```\n输出是？", "options": ["`[1, 2, 3]`", "`[3, 1, 2]`", "`[3, 2, 1]`", "顺序随机"], "answer": [1], "explain": "gather 返回结果的顺序与传入参数顺序一致，与谁先完成无关。", "check": "import asyncio\nasync def job(n):\n    await asyncio.sleep(n / 100)\n    return n\nasync def main():\n    print(await asyncio.gather(job(3), job(1), job(2)))\nasyncio.run(main())"}, {"id": "async-6", "m": "async", "type": "single", "tags": [], "stem": "有一个纯 CPU 计算的函数（大量循环求和），把它改成 `async def` 并用 `gather` 同时运行 4 份，效果是？", "options": ["自动利用 4 个 CPU 核心并行，速度约提升 4 倍", "不会获得 CPU 并行加速，总耗时与依次执行差不多", "抛出异常，async 函数不能做计算", "速度提升取决于 `await` 的数量"], "answer": [1], "explain": "asyncio 是单线程事件循环，CPU 计算中没有 await 让出点，也无法并行。CPU 密集型应使用多进程。"}, {"id": "async-7", "m": "async", "type": "single", "tags": [], "stem": "`await` 关键字可以在哪里使用？", "options": ["任何函数内部", "`async def` 定义的协程函数内部", "只能在模块顶层", "只能在 `with` 语句中"], "answer": [1], "explain": "在普通函数中使用 await 是语法错误（交互式环境的顶层 await 是特例）。"}, {"id": "async-8", "m": "async", "type": "single", "tags": [], "stem": "需要给一个异步调用设置 5 秒超时，应使用？", "options": ["`asyncio.sleep(5)`", "`await asyncio.wait_for(call(), timeout=5)`", "`time.sleep(5)`", "`asyncio.gather(call(), 5)`"], "answer": [1], "explain": "`wait_for` 超时会取消任务并抛出 TimeoutError。"}, {"id": "async-9", "m": "async", "type": "multi", "tags": [], "stem": "关于 asyncio，说法正确的有？", "options": ["`asyncio.run(main())` 常用作异步程序的入口", "`await asyncio.sleep(1)` 期间事件循环可以运行其他协程", "`asyncio.gather` 可以并发运行多个协程并收集结果", "给函数加上 `async` 就能利用多核 CPU 并行计算", "调用协程函数而不 await，函数体不会执行"], "answer": [0, 1, 2, 4], "explain": "async 提供并发而非并行。"}, {"id": "async-10", "m": "async", "type": "multi", "tags": [], "stem": "下列场景中，适合用 asyncio 提升吞吐的有？", "options": ["同时请求多个 HTTP 接口", "并发调用多个大模型 API", "同时等待多个数据库查询结果", "对大型矩阵做密集数学运算", "对大量图片进行像素级计算"], "answer": [0, 1, 2], "explain": "I/O 密集型任务大部分时间在等待，适合协程；CPU 密集型应使用多进程。"}, {"id": "async-11", "m": "async", "type": "multi", "tags": [], "stem": "关于 `asyncio.gather`，说法正确的有？", "options": ["返回结果顺序与传入顺序一致", "多个 `asyncio.sleep` 的等待时间可以重叠", "设置 `return_exceptions=True` 时，异常会作为结果返回而不是直接抛出", "总耗时等于所有任务耗时之和", "返回结果按完成先后顺序排列"], "answer": [0, 1, 2], "explain": "并发等待时总耗时约等于最慢任务的耗时。"}, {"id": "async-12", "m": "async", "type": "multi", "tags": [], "stem": "关于阻塞与非阻塞，说法正确的有？", "options": ["`time.sleep` 会阻塞事件循环", "`asyncio.sleep` 需要配合 `await` 使用", "在协程中调用同步阻塞函数会降低并发效果", "可以用 `asyncio.to_thread` 把阻塞函数放到线程中执行", "asyncio 默认使用多个线程同时执行协程"], "answer": [0, 1, 2, 3], "explain": "事件循环默认在单线程中运行所有协程。"}], "refs": [{"label": "asyncio — 协程与任务", "url": "https://docs.python.org/zh-cn/3/library/asyncio-task.html"}], "id": "async", "title": "异步基础：asyncio", "short": "asyncio", "group": "异步与Agent模块", "exam": "18（单选）、26（多选）"}, {"lessons": [{"title": "背景：Agent 调用工具时会出什么问题", "cards": ["大模型（Agent）调用工具时，传来的参数通常是一段 **JSON 字符串**，它可能：缺字段、类型错、值越界、根本不是合法 JSON，甚至被提示注入操纵。工具本身也可能卡死、超时、报错。工程上要做到三件事：\n\n1. **参数校验**：先校验再执行，不合法就返回明确错误。\n2. **超时与明确错误**：任何外部调用都要有超时；失败要返回结构化、可读的错误，不能静默吞掉。\n3. **日志脱敏**：记录日志时屏蔽密码、token、身份证、手机号、银行卡等敏感字段。"]}, {"title": "参数校验", "cards": ["```python\nimport json\n\nALLOWED_CURRENCIES = {'CNY', 'USD'}\n\ndef validate_args(raw: str):\n    try:\n        args = json.loads(raw)                 # 绝不用 eval\n    except json.JSONDecodeError:\n        return None, '参数不是合法的 JSON'\n    if not isinstance(args, dict):\n        return None, '参数必须是 JSON 对象'\n    cid = args.get('customer_id')\n    if not isinstance(cid, str) or not cid.strip():\n        return None, 'customer_id 必填且必须是非空字符串'\n    amount = args.get('amount')\n    if not isinstance(amount, (int, float)) or isinstance(amount, bool) or amount <= 0:\n        return None, 'amount 必须是大于 0 的数字'\n    if args.get('currency', 'CNY') not in ALLOWED_CURRENCIES:   # 白名单 / 枚举\n        return None, 'currency 只能是 CNY 或 USD'\n    return args, None\n```\n\n要点：**必填项、类型、取值范围、枚举白名单**都要校验；校验失败**不执行**工具；错误信息要**具体**（哪个字段、什么要求），方便模型自我修正后重试。"]}, {"title": "超时与明确错误", "cards": ["```python\nimport asyncio\n\nasync def call_tool_with_timeout(coro, timeout=5):\n    try:\n        data = await asyncio.wait_for(coro, timeout=timeout)\n        return {'ok': True, 'data': data}\n    except TimeoutError:                       # 3.11+；旧版本写 asyncio.TimeoutError\n        return {'ok': False, 'error': {'code': 'TIMEOUT', 'message': f'工具调用超过 {timeout} 秒未返回'}}\n    except ValueError as e:\n        return {'ok': False, 'error': {'code': 'INVALID_ARGUMENT', 'message': str(e)}}\n```\n\n- 每个外部调用都设置超时（`asyncio.wait_for`、HTTP 客户端的 `timeout=` 参数），避免 Agent 无限等待。\n- 返回**结构化错误**：错误码 + 人类可读的信息，区分\"参数错误 / 超时 / 下游失败\"。\n- **反模式**：`except Exception: pass`（静默吞错）、返回空字符串假装成功、把完整堆栈和密钥原样返回给模型/用户。\n- 重试要有**次数上限**（和退避），不能无限重试。"]}, {"title": "日志敏感字段脱敏", "cards": ["```python\nimport copy\n\nSENSITIVE_KEYS = {'password', 'token', 'api_key', 'id_card', 'phone', 'card_no'}\n\ndef mask(value: str) -> str:\n    s = str(value)\n    return s[:3] + '****' + s[-4:] if len(s) > 7 else '****'\n\ndef redact(obj):\n    \"\"\"递归脱敏，返回新对象，不修改原始数据。\"\"\"\n    if isinstance(obj, dict):\n        return {k: (mask(v) if k.lower() in SENSITIVE_KEYS else redact(v)) for k, v in obj.items()}\n    if isinstance(obj, list):\n        return [redact(x) for x in obj]\n    return obj\n\nargs = {'customer_id': 'C001', 'phone': '13812345678', 'auth': {'token': 'sk-abcdef123456'}}\nlogger.info('tool args: %s', redact(args))\n# {'customer_id': 'C001', 'phone': '138****5678', 'auth': {'token': 'sk-****3456'}}\n```\n\n要点：**先脱敏再写日志**；嵌套结构也要处理；脱敏**返回副本**，不能改掉真正要传给下游的数据；密钥类字段宁可全部遮蔽。"]}], "questions": [{"id": "tool-1", "m": "tool", "type": "single", "tags": [], "stem": "Agent 传来的工具参数是 JSON 字符串，工具端首先应该怎么做？", "options": ["直接 `eval` 成字典后执行", "用 `json.loads` 解析并校验必填项、类型和取值范围，不合法则返回明确错误", "不做处理，直接传给下游接口", "解析失败时返回空结果，假装调用成功"], "answer": [1], "explain": "外部参数不可信：安全解析 + 校验，失败时返回具体错误以便模型修正。"}, {"id": "tool-2", "m": "tool", "type": "single", "tags": [], "stem": "工具调用下游接口可能长时间无响应，最合适的处理是？", "options": ["无限等待直到返回", "使用 `asyncio.wait_for` 等方式设置超时，超时后返回明确的超时错误", "捕获所有异常后 `pass`", "立即无限次重试"], "answer": [1], "explain": "设置超时，失败返回结构化错误；重试也要有次数上限。"}, {"id": "tool-3", "m": "tool", "type": "single", "tags": [], "stem": "记录工具调用日志时，参数中包含 `password` 和 `token`，正确做法是？", "options": ["原样写入日志，方便排查", "写日志前对敏感字段做脱敏处理", "把敏感字段 base64 编码后写入日志", "删除整条日志记录"], "answer": [1], "explain": "base64 是编码不是加密，可以轻易还原。应当遮蔽（如 `****`）敏感字段。"}, {"id": "tool-4", "m": "tool", "type": "single", "tags": [], "stem": "下面哪种工具错误返回最好？", "options": ["`return None`", "`return ''`", "`return {'ok': False, 'error': {'code': 'INVALID_ARGUMENT', 'message': 'amount 必须大于 0'}}`", "`raise Exception('error')`"], "answer": [2], "explain": "结构化错误码 + 具体信息，调用方和模型都能据此判断原因并修正。"}, {"id": "tool-5", "m": "tool", "type": "single", "tags": [], "stem": "实现日志脱敏函数时，下列哪项是**错误**的做法？", "options": ["递归处理嵌套的字典和列表", "返回脱敏后的副本", "直接修改传入的参数字典，把敏感字段替换为 `****`", "使用敏感字段名白名单/黑名单统一配置"], "answer": [2], "explain": "直接修改原字典会把真正需要传给下游的数据也改掉（对象引用！），应返回副本。"}, {"id": "tool-6", "m": "tool", "type": "multi", "tags": [], "stem": "关于工具参数校验，说法正确的有？", "options": ["应校验必填字段是否存在", "应校验字段类型和取值范围", "枚举类参数应使用白名单校验", "参数来自大模型，所以一定是可信的", "校验失败时应返回明确指出问题字段的错误信息"], "answer": [0, 1, 2, 4], "explain": "模型输出可能有错，也可能被提示注入操纵，必须当作不可信输入。"}, {"id": "tool-7", "m": "tool", "type": "multi", "tags": [], "stem": "关于工具调用的超时与错误处理，下列做法正确的有？", "options": ["为外部调用设置超时时间", "超时后返回明确的超时错误码和信息", "使用 `except Exception: pass` 保证程序不崩溃", "区分参数错误、超时、下游服务错误等不同错误类型", "重试要设置次数上限"], "answer": [0, 1, 3, 4], "explain": "静默吞掉异常会让问题无法排查，模型也不知道调用失败。"}, {"id": "tool-8", "m": "tool", "type": "multi", "tags": [], "stem": "关于日志脱敏，说法正确的有？", "options": ["密码、token、API Key 等不应以明文出现在日志中", "手机号可以部分遮蔽，如 `138****5678`", "嵌套结构中的敏感字段也要处理", "把敏感字段 base64 编码就算完成脱敏", "脱敏应在写入日志之前完成"], "answer": [0, 1, 2, 4], "explain": "base64 可直接解码还原，不能算脱敏。"}, {"id": "tool-9", "m": "tool", "type": "multi", "tags": [], "stem": "设计一个供 Agent 调用的\"查询客户余额\"工具，下列做法合理的有？", "options": ["用 `json.loads` 解析参数，捕获 `JSONDecodeError`", "校验 `customer_id` 为非空字符串", "查询数据库设置超时", "日志中记录脱敏后的参数", "查询失败时返回余额为 0，避免模型困惑"], "answer": [0, 1, 2, 3], "explain": "失败伪装成\"余额为 0\"会误导模型和用户，必须返回明确错误。"}, {"id": "tool-10", "m": "tool", "type": "short", "tags": [], "stem": "你要实现一个供 Agent 调用的工具函数，请从参数校验、超时处理、错误返回、日志脱敏四个方面说明工程上的注意事项。", "keypoints": ["参数校验：安全解析（json.loads，不用 eval），校验必填、类型、范围、枚举白名单", "校验失败不执行，返回指出具体字段的错误", "外部调用设置超时（如 asyncio.wait_for），超时返回明确错误", "返回结构化错误（错误码 + 信息），不静默吞异常，重试有上限", "日志写入前对密码、token、手机号等敏感字段脱敏，且不修改原始数据"], "ref": "1. **参数校验**：用 `json.loads` 解析（绝不 `eval`），捕获解析异常；校验必填字段、类型、取值范围和枚举白名单；不合法时不执行，返回指出具体字段问题的错误。\n2. **超时处理**：所有外部调用设置超时（`asyncio.wait_for`、HTTP 客户端 timeout），超时后取消并返回 `TIMEOUT` 错误；重试需要次数上限和退避。\n3. **明确错误**：返回结构化结果如 `{'ok': False, 'error': {'code': ..., 'message': ...}}`，区分参数错误、超时、下游错误；不要 `except: pass`，也不要把堆栈和密钥直接暴露。\n4. **日志脱敏**：写日志前递归遮蔽 password、token、api_key、手机号、身份证、银行卡等字段，脱敏函数返回副本，不影响真实调用数据。"}], "refs": [{"label": "json — JSON 编码和解码器", "url": "https://docs.python.org/zh-cn/3/library/json.html"}, {"label": "Python教程（错误和异常）", "url": "https://docs.python.org/zh-cn/3/tutorial/"}, {"label": "asyncio — 协程与任务", "url": "https://docs.python.org/zh-cn/3/library/asyncio-task.html"}], "id": "tool", "title": "工具接口工程（Agent 工具调用）", "short": "工具接口工程", "group": "异步与Agent模块", "exam": "28（多选）"}, {"lessons": [{"title": "训练循环五步（背下来）", "cards": ["```python\nimport torch\nfrom torch import nn\n\nnet = nn.Sequential(nn.Linear(2, 1))                     # 模型\nloss_fn = nn.MSELoss()                                   # 损失函数\noptimizer = torch.optim.SGD(net.parameters(), lr=0.03)   # 优化器，持有要更新的参数\n\nfor epoch in range(num_epochs):\n    net.train()\n    for X, y in data_iter:\n        pred = net(X)               # ① 前向计算\n        loss = loss_fn(pred, y)     # ② 计算损失\n        optimizer.zero_grad()       # ③ 梯度清零\n        loss.backward()             # ④ 反向传播：计算梯度，存入每个参数的 .grad\n        optimizer.step()            # ⑤ 根据梯度更新参数\n```\n\n| 步骤 | 做什么 | 不做什么 |\n|---|---|---|\n| `net(X)` | 前向计算得到预测 | |\n| `loss_fn(pred, y)` | 得到一个标量损失 | |\n| `optimizer.zero_grad()` | 把参数的 `.grad` 清零 | 不改参数 |\n| `loss.backward()` | **计算梯度**（自动求导） | **不更新参数** |\n| `optimizer.step()` | **用梯度更新参数**（如 `w -= lr * grad`） | 不计算梯度 |\n\n> 顺序要求：`zero_grad` 必须在 `backward` 之前（可以放在前向之前），`step` 必须在 `backward` 之后。PyTorch 官方教程的写法是 `loss.backward(); optimizer.step(); optimizer.zero_grad()`，也是对的——只要下一次 backward 前清零即可。"]}, {"title": "为什么要 zero_grad", "cards": ["PyTorch 中 `backward()` 计算出的梯度会**累加**到 `.grad` 上，而不是覆盖。如果不清零，第 2 个 batch 的梯度 = 第 1 个 + 第 2 个，参数更新方向就错了（会越来越大、训练不稳定）。\n\n```python\nw = torch.tensor(1.0, requires_grad=True)\n(2 * w).backward(); print(w.grad)   # tensor(2.)\n(2 * w).backward(); print(w.grad)   # tensor(4.)  ← 累加了\nw.grad.zero_()\n```\n\n（梯度累积技巧就是故意利用这一点：几个 batch 才 step + zero_grad 一次。）"]}, {"title": "train() / eval() / no_grad", "cards": ["```python\nnet.eval()                  # 切换到评估模式\nwith torch.no_grad():       # 不记录计算图、不计算梯度，省内存、更快\n    for X, y in test_iter:\n        pred = net(X)\n        test_loss += loss_fn(pred, y).item()   # .item() 取出 Python 数值\n```\n\n- `model.eval()` 只是把模型切换到**评估模式**：影响 **Dropout**（关闭随机丢弃）和 **BatchNorm**（使用训练时统计的均值方差）等层的行为。\n- `model.eval()` **不负责更新参数**，**也不会自动关闭梯度计算**——关闭梯度要用 `torch.no_grad()`。\n- 评估/推理阶段**不调用** `backward()` 和 `optimizer.step()`，所以参数不会变。\n- 回到训练前要调用 `model.train()`。"]}], "questions": [{"id": "torch-1", "m": "torch", "type": "single", "tags": [], "stem": "在 PyTorch 训练循环中，真正**更新模型参数**的是哪一步？", "options": ["`loss.backward()`", "`optimizer.step()`", "`optimizer.zero_grad()`", "`model.eval()`"], "answer": [1], "explain": "backward 只计算梯度，step 根据梯度更新参数。"}, {"id": "torch-2", "m": "torch", "type": "single", "tags": [], "stem": "`loss.backward()` 的作用是？", "options": ["更新模型参数", "通过反向传播计算损失对各参数的梯度", "把梯度清零", "计算损失值"], "answer": [1], "explain": "backward 执行自动求导，把梯度累加到各参数的 `.grad` 中。"}, {"id": "torch-3", "m": "torch", "type": "single", "tags": [], "stem": "训练循环中忘记调用 `optimizer.zero_grad()`，会导致？", "options": ["参数不会被更新", "梯度在多个 batch 之间不断累加，导致更新方向错误", "程序报错退出", "损失无法计算"], "answer": [1], "explain": "PyTorch 默认把新梯度累加到 `.grad` 上，不清零就会混入之前 batch 的梯度。"}, {"id": "torch-4", "m": "torch", "type": "single", "tags": [], "stem": "关于 `model.eval()`，说法正确的是？", "options": ["它会执行一次参数更新", "它会自动关闭所有梯度计算", "它把模型切换到评估模式，影响 Dropout、BatchNorm 等层的行为", "它会计算模型在验证集上的准确率"], "answer": [2], "explain": "eval 只切换模式，不更新参数；关闭梯度需要 `torch.no_grad()`。"}, {"id": "torch-5", "m": "torch", "type": "single", "tags": [], "stem": "下列哪个训练步骤顺序是**正确**的？", "options": ["`optimizer.step()` → `loss.backward()` → `optimizer.zero_grad()`", "前向计算 → 计算损失 → `optimizer.zero_grad()` → `loss.backward()` → `optimizer.step()`", "前向计算 → `optimizer.step()` → 计算损失 → `loss.backward()`", "`loss.backward()` → 前向计算 → `optimizer.step()`"], "answer": [1], "explain": "先算出损失才能反向传播，有了梯度才能 step。"}, {"id": "torch-6", "m": "torch", "type": "single", "tags": [], "stem": "评估阶段使用 `with torch.no_grad():` 的主要目的是？", "options": ["更新参数", "不构建计算图、不计算梯度，以节省内存和计算", "切换 Dropout 行为", "把梯度清零"], "answer": [1], "explain": "no_grad 关闭自动求导记录；切换 Dropout/BatchNorm 行为的是 `model.eval()`。"}, {"id": "torch-7", "m": "torch", "type": "single", "tags": [], "stem": "`torch.optim.SGD(net.parameters(), lr=0.03)` 中 `net.parameters()` 的作用是？", "options": ["指定损失函数", "告诉优化器需要更新哪些参数", "设置学习率", "初始化模型权重"], "answer": [1], "explain": "优化器持有这些参数的引用，`step()` 时据其 `.grad` 更新它们。"}, {"id": "torch-8", "m": "torch", "type": "single", "tags": [], "stem": "`loss.item()` 的作用是？", "options": ["计算梯度", "把只含一个元素的张量转换为 Python 数值", "返回损失函数名称", "清空损失"], "answer": [1], "explain": "常用于记录、打印损失值。"}, {"id": "torch-9", "m": "torch", "type": "multi", "tags": [], "stem": "关于 PyTorch 训练基本循环，说法正确的有？", "options": ["前向计算得到预测值，再与标签计算损失", "`loss.backward()` 计算梯度", "`optimizer.step()` 根据梯度更新参数", "`optimizer.zero_grad()` 用于清除上一步残留的梯度", "`loss.backward()` 会同时更新参数"], "answer": [0, 1, 2, 3], "explain": "计算梯度与更新参数是两个分开的步骤。"}, {"id": "torch-10", "m": "torch", "type": "multi", "tags": [], "stem": "关于 `model.eval()` 与评估阶段，说法正确的有？", "options": ["`model.eval()` 会改变 Dropout 层的行为", "`model.eval()` 会让 BatchNorm 使用训练阶段累计的统计量", "`model.eval()` 会更新模型参数", "评估阶段通常配合 `torch.no_grad()` 使用", "评估阶段不应调用 `optimizer.step()`"], "answer": [0, 1, 3, 4], "explain": "eval 不负责更新参数。"}, {"id": "torch-11", "m": "torch", "type": "multi", "tags": [], "stem": "下面哪些情况会导致模型参数**不会被更新**？", "options": ["循环中没有调用 `optimizer.step()`", "在 `torch.no_grad()` 上下文中计算损失后调用 `backward()`（会报错，得不到梯度）", "创建优化器时没有把模型参数传进去", "每次 backward 前调用了 `optimizer.zero_grad()`", "训练前调用了 `model.train()`"], "answer": [0, 1, 2], "explain": "zero_grad 和 train() 都是正确训练流程的一部分。在 no_grad 中计算的张量没有计算图，backward 会抛异常。"}, {"id": "torch-12", "m": "torch", "type": "multi", "tags": [], "stem": "关于梯度，说法正确的有？", "options": ["PyTorch 默认会把多次 backward 的梯度累加到 `.grad`", "梯度存放在参数张量的 `.grad` 属性中", "不清零梯度会导致更新使用错误的梯度", "`optimizer.step()` 会自动把梯度清零", "可以故意多次 backward 后再 step 来实现梯度累积"], "answer": [0, 1, 2, 4], "explain": "step 不会清零梯度，需要显式调用 zero_grad。"}, {"id": "torch-13", "m": "torch", "type": "short", "tags": [], "stem": "请写出 PyTorch 一个训练 step 的标准代码，并说明 `zero_grad`、`backward`、`step` 各自的作用，以及 `model.eval()` 为什么不能用来训练。", "keypoints": ["前向 pred = model(X)，loss = loss_fn(pred, y)", "zero_grad：清除累加的旧梯度", "backward：反向传播计算梯度，存入 .grad", "step：优化器根据梯度更新参数", "eval 只切换 Dropout/BatchNorm 等层的模式，不计算梯度也不更新参数"], "ref": "```python\npred = model(X)\nloss = loss_fn(pred, y)\noptimizer.zero_grad()\nloss.backward()\noptimizer.step()\n```\n\n- `zero_grad()`：PyTorch 梯度默认累加，需在每次反向传播前清除上一次的梯度。\n- `backward()`：自动求导，计算损失对各参数的梯度并存入 `param.grad`，不修改参数。\n- `step()`：优化器按照梯度和学习率更新参数。\n- `model.eval()` 只是把模型切换为评估模式（关闭 Dropout、BatchNorm 使用累计统计量），它本身不计算梯度、不更新参数；训练时应使用 `model.train()`。"}], "refs": [{"label": "动手学深度学习 3.3 线性回归的简洁实现", "url": "https://zh.d2l.ai/chapter_linear-networks/linear-regression-concise.html"}, {"label": "PyTorch Optimizing Model Parameters", "url": "https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html"}], "id": "torch", "title": "AI 训练基本循环（PyTorch）", "short": "训练循环", "group": "AI训练模块", "exam": "19（单选）、27（多选）"}, {"lessons": [{"title": "GET 路由与路径参数", "cards": ["```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"/\")                         # GET 请求 + 路径 \"/\"\nasync def root():\n    return {\"message\": \"Hello World\"} # 返回 dict → 自动序列化为 JSON\n\n@app.get(\"/items/{item_id}\")          # {item_id} 是路径参数\nasync def read_item(item_id: int):    # 函数参数名必须与 {} 中的名字一致\n    return {\"item_id\": item_id}\n```\n\n| 请求 | 响应 |\n|---|---|\n| `GET /items/3` | `{\"item_id\": 3}`（注意是**整数** 3，类型注解自动转换） |\n| `GET /items/foo` | **422** 校验错误（`foo` 不能转成 int），附带清晰的错误说明 |\n| `POST /items/3` | 405 Method Not Allowed（只定义了 GET） |\n\n**要点**\n\n- 路径参数通过**同名函数参数**提取；类型注解 = **自动转换 + 数据校验**。\n- 返回 `dict`、`list`、Pydantic 模型等，FastAPI 会**自动转成 JSON 响应**，不需要手动 `json.dumps`。\n- 函数参数不在路径中出现 → 被当作**查询参数**（`/items?skip=0`）。\n- 启动：`uvicorn main:app --reload`；自动文档：`/docs`（Swagger UI）。"]}, {"title": "路由顺序", "cards": ["路由按**声明顺序**匹配，固定路径要写在带参数的路径前面：\n\n```python\n@app.get(\"/users/me\")              # 先声明\nasync def read_me():\n    return {\"user_id\": \"current user\"}\n\n@app.get(\"/users/{user_id}\")       # 后声明\nasync def read_user(user_id: str):\n    return {\"user_id\": user_id}\n```\n\n如果顺序反过来，`/users/me` 会被 `/users/{user_id}` 先匹配，`user_id` 得到 `\"me\"`。"]}], "questions": [{"id": "api-1", "m": "api", "type": "single", "tags": [], "stem": "```python\n@app.get(\"/items/{item_id}\")\nasync def read_item(item_id: int):\n    return {\"item_id\": item_id}\n```\n请求 `GET /items/5` 的响应体是？", "options": ["`{\"item_id\": \"5\"}`", "`{\"item_id\": 5}`", "`5`", "`{\"item_id\": null}`"], "answer": [1], "explain": "类型注解 `int` 让 FastAPI 把路径中的字符串 \"5\" 转为整数 5，dict 自动序列化为 JSON。"}, {"id": "api-2", "m": "api", "type": "single", "tags": [], "stem": "同上代码，请求 `GET /items/abc` 会得到？", "options": ["`{\"item_id\": \"abc\"}`", "`{\"item_id\": 0}`", "422 校验错误响应", "500 服务器内部错误"], "answer": [2], "explain": "\"abc\" 无法转换为 int，FastAPI 自动返回 422 并说明错误原因。"}, {"id": "api-3", "m": "api", "type": "single", "tags": [], "stem": "FastAPI 中路径参数 `{item_id}` 的值是如何传给处理函数的？", "options": ["通过全局变量 `request.item_id`", "通过与之**同名**的函数参数", "必须手动解析 URL 字符串", "通过函数的第一个参数，名字任意"], "answer": [1], "explain": "FastAPI 按名称把路径中的 `{item_id}` 匹配到函数参数 `item_id`。"}, {"id": "api-4", "m": "api", "type": "single", "tags": [], "stem": "处理函数 `return {\"name\": \"张三\", \"age\": 20}` 时，FastAPI 会？", "options": ["报错，必须返回字符串", "必须先手动 `json.dumps` 再返回", "自动将字典序列化为 JSON 响应", "返回 Python 的 `repr` 字符串"], "answer": [2], "explain": "FastAPI 会把 dict、list、Pydantic 模型等自动转换为 JSON 响应。"}, {"id": "api-5", "m": "api", "type": "single", "tags": [], "stem": "定义一个处理 HTTP GET 请求、路径为 `/health` 的路由，正确的装饰器是？", "options": ["`@app.route(\"/health\")`", "`@app.get(\"/health\")`", "`@app.post(\"/health\")`", "`@get(\"/health\")`"], "answer": [1], "explain": "FastAPI 用 `@app.get`、`@app.post` 等按 HTTP 方法声明路由。`@app.route` 是 Flask 风格。"}, {"id": "api-6", "m": "api", "type": "single", "tags": [], "stem": "同时定义了 `/users/{user_id}`（先声明）和 `/users/me`（后声明），请求 `GET /users/me` 会？", "options": ["匹配 `/users/me`", "匹配 `/users/{user_id}`，`user_id` 的值为 `\"me\"`", "返回 404", "随机匹配其中一个"], "answer": [1], "explain": "路由按声明顺序匹配，固定路径应写在参数路径之前。"}, {"id": "api-7", "m": "api", "type": "multi", "tags": [], "stem": "关于 FastAPI 路径参数，说法正确的有？", "options": ["路径中用 `{参数名}` 声明路径参数", "函数参数的类型注解会用于类型转换和校验", "类型不匹配时自动返回 422 错误", "路径参数只能是字符串，不能声明为 int", "返回的字典会自动转换为 JSON"], "answer": [0, 1, 2, 4], "explain": "路径参数可以声明为 int、float、str、枚举等类型。"}], "refs": [{"label": "FastAPI 教程·路径参数", "url": "https://fastapi.tiangolo.com/zh/tutorial/path-params/"}], "id": "api", "title": "FastAPI 路由基础", "short": "FastAPI", "group": "Web接口服务模块", "exam": "17（单选）"}], "cheatsheet": "### Python 基础\n\n- `{}` 是空 dict，空集合 `set()`；`(1)` 是 int，`(1,)` 才是元组。\n- `b = a` 不复制；`a[:]` / `a.copy()` 浅拷贝；`copy.deepcopy` 深拷贝；`[[0]*n]*m` 行共享。\n- `lst.sort()` 返回 **None**；`sorted()` 返回新列表；两者**稳定**。\n- 多关键字：`key=lambda r: (-r['amt'], r['id'])`。\n- `return a, b` 返回元组；`a, *b = [1,2,3]` → `b=[2,3]`（list）；个数不符 `ValueError`。\n- `x in d` 查**键**；`d['k']` 缺键 `KeyError`，`d.get('k', 0)` 不报错。\n- 推导式：尾部 `if` 过滤，前部 `if...else` 变换；`(x for ...)` 是生成器。\n\n### 函数语义（简答 29）\n\n- 默认参数**定义时求值一次**，可变默认值被**所有调用共享** → 结果累积。修复：`=None` + 函数内新建。\n- 不可变：int float bool str tuple frozenset；可变：list dict set。\n- 传参传**对象引用**：原地修改（append、`+=` 列表）调用方可见；重新赋值不可见。\n\n### 迭代（简答 30）\n\n- 生成器 ⊂ 迭代器 ⊂ 可迭代对象。可迭代：`__iter__`；迭代器：`__next__`，取完 `StopIteration`。\n- 生成器：`yield` / 生成器表达式；调用不执行函数体；**按需产生**省内存。\n- **只能遍历一次**：耗尽后 `list(g)` → `[]`；`map`/`zip`/`filter` 也是迭代器。\n\n### 异常与 with\n\n- `int(' 42 ')` = 42；`int('3.14')`、`int('abc')`、`int('')` → **ValueError**；`int(None)` → **TypeError**。\n- 无异常：try → else → finally；有异常：try → except → finally；try 中 return 也先执行 finally。\n- except 先具体后宽泛。with 结束自动关闭文件（异常时也关闭），始终写 `encoding='utf-8'`。\n\n### CSV / JSON\n\n- CSV 字段含逗号要加双引号，用 `csv.reader`，**别用 split(',')**；读出全是 str；`newline=''`；BOM 用 `utf-8-sig`。\n- `json.loads`：true→True，null→None，数组→list；单引号非法 → `JSONDecodeError`（ValueError 子类）。\n- 外部字符串**绝不 eval**，用 `json.loads` / `ast.literal_eval`。\n\n### Decimal\n\n- `Decimal('0.1')` ✅，`Decimal(0.1)` ❌（带二进制误差）；`Decimal + float` → TypeError；`+ int` 可以。\n- `quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)` 四舍五入；默认 ROUND_HALF_EVEN。\n- `Decimal('abc')` → `InvalidOperation`（不是 ValueError）。\n\n### 代码题 31 / 32\n\n- 过滤 `status == 'success'` **且** `amount > 0`（严格大于）。\n- 编号只 `.strip()`：不 `int()`、不 `lstrip('0')`、不 `lower()`。\n- 累加 `totals[cid] = totals.get(cid, Decimal('0')) + amount`；空输入返回 `{}`。\n- 稳定去重：`seen = set()` + `result = []`；不要 `list(set(x))`；`'001' != '1'`，`'A1' != 'a1'`。\n- `return` 不要 `print`；不改入参（需要改就先 `dict(r)` 复制）。\n\n### SQL\n\n- 执行顺序：FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY。\n- WHERE 筛行（不能用聚合），HAVING 筛组；`>` 不含边界，`BETWEEN` 含两端；AND 优先于 OR。\n- `COUNT(col)` 不计 NULL，`COUNT(*)` 计所有行。\n\n### NumPy / SciPy\n\n- `[[1,2,3],[4,5,6]]` shape `(2, 3)`；一维 `(3,)`。\n- axis=0 按列（竖着压），axis=1 按行；聚合后该轴消失；整数 mean 得浮点。\n- `*` 逐元素，`@` 矩阵乘；广播从最后一维对齐，相等或为 1；(2,3)+(3,) ✅，(2,3)+(2,) ❌。\n- `zscore` = (x-均值)/标准差，同形状输出，均值 0 标准差 1，|z|>3 视为异常；ddof 默认 0。\n\n### pandas\n\n- 编号读成字符串：`read_csv(..., dtype={'cid': str})`。\n- 筛选用 `& | ~` + 括号，不能 `and/or`。\n- `groupby('cid')['amount'].sum()` → 以 cid 为索引的 Series。\n- `isna()` 判缺失（不能 `== np.nan`）；`fillna` 返回新对象要赋值回去；sum/mean 默认跳过 NaN。\n- `drop_duplicates(subset=['cid'], keep='first')`；`sort_values('amount', ascending=False)`。\n\n### asyncio\n\n- 调用协程函数只得到协程对象；`await` 只能在 `async def` 里；入口 `asyncio.run(main())`。\n- `asyncio.sleep` 非阻塞，`time.sleep` 阻塞整个事件循环。\n- `gather(1s, 2s, 3s)` ≈ 3 秒；依次 await ≈ 6 秒；结果按**传入顺序**。\n- async **不提供 CPU 并行**（单线程事件循环）；CPU 密集用多进程。\n\n### 工具接口工程\n\n- 参数：`json.loads` + 校验必填/类型/范围/白名单，失败返回明确错误。\n- 外部调用必须超时（`asyncio.wait_for`），返回结构化错误码；不 `except: pass`；重试有上限。\n- 日志先脱敏（password/token/手机号…），递归处理、返回副本；base64 不是脱敏。\n\n### 训练循环\n\n- `pred = model(X)` → `loss = loss_fn(pred, y)` → `optimizer.zero_grad()` → `loss.backward()` → `optimizer.step()`。\n- backward **算梯度**不更新；step **更新参数**；不 zero_grad 梯度会累加。\n- `model.eval()` 只切换 Dropout/BatchNorm 模式，**不更新参数、不关梯度**；关梯度用 `torch.no_grad()`。\n\n### FastAPI\n\n- `@app.get(\"/items/{item_id}\")` + `def f(item_id: int)`：同名参数提取，类型注解自动转换；类型不符返回 **422**。\n- 返回 dict 自动序列化为 JSON；固定路由写在参数路由之前。\n", "harness": "\n_results = []\ndef check(name, fn, expected):\n    try:\n        got = fn()\n        ok = got == expected\n        _results.append({'name': name, 'ok': ok, 'got': repr(got), 'expected': repr(expected)})\n    except Exception as e:\n        _results.append({'name': name, 'ok': False, 'got': type(e).__name__ + ': ' + str(e), 'expected': repr(expected)})\n"};</script>

const isPractice = q => q.lesson !== undefined;
const drillPool = () => Object.values(QS).filter(q => !isPractice(q));

/* ============================================================
 * 进度存储
 * ============================================================ */
const KEY = 'exam-review-v1';
const DEFAULT_STATE = () => ({ lessons: {}, q: {}, mocks: [], code: {}, last: null, settings: { blind: false } });
let S = loadState();

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && typeof raw === 'object') return Object.assign(DEFAULT_STATE(), raw);
  } catch (e) { /* 损坏就重新开始 */ }
  return DEFAULT_STATE();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('进度保存失败：浏览器存储不可用'); }
}

const qs = id => S.q[id] || {};
const lessonKey = (mid, li) => `${mid}:${li}`;
const lessonState = (mid, li) => S.lessons[lessonKey(mid, li)] || {};

// 记录一次作答。错题进错题本；在错题本里连续答对 2 次移出
function record(id, ok) {
  const st = S.q[id] || (S.q[id] = { n: 0, wrong: 0 });
  st.n++; st.ok = ok; st.t = Date.now();
  if (!ok) {
    st.wrong++;
    st.box = { lv: 0, due: Date.now() };
  } else if (st.box) {
    if (st.box.lv === 0) st.box = { lv: 1, due: Date.now() + DAY };
    else delete st.box;
  }
  save();
}
function toggleUnsure(id) {
  const st = S.q[id] || (S.q[id] = { n: 0, wrong: 0 });
  st.unsure = !st.unsure;
  save();
  return st.unsure;
}

const FILTERS = {
  all: { name: '全部', fn: () => true },
  new: { name: '没做过', fn: id => !qs(id).n },
  wrong: { name: '做错过', fn: id => qs(id).wrong > 0 },
  unsure: { name: '不熟', fn: id => !!qs(id).unsure },
};

function modStats(mid) {
  const m = MOD[mid];
  const pool = m.questions.filter(q => !isPractice(q));
  const done = pool.filter(q => qs(q.id).n);
  const right = done.filter(q => qs(q.id).ok);
  const lessonsDone = m.lessons.filter((_, i) => lessonState(mid, i).done).length;
  return { total: pool.length, done: done.length, right: right.length, lessons: m.lessons.length, lessonsDone };
}
const dueList = () => Object.keys(S.q).filter(id => QS[id] && S.q[id].box && S.q[id].box.due <= Date.now());
const boxList = () => Object.keys(S.q).filter(id => QS[id] && S.q[id].box);
const unsureList = () => Object.keys(S.q).filter(id => QS[id] && S.q[id].unsure);

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function confirmBox(msg, okText = '确定', cancelText = '取消') {
  return new Promise(resolve => {
    const m = $('#modal');
    m.innerHTML = `<div class="modal-bg"><div class="modal-card" role="dialog"><div class="modal-msg">${msg}</div>
      <div class="modal-actions"><button class="btn secondary" data-v="0">${cancelText}</button><button class="btn primary" data-v="1">${okText}</button></div></div></div>`;
    m.classList.add('show');
    const done = v => { m.classList.remove('show'); m.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); done(false); }
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(true); }
    };
    document.addEventListener('keydown', onKey, true);
    m.querySelectorAll('button').forEach(b => b.onclick = () => done(b.dataset.v === '1'));
    $('.btn.primary', m).focus();
  });
}

/* ============================================================
 * Markdown 渲染 + 简易语法高亮
 * ============================================================ */
const PY_KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PY_BI = new Set('print len range list dict set tuple str int float bool type isinstance sorted enumerate zip map filter sum min max abs open iter next repr id super object Exception ValueError TypeError KeyError IndexError StopIteration ZeroDivisionError'.split(' '));
const SQL_KW = new Set('SELECT FROM WHERE AND OR NOT GROUP BY HAVING ORDER ASC DESC AS COUNT SUM AVG MIN MAX INSERT INTO VALUES CREATE TABLE LIMIT JOIN ON IN IS NULL DISTINCT BETWEEN LIKE'.split(' '));

function highlight(code, lang) {
  if (lang === 'sql') {
    return code.replace(/(--[^\n]*)|('(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([^\w'-]+|-)/g, (m, c, s, n, w) => {
      if (c) return `<span class="hl-c">${esc(c)}</span>`;
      if (s) return `<span class="hl-s">${esc(s)}</span>`;
      if (n) return `<span class="hl-n">${n}</span>`;
      if (w && SQL_KW.has(w.toUpperCase())) return `<span class="hl-k">${w}</span>`;
      return esc(m);
    });
  }
  if (lang !== 'python' && lang !== 'py') return esc(code);
  const re = /(#[^\n]*)|([rbfuRBFU]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'))|(\b\d[\d_]*(?:\.\d+)?(?:e-?\d+)?\b)|(@\w+)|([A-Za-z_]\w*)|([^#'"\w@]+|.)/g;
  let prevDef = false;
  return code.replace(re, (m, c, s, n, deco, w) => {
    if (c) return `<span class="hl-c">${esc(c)}</span>`;
    if (s) return `<span class="hl-s">${esc(s)}</span>`;
    if (n) return `<span class="hl-n">${n}</span>`;
    if (deco) return `<span class="hl-d">${esc(deco)}</span>`;
    if (w) {
      if (prevDef) { prevDef = false; return `<span class="hl-f">${w}</span>`; }
      if (PY_KW.has(w)) { prevDef = (w === 'def' || w === 'class'); return `<span class="hl-k">${w}</span>`; }
      if (PY_BI.has(w)) return `<span class="hl-b">${w}</span>`;
      return w;
    }
    return esc(m);
  });
}

marked.use({
  gfm: true,
  renderer: {
    code({ text, lang }) {
      const parts = (lang || '').trim().split(/\s+/);
      const language = parts[0] || '';
      const runnable = parts.includes('run');
      const enc = encodeURIComponent(text);
      return `<div class="code${runnable ? ' runnable' : ''}" data-code="${enc}">`
        + (runnable ? `<div class="code-bar"><span class="code-label">${icon('terminal', 14)}可运行 · 可以直接改代码再运行</span><button class="run-btn">${icon('play', 13)}运行</button></div>` : '')
        + `<pre><code${runnable ? ' contenteditable="plaintext-only" spellcheck="false"' : ''}>${highlight(text, language)}</code></pre>`
        + (runnable ? `<div class="run-out" hidden><div class="run-out-label">输出</div><pre></pre></div>` : '')
        + `</div>`;
    },
  },
});
function md(src) {
  const el = document.createElement('div');
  el.className = 'md';
  el.innerHTML = marked.parse(src || '');
  $$('a[href^="http"]', el).forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  $$('blockquote', el).forEach(decorateCallout);
  return el;
}
const mdHtml = src => md(src).innerHTML;

// 引用块按开头的符号变成「提示 / 注意 / 本节要点」卡片
const CALLOUTS = [
  { re: /^\s*💡\uFE0F?\s*/, cls: 'tip', label: '提示', icon: 'bulb' },
  { re: /^\s*⚠\uFE0F?\s*/, cls: 'warn', label: '注意', icon: 'alert' },
  { re: /^\s*📌\uFE0F?\s*/, cls: 'key', label: '本节要点', icon: 'bookmark' },
];
function decorateCallout(bq) {
  const walker = document.createTreeWalker(bq, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode()) && !node.nodeValue.trim());
  if (!node) return;
  const c = CALLOUTS.find(c => c.re.test(node.nodeValue));
  if (!c) { bq.classList.add('callout', 'tip'); return; }
  node.nodeValue = node.nodeValue.replace(c.re, '');
  const first = bq.firstElementChild;
  if (c.cls === 'key' && first && /^本节要(记住|点)$/.test(first.textContent.trim())) first.remove();
  bq.classList.add('callout', c.cls);
  bq.prepend(h(`<div class="callout-head">${icon(c.icon, 15)}<span>${c.label}</span></div>`));
}
const mdInline = src => marked.parseInline(src || '');

// 讲解里的“▶ 运行”
document.addEventListener('click', async e => {
  const btn = e.target.closest('.run-btn');
  if (!btn) return;
  const box = btn.closest('.code');
  const code = $('code', box).innerText;
  const out = $('.run-out', box), pre = $('pre', out);
  out.hidden = false; out.className = 'run-out loading'; pre.textContent = '运行中…';
  btn.disabled = true;
  const r = await Py.run(code, '', status => { pre.textContent = status; });
  btn.disabled = false;
  out.classList.remove('loading');
  if (r.ok) {
    pre.textContent = r.out || '（没有输出。想看结果要用 print）';
  } else {
    out.classList.add('err');
    pre.textContent = (r.out ? r.out + '\n' : '') + r.error;
  }
});

/* ============================================================
 * Python 运行环境（Pyodide，放在 Web Worker 里，死循环可以强制停）
 * ============================================================ */
const PY_URL = 'https://cdn.jsdelivr.net/pyodide/v0.29.0/full/';
const Py = (() => {
  let worker = null, ready = false, readyWaiters = [], seq = 0, pending = {}, loadError = null;
  const src = `
    importScripts('${PY_URL}pyodide.js');
    const boot = loadPyodide({ indexURL: '${PY_URL}' }).then(py => { postMessage({ type: 'ready' }); return py; },
      err => { postMessage({ type: 'fail', error: String(err && err.message || err) }); throw err; });
    function clean(msg) {
      const lines = String(msg).split('\\n');
      const i = lines.findIndex(l => l.includes('File "<exec>"'));
      return i >= 0 ? 'Traceback (most recent call last):\\n' + lines.slice(i).join('\\n').trim() : String(msg).trim();
    }
    self.onmessage = async e => {
      const { id, code, after } = e.data;
      const py = await boot;
      const out = [];
      py.setStdout({ batched: s => out.push(s) });
      py.setStderr({ batched: s => out.push(s) });
      const ns = py.globals.get('dict')();
      let phase = 'user';
      try {
        const all = code + '\\n' + (after || '');
        const want = ['numpy', 'pandas', 'scipy', 'sqlite3'].filter(p => new RegExp('^\\\\s*(import|from)\\\\s+' + p + '\\\\b', 'm').test(all));
        if (want.length) await py.loadPackage(want, { messageCallback: () => {} });
        await py.runPythonAsync(code, { globals: ns });
        let results = null;
        if (after) {
          phase = 'tests';
          await py.runPythonAsync(after, { globals: ns });
          results = ns.get('_results_json');
        }
        postMessage({ type: 'done', id, ok: true, out: out.join('\\n'), results });
      } catch (err) {
        postMessage({ type: 'done', id, ok: false, phase, out: out.join('\\n'), error: clean(err && err.message || err) });
      } finally { ns.destroy(); }
    };`;

  function start() {
    ready = false; loadError = null;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => {
      const d = e.data;
      if (d.type === 'ready') { ready = true; readyWaiters.splice(0).forEach(f => f(true)); updateBadge(); }
      else if (d.type === 'fail') { loadError = d.error; readyWaiters.splice(0).forEach(f => f(false)); updateBadge(); }
      else if (d.type === 'done' && pending[d.id]) { pending[d.id](d); delete pending[d.id]; }
    };
    worker.onerror = e => {
      loadError = e.message || '无法加载 Python 运行环境';
      readyWaiters.splice(0).forEach(f => f(false));
      updateBadge();
    };
    updateBadge();
  }
  function waitReady() {
    if (!worker) start();
    if (ready) return Promise.resolve(true);
    if (loadError) return Promise.resolve(false);
    return new Promise(r => readyWaiters.push(r));
  }
  function updateBadge() {
    const b = $('#py-status');
    if (b) b.textContent = status();
  }
  function status() {
    if (!worker) return '未加载（第一次运行代码时自动加载）';
    if (ready) return '✅ 已就绪';
    if (loadError) return '❌ 加载失败：' + loadError;
    return '⏳ 加载中…';
  }
  async function run(code, after, onStatus, timeoutMs = 15000) {
    if (!ready) onStatus && onStatus('正在加载 Python 运行环境（第一次需要联网下载约 10MB，之后会快很多）…');
    const ok = await waitReady();
    if (!ok) {
      const err = loadError;
      worker && worker.terminate(); worker = null; // 下次重试
      return { ok: false, offline: true, error: 'Python 运行环境加载失败（需要联网）。\n' + (err || '') };
    }
    onStatus && onStatus('运行中…');
    const id = ++seq;
    return new Promise(resolve => {
      const timer = setTimeout(() => {
        delete pending[id];
        worker.terminate(); worker = null; ready = false;
        resolve({ ok: false, error: `运行超过 ${timeoutMs / 1000} 秒被强制停止——是不是写了死循环？` });
      }, timeoutMs);
      pending[id] = d => { clearTimeout(timer); resolve(d); };
      worker.postMessage({ id, code, after });
    });
  }
  return { run, status, preload: () => waitReady() };
})();

const HARNESS = DATA.harness + '\n';
async function runTests(q, userCode, onStatus) {
  const after = HARNESS + q.tests + '\nimport json as _json\n_results_json = _json.dumps(_results, ensure_ascii=False)\n';
  const r = await Py.run(userCode, after, onStatus);
  if (r.ok) r.results = JSON.parse(r.results);
  return r;
}

function icon(name, size = 18) {
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}
// 环形进度
function ring(pct, size = 44, stroke = 4, cls = '') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(1, pct));
  return `<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" class="ring-bg" fill="none"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" class="ring-fg" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 ${size / 2} ${size / 2})" stroke-linecap="round"/></svg>`;
}

const NAV = [

function renderNav() {
  const hash = location.hash || '#/';
  const active = NAV.find(n => n.match.test(hash)) || (hash.startsWith('#/run') ? null : NAV[0]);
  const due = dueList().length;
  const item = n => `<a href="${n.href}" class="${n === active ? 'on' : ''}">${icon(n.icon, 18)}<span>${n.name}</span>${n.href === '#/review' && due ? `<i class="count">${due}</i>` : ''}</a>`;

  // 侧栏底部：总进度
  const allLessons = MODS.reduce((a, m) => a + m.lessons.length, 0);

function initShell() {
  $('#brand').innerHTML = BRAND;
  $('#mobile-top').innerHTML = `<a class="brand" href="#/">${BRAND}</a><a class="icon-btn" href="#/settings" aria-label="设置">${icon('settings', 20)}</a>`;
}

function route() {
  if (viewLeave) { viewLeave(); viewLeave = null; }
  viewKeys = null;
  const hash = location.hash || '#/';
  const parts = hash.slice(2).split('/').filter(Boolean);
  const main = $('#main');
  main.innerHTML = '';
  main.className = '';
  const [p0, p1, p2] = parts;
  if (!p0) viewHome(main);
  else if (p0 === 'm' && MOD[p1]) viewModule(main, p1);
  else if (p0 === 'l' && MOD[p1] && MOD[p1].lessons[+p2]) viewLesson(main, p1, +p2);
  else if (p0 === 'drill') viewDrill(main, p1);
  else if (p0 === 'run') viewRun(main);
  else if (p0 === 'review') viewReview(main);
  else if (p0 === 'mock' && p1) viewMockPaper(main, p1);
  else if (p0 === 'mock') viewMockHome(main);
  else if (p0 === 'sheet') viewSheet(main);
  else if (p0 === 'settings') viewSettings(main);
  else viewHome(main);
  document.body.classList.toggle('focus-mode', p0 === 'run' || p0 === 'l' || (p0 === 'mock' && !!p1));
  renderNav();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('show')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'textarea' || tag === 'input' || e.target.isContentEditable;
  if (typing && !((e.ctrlKey || e.metaKey) && e.key === 'Enter')) return;
  if (e.altKey) return;
  if ((e.ctrlKey || e.metaKey) && e.key !== 'Enter') return;
  if (viewKeys) viewKeys(e);
});

const go = hash => { if (location.hash === hash) route(); else location.hash = hash; };
function setLast(hash, label) { S.last = { hash, label }; save(); }

function nextLesson() {
  for (const st of STAGES) for (const mid of st.mods) {
    const m = MOD[mid]; if (!m) continue;
    for (let i = 0; i < m.lessons.length; i++) if (!lessonState(mid, i).done) return { mid, i };
  }
  return null;
}
function greeting() {
  const hr = new Date().getHours();
  return hr < 6 ? '夜深了' : hr < 11 ? '早上好' : hr < 13 ? '中午好' : hr < 18 ? '下午好' : '晚上好';
}

function viewHome(main) {
  main.className = 'wide';
  const pool = drillPool();
  const done = pool.filter(q => qs(q.id).n).length;
  const right = pool.filter(q => qs(q.id).n && qs(q.id).ok).length;
  const allLessons = MODS.reduce((a, m) => a + m.lessons.length, 0);
  const doneLessons = MODS.reduce((a, m) => a + modStats(m.id).lessonsDone, 0);

  let cont = null;
  const parseLast = S.last && S.last.hash.match(/^#\/l\/(\w+)\/(\d+)/);
  if (parseLast && MOD[parseLast[1]] && MOD[parseLast[1]].lessons[+parseLast[2]] && !lessonState(parseLast[1], +parseLast[2]).done) cont = { mid: parseLast[1], i: +parseLast[2], resume: true };
  else { const nl = nextLesson(); if (nl) cont = { mid: nl.mid, i: nl.i, resume: false }; }

  main.append(pageHead({
    eyebrow: new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' }),

    desc: '按推荐顺序学，也可以点任意模块直接跳过去。所有进度自动保存在本机浏览器。',
  }));

  if (cont) {
    const m = MOD[cont.mid], l = m.lessons[cont.i], s = modStats(cont.mid);
    const ls = lessonState(cont.mid, cont.i);
    const pct = s.lessons ? s.lessonsDone / s.lessons : 0;
    const card = h(`<a class="continue-card" href="#/l/${cont.mid}/${cont.i}">
      <div class="cc-ring">${ring(pct, 64, 5)}<span>${Math.round(pct * 100)}<small>%</small></span></div>
      <div class="cc-body">
        <div class="eyebrow">${cont.resume && !ls.done ? '继续上次的位置' : '下一节'}</div>
        <h2>${esc(l.title)}</h2>
        <p>${esc(m.short)} · 第 ${cont.i + 1} 节，共 ${m.lessons.length} 节${ls.card && !ls.done ? ` · 已读到第 ${ls.card + 1}/${l.cards.length} 步` : ''}</p>
      </div>
      <span class="btn primary lg">${cont.resume && ls.card && !ls.done ? '继续学习' : '开始学习'}${icon('arrowRight', 16)}</span>
    </a>`);
    main.append(card);
  }

  const due = dueList().length;
  main.append(h(`<section class="kpis">
    <a class="kpi" href="#/"><div class="kpi-ic">${icon('book', 18)}</div><div><b>${doneLessons}<small> / ${allLessons}</small></b><span>已学课时</span></div></a>
    <a class="kpi" href="#/drill"><div class="kpi-ic">${icon('list', 18)}</div><div><b>${done}<small> / ${pool.length}</small></b><span>刷题单已做</span></div></a>
    <a class="kpi" href="#/drill"><div class="kpi-ic">${icon('target', 18)}</div><div><b>${done ? Math.round(right / done * 100) + '<small>%</small>' : '—'}</b><span>最近正确率</span></div></a>
    <a class="kpi ${due ? 'alert' : ''}" href="#/review"><div class="kpi-ic">${icon('review', 18)}</div><div><b>${due}</b><span>${due ? '道错题待复习' : '暂无待复习错题'}</span></div></a>
  </section>`));

  const path = h(`<section class="path"><div class="section-title"><h2>学习路线</h2><span class="muted">4 个阶段 · ${MODS.length} 个模块</span></div></section>`);
  for (const st of STAGES) {
    const mods = st.mods.filter(m => MOD[m]);
    const stDone = mods.filter(mid => { const s = modStats(mid); return s.lessons && s.lessonsDone === s.lessons; }).length;
    const sec = h(`<div class="stage">
      <div class="stage-head"><span class="stage-n">${st.n}</span><div class="stage-title"><h3>${st.name}</h3><p>${st.desc}</p></div><span class="stage-meta">${stDone}/${mods.length} 完成</span></div>
      <div class="mod-list"></div></div>`);
    const list = $('.mod-list', sec);
    for (const mid of mods) {
      const m = MOD[mid], s = modStats(mid);
      const lp = s.lessons ? s.lessonsDone / s.lessons : 0;
      const finished = s.lessons && s.lessonsDone === s.lessons;
      const status = finished ? `<span class="mod-status done">${icon('check', 16)}</span>`
        : s.lessonsDone ? `<span class="mod-status doing">${ring(lp, 30, 3)}</span>`
          : `<span class="mod-status todo"></span>`;
      list.append(h(`<a class="mod-row" href="#/m/${mid}">
        ${status}
        <div class="mod-main"><b>${esc(m.short)}</b><span>题号 ${esc((m.exam || '').replace(/（[^）]*分值[^）]*）/, ''))}</span></div>
