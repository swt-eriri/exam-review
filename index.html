<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考试冲刺 · Python 综合</title>
<style>/* ============================================================
 * 设计变量
 * ============================================================ */
:root {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --surface-2: #f4f4f6;
  --surface-3: #ececf0;
  --border: #e6e6eb;
  --border-strong: #d4d4dc;
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #8a8a94;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #eef0ff;
  --accent-text: #4338ca;
  --accent-ring: rgba(79, 70, 229, .16);
  --ok: #15803d;
  --ok-solid: #16a34a;
  --ok-soft: #effbf3;
  --ok-border: #b7ebc8;
  --bad: #c2262c;
  --bad-solid: #e5484d;
  --bad-soft: #fff3f3;
  --bad-border: #f8c9cb;
  --warn: #b45309;
  --warn-solid: #f59e0b;
  --warn-soft: #fff8eb;
  --warn-border: #fbdba7;
  --code-bg: #fafafb;
  --shadow-sm: 0 1px 2px rgba(16, 18, 27, .05);
  --shadow: 0 1px 2px rgba(16, 18, 27, .04), 0 2px 8px rgba(16, 18, 27, .04);
  --shadow-lg: 0 12px 40px rgba(16, 18, 27, .14), 0 2px 6px rgba(16, 18, 27, .06);
  --r-lg: 16px;
  --r: 12px;
  --r-sm: 8px;
  --sidebar: 248px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114;
    --surface: #18181c;
    --surface-2: #202026;
    --surface-3: #2a2a31;
    --border: #2c2c33;
    --border-strong: #3a3a43;
    --text: #ececf1;
    --text-2: #b0b0ba;
    --text-3: #7c7c87;
    --accent: #7c7cff;
    --accent-hover: #9292ff;
    --accent-soft: #23234a;
    --accent-text: #a5a5ff;
    --accent-ring: rgba(124, 124, 255, .25);
    --ok: #4ade80;
    --ok-solid: #22c55e;
    --ok-soft: #13261b;
    --ok-border: #1f4d2f;
    --bad: #fb7185;
    --bad-solid: #f43f5e;
    --bad-soft: #2b1519;
    --bad-border: #5a2530;
    --warn: #fbbf24;
    --warn-solid: #f59e0b;
    --warn-soft: #2a2112;
    --warn-border: #5a4418;
    --code-bg: #141418;
    --shadow-sm: none;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

/* ============================================================
 * 基础
 * ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14.5px/1.6 var(--font); letter-spacing: .01em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 650; letter-spacing: -.005em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.ic { flex: none; display: block; }
.muted { color: var(--text-3); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.spacer { flex: 1; }
.good { color: var(--ok); }
.bad { color: var(--bad); }
code, pre, kbd, textarea.editor-input { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
::selection { background: var(--accent-ring); }

/* ============================================================
 * 外框：侧栏 / 移动端顶栏 / 底部标签栏
 * ============================================================ */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar); z-index: 30;
  display: flex; flex-direction: column; padding: 20px 14px;
  background: var(--surface); border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 22px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(140deg, #6366f1, #4338ca); box-shadow: 0 2px 6px rgba(79, 70, 229, .35);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text b { font-size: 15px; font-weight: 700; }
.brand-text small { font-size: 11.5px; color: var(--text-3); }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a {
  position: relative; display: flex; align-items: center; gap: 11px;
  height: 38px; padding: 0 12px; border-radius: 9px; color: var(--text-2); font-weight: 500;
  transition: background .12s, color .12s;
}
.side-nav a:hover { background: var(--surface-2); color: var(--text); }
.side-nav a.on { background: var(--accent-soft); color: var(--accent-text); }
.side-nav a.on .ic { color: var(--accent); }
.count {
  margin-left: auto; font-style: normal; font-size: 11px; font-weight: 600; line-height: 18px;
  min-width: 20px; padding: 0 6px; border-radius: 9px; text-align: center;
  background: var(--bad-solid); color: #fff;
}
.side-foot { margin-top: auto; }
.side-progress { padding: 14px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface-2); }
.sp-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--text-2); }
.sp-row b { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
.sp-row b small { color: var(--text-3); font-weight: 400; }
.side-progress .meter { margin: 6px 0 12px; }
.side-progress .meter:last-child { margin-bottom: 0; }

.content { margin-left: var(--sidebar); min-height: 100vh; }
main { margin: 0 auto; padding: 40px 48px 96px; max-width: 1040px; }
main.reading { max-width: 800px; padding-top: 0; }
main.exam { max-width: 1180px; padding-top: 0; }

.mobile-top { display: none; }
.tabbar { display: none; }
.icon-btn {
  width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 10px;
  color: var(--text-2); background: transparent; border: 0; cursor: pointer; transition: background .12s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }

/* 沉浸模式：讲解 / 做题 / 考试时收起导航 */
body.focus-mode .sidebar { display: none; }
body.focus-mode .content { margin-left: 0; }

@media (max-width: 960px) {
  .sidebar { display: none; }
  .content { margin-left: 0; }
  main { padding: 20px 16px 104px; }
  main.reading, main.exam { padding-bottom: 120px; }
  .mobile-top {
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 30; height: 56px; padding: 0 12px 0 8px;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .mobile-top .brand { padding: 0 4px; }
  .mobile-top .brand-mark { width: 30px; height: 30px; border-radius: 9px; }
  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--border);
  }
  .tabbar a {
    position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 0; font-size: 11px; color: var(--text-3); font-weight: 500;
  }
  .tabbar a.on { color: var(--accent); }
  .tabbar .count { position: absolute; top: -2px; left: calc(50% + 6px); margin: 0; }
  body.focus-mode .mobile-top, body.focus-mode .tabbar { display: none; }
}

/* ============================================================
 * 通用组件
 * ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent;
  font-size: 14px; font-weight: 550; white-space: nowrap; cursor: pointer; user-select: none;
  transition: background .12s, border-color .12s, box-shadow .12s, color .12s, transform .06s;
}
.btn:active:not(:disabled) { transform: translateY(.5px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(67, 56, 202, .25), inset 0 1px 0 rgba(255, 255, 255, .12); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text); box-shadow: var(--shadow-sm); }
.btn.secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn.ghost { background: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn.success { background: var(--ok-solid); color: #fff; }
.btn.success:hover:not(:disabled) { filter: brightness(.95); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad-border); }
.btn.danger:hover:not(:disabled) { background: var(--bad-soft); }
.btn.lg { height: 44px; padding: 0 20px; font-size: 15px; border-radius: 11px; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn kbd.on-btn { background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .25); color: #fff; margin-left: 2px; }
.btn-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-head h3 { font-size: 15px; }

.pill {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px;
  font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--text-2);
}
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.type-single { background: var(--accent-soft); color: var(--accent-text); }
.pill.type-multi { background: var(--warn-soft); color: var(--warn); }
.pill.type-short { background: var(--ok-soft); color: var(--ok); }
.pill.type-code { background: #f3edff; color: #6d28d9; }
@media (prefers-color-scheme: dark) { .pill.type-code { background: #2a1f45; color: #c4b5fd; } }

.meter { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.meter.lg { height: 8px; }
.ring-bg { stroke: var(--surface-3); }
.ring-fg { stroke: var(--accent); transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1); }

kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
  font: 600 11px/1 var(--mono); color: var(--text-2); border-radius: 5px;
  background: var(--surface); border: 1px solid var(--border-strong); box-shadow: 0 1px 0 var(--border-strong);
}

.eyebrow { font-size: 12.5px; font-weight: 600; color: var(--accent-text); letter-spacing: .02em; }
.lead { color: var(--text-2); font-size: 15px; margin-top: 8px; max-width: 640px; }

.page-head { margin-bottom: 28px; }
.page-head h1 { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -.01em; }
.ph-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); margin-bottom: 14px; }
.crumbs a:hover { color: var(--text); }
.crumbs .ic { opacity: .6; }
@media (max-width: 960px) {
  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; }
  .ph-row { flex-direction: column; align-items: stretch; gap: 16px; }
  .ph-aside .btn { width: 100%; }
}

.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 36px 0 16px; }
.section-title h2 { font-size: 18px; }

.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.side-col { display: flex; flex-direction: column; }
@media (max-width: 960px) { .two-col { grid-template-columns: 1fr; gap: 0; } }

.empty { text-align: center; padding: 48px 20px; background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--r-lg); }
.empty-ic { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); }
.empty h3 { font-size: 16px; margin-bottom: 6px; }
.empty p { color: var(--text-3); margin-bottom: 18px; }

#toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 80; max-width: min(92vw, 520px);
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  padding: 11px 18px; border-radius: 12px; background: #1f1f24; color: #fff; font-size: 13.5px;
  box-shadow: var(--shadow-lg); transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 960px) { #toast { bottom: 96px; } }
#modal { display: none; }
#modal.show { display: block; }
.modal-bg { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: rgba(12, 12, 18, .42); backdrop-filter: blur(2px); animation: fade .15s; }
.modal-card { width: min(420px, 100%); padding: 24px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-lg); animation: pop .18s cubic-bezier(.2, .8, .2, 1); }
.modal-msg { font-size: 15px; line-height: 1.7; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin .7s linear infinite; flex: none; }
.spinner.lg { width: 32px; height: 32px; border-width: 3px; margin: 0 auto 16px; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes inRight { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes inLeft { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.in-right { animation: inRight .22s cubic-bezier(.2, .8, .2, 1); }
.in-left { animation: inLeft .22s cubic-bezier(.2, .8, .2, 1); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ============================================================
 * 首页
 * ============================================================ */
.continue-card {
  display: flex; align-items: center; gap: 22px; padding: 22px 24px; margin-bottom: 16px;
  border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow);
  position: relative; overflow: hidden; transition: border-color .15s, box-shadow .15s;
}
.continue-card::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(600px 160px at 0% 0%, var(--accent-soft), transparent 70%);
}
.continue-card > * { position: relative; }
.continue-card:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); box-shadow: 0 4px 16px rgba(79, 70, 229, .08); }
.cc-ring { position: relative; width: 64px; height: 64px; flex: none; }
.cc-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.cc-ring small { font-size: 10px; color: var(--text-3); font-weight: 500; }
.cc-body { flex: 1; min-width: 0; }
.cc-body h2 { font-size: 19px; margin: 3px 0 4px; }
.cc-body p { color: var(--text-3); font-size: 13.5px; }
@media (max-width: 640px) {
  .continue-card { flex-wrap: wrap; gap: 14px; padding: 18px; }
  .continue-card .btn { width: 100%; }
}

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow);
  transition: border-color .15s;
}
.kpi:hover { border-color: var(--border-strong); }
.kpi-ic { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.kpi b { display: block; font-size: 21px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi b small { font-size: 13px; color: var(--text-3); font-weight: 500; }
.kpi span { font-size: 12.5px; color: var(--text-3); }
.kpi.alert .kpi-ic { background: var(--bad-soft); color: var(--bad); }
.kpi.alert b { color: var(--bad); }
@media (max-width: 960px) { .kpis { grid-template-columns: repeat(2, 1fr); gap: 10px; } .kpi { padding: 14px; gap: 12px; } .kpi b { font-size: 18px; } }

.stage { margin-bottom: 22px; }
.stage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.stage-n {
  width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; background: var(--text); color: var(--surface);
}
.stage-title { flex: 1; min-width: 0; }
.stage-title h3 { font-size: 15px; }
.stage-title p { font-size: 12.5px; color: var(--text-3); }
.stage-meta { font-size: 12.5px; color: var(--text-3); }
.mod-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.mod-row {
  display: grid; grid-template-columns: 32px minmax(0, 1.6fr) 70px minmax(120px, 1.2fr) 70px 18px; align-items: center; gap: 18px;
  padding: 14px 18px; border-top: 1px solid var(--border); transition: background .12s;
}
.mod-row:first-child { border-top: 0; }
.mod-row:hover { background: var(--surface-2); }
.mod-status { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; }
.mod-status.todo { border: 2px solid var(--border-strong); width: 26px; height: 26px; margin: 2px; }
.mod-status.done { background: var(--ok-solid); color: #fff; }
.mod-main { min-width: 0; display: flex; flex-direction: column; }
.mod-main b { font-size: 14.5px; font-weight: 600; }
.mod-main span { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mod-stat { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.mod-stat .label { font-size: 11.5px; color: var(--text-3); }
.chev { color: var(--text-3); display: grid; place-items: center; }
@media (max-width: 760px) {
  .mod-row { grid-template-columns: 32px minmax(0, 1fr) 90px 16px; gap: 12px; padding: 13px 14px; }
  .mod-row .mod-stat:not(.wide) { display: none; }
}

/* ============================================================
 * 模块页
 * ============================================================ */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline li a { display: flex; align-items: center; gap: 14px; padding: 12px 10px; border-radius: 10px; position: relative; transition: background .12s; }
.timeline li a:hover { background: var(--surface-2); }
.timeline li:not(:last-child) a::after {
  content: ''; position: absolute; left: 24px; top: 42px; bottom: -12px; width: 2px; background: var(--border); border-radius: 2px;
}
.timeline li.done:not(:last-child) a::after { background: color-mix(in srgb, var(--ok-solid) 45%, var(--border)); }
.tl-dot {
  width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; z-index: 1;
  font-size: 13px; font-weight: 650; color: var(--text-2); background: var(--surface); border: 2px solid var(--border-strong);
}
.timeline li.done .tl-dot { background: var(--ok-solid); border-color: var(--ok-solid); color: #fff; }
.timeline li.next .tl-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); }
.tl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tl-body b { font-weight: 600; }
.tl-body span { font-size: 12.5px; color: var(--text-3); }
.ring-stat { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
.ring-stat b { display: block; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ring-stat b small { font-size: 14px; color: var(--text-3); font-weight: 500; }
.ring-stat span { font-size: 12.5px; color: var(--text-3); }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 16px; }
.mini-stats div { padding: 10px; border-radius: 10px; background: var(--surface-2); text-align: center; }
.mini-stats dt { font-size: 11.5px; color: var(--text-3); }
.mini-stats dd { margin: 2px 0 0; font-weight: 650; font-variant-numeric: tabular-nums; }
.ref-list { list-style: none; margin: 0; padding: 0; }
.ref-list a { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; color: var(--text-2); font-size: 13.5px; }
.ref-list a:hover { color: var(--accent-text); }
.ref-list .ic { margin-top: 3px; }

/* ============================================================
 * 沉浸式顶栏（讲解 / 做题 / 考试）
 * ============================================================ */
.focus-bar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
  padding: 14px 0; margin-bottom: 8px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
}
.focus-progress { flex: 1; }
.focus-count { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 44px; text-align: right; }
.segs { display: flex; gap: 4px; }
.segs i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-3); transition: background .25s; }
.segs i.past { background: color-mix(in srgb, var(--accent) 40%, var(--surface-3)); }
.segs i.cur { background: var(--accent); }

/* ============================================================
 * 讲解
 * ============================================================ */
.lesson-title { margin: 18px 0 20px; }
.lesson-title h1 { font-size: 26px; font-weight: 700; margin-top: 4px; }
.lesson-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 32px 36px; box-shadow: var(--shadow); min-height: 280px;
}
.action-bar { position: sticky; bottom: 0; z-index: 10; padding: 16px 0 20px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.action-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kbd-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-3); }
@media (max-width: 960px) {
  .lesson-title h1 { font-size: 21px; }
  .lesson-card { padding: 20px 18px; border-radius: var(--r); }
  .kbd-hint { display: none; }
  .action-bar { position: fixed; left: 0; right: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .action-bar .btn { flex: 1; }
}

/* ============================================================
 * 正文排版（讲解 / 题干 / 解析）
 * ============================================================ */
.prose { font-size: 15.5px; line-height: 1.8; color: var(--text); }
.prose > :first-child { margin-top: 0 !important; }
.prose > :last-child { margin-bottom: 0 !important; }
.prose p { margin: .7em 0; }
.prose h2, .prose h3, .prose h4 { margin: 1.5em 0 .6em; }
.prose h3 { font-size: 17px; }
.prose h4 { font-size: 15.5px; }
.prose ul, .prose ol { padding-left: 1.3em; margin: .6em 0; }
.prose li { margin: .25em 0; }
.prose li::marker { color: var(--text-3); }
.prose strong { font-weight: 650; }
.prose a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
.prose table { width: auto; border-collapse: separate; border-spacing: 0; margin: 1em 0; font-size: 14px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: block; overflow-x: auto; max-width: 100%; }
.prose th, .prose td { padding: 8px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.prose th { background: var(--surface-2); font-weight: 600; color: var(--text-2); font-size: 13px; }
.prose tr:last-child td { border-bottom: 0; }
.prose :not(pre) > code {
  font-family: var(--mono); font-size: .86em; padding: .15em .4em; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text); white-space: nowrap;
}
.prose blockquote { margin: 1em 0; padding: 0; }
.callout { padding: 14px 16px !important; border-radius: var(--r); border: 1px solid; font-size: 14.5px; line-height: 1.75; }
.callout p { margin: .3em 0; }
.callout ul { margin: .3em 0; }
.callout-head { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13px; margin-bottom: 4px; }
.callout.tip { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 20%, transparent); }
.callout.tip .callout-head { color: var(--accent-text); }
.callout.warn { background: var(--warn-soft); border-color: var(--warn-border); }
.callout.warn .callout-head { color: var(--warn); }
.callout.key { background: var(--ok-soft); border-color: var(--ok-border); }
.callout.key .callout-head { color: var(--ok); }

.code { margin: 1em 0; border: 1px solid var(--border); border-radius: var(--r); background: var(--code-bg); overflow: hidden; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.code pre code { display: block; font: 13.5px/1.7 var(--mono); color: var(--text); white-space: pre; outline: none; }
.code-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.code-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
.run-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--text);
  box-shadow: var(--shadow-sm); transition: background .12s, color .12s, border-color .12s;
}
.run-btn .ic { color: var(--ok-solid); }
.run-btn:hover:not(:disabled) { border-color: var(--ok-solid); color: var(--ok); }
.run-btn:disabled { opacity: .5; }
.runnable pre code { cursor: text; }
.runnable pre:focus-within { box-shadow: inset 0 0 0 2px var(--accent-ring); }
.run-out { border-top: 1px solid var(--border); background: var(--surface); animation: fade .2s; }
.run-out-label { padding: 8px 16px 0; font-size: 11.5px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; }
.run-out pre { margin: 0; padding: 4px 16px 12px; font: 13px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; }
.run-out.loading pre { color: var(--text-3); }
.run-out.err { background: var(--bad-soft); }
.run-out.err pre { color: var(--bad); }
.run-out.err .run-out-label { color: var(--bad); }
.hl-k { color: #8839ef; }
.hl-s { color: #2f8a3a; }
.hl-c { color: #9a9aa5; font-style: italic; }
.hl-n { color: #c2570c; }
.hl-b { color: #1e66f5; }
.hl-f { color: #0b7285; }
.hl-d { color: #c2570c; }
@media (prefers-color-scheme: dark) {
  .hl-k { color: #c6a0f6; } .hl-s { color: #a6da95; } .hl-c { color: #6e738d; }
  .hl-n { color: #f5a97f; } .hl-b { color: #8aadf4; } .hl-f { color: #7dc4e4; } .hl-d { color: #f5a97f; }
}

/* ============================================================
 * 做题
 * ============================================================ */
.session-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 14px; }
.score { display: flex; gap: 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.score span { display: inline-flex; align-items: center; gap: 3px; }
.score .good { color: var(--ok); }
.score .bad { color: var(--bad); }

.q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 26px 28px; box-shadow: var(--shadow); }
@media (max-width: 960px) { .q-card { padding: 18px 16px; border-radius: var(--r); } }
.q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.q-src { flex: 1; min-width: 0; font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unsure-btn {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-3); font-size: 12.5px; font-weight: 500; transition: all .12s;
}
.unsure-btn:hover { color: var(--text-2); border-color: var(--border-strong); }
.unsure-btn.on { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-border); }
.unsure-btn.on .ic path { fill: currentColor; }
.q-stem { font-size: 16px; }
.q-stem .code { margin: .8em 0 0; }
.q-hint { margin: 18px 0 10px; font-size: 12.5px; color: var(--text-3); }
@media (max-width: 960px) { .q-hint .desk { display: none; } }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
  transition: border-color .12s, background .12s, box-shadow .12s;
}
.opt:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); }
.opt:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
.opt-key {
  width: 26px; height: 26px; flex: none; border-radius: 7px; display: grid; place-items: center; margin-top: 1px;
  font-size: 13px; font-weight: 650; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border);
  transition: all .12s;
}
.opt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 2px; }
.opt-text { font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.opt-text code { font-family: var(--mono); font-size: .9em; padding: .1em .35em; border-radius: 5px; background: var(--surface-2); }
.opt-why { font-size: 13px; line-height: 1.6; color: var(--text-2); }
.opt-why code { font-family: var(--mono); font-size: .92em; padding: 0 .3em; border-radius: 4px; background: var(--surface-2); }
.opt-kbd { margin-top: 4px; opacity: 0; transition: opacity .12s; }
.opt:hover .opt-kbd, .opts:not(.revealed) .opt.picked .opt-kbd { opacity: 1; }
.revealed .opt-kbd { display: none; }
@media (max-width: 960px) { .opt-kbd { display: none; } }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.picked .opt-key { background: var(--accent); border-color: var(--accent); color: #fff; }
.opt:disabled { cursor: default; }
.revealed .opt:not(.right):not(.wrong):not(.missed) { opacity: .72; }
.opt.right { border-color: var(--ok-solid); background: var(--ok-soft); opacity: 1; }
.opt.right .opt-key { background: var(--ok-solid); border-color: var(--ok-solid); color: #fff; }
.opt.wrong { border-color: var(--bad-solid); background: var(--bad-soft); }
.opt.wrong .opt-key { background: var(--bad-solid); border-color: var(--bad-solid); color: #fff; }
.opt.missed { border-color: var(--ok-solid); border-style: dashed; }
.opt.missed .opt-key { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-border); }

.feedback { margin-top: 18px; padding: 16px 18px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface-2); animation: fade .2s; }
.feedback.ok { background: var(--ok-soft); border-color: var(--ok-border); }
.feedback.no { background: var(--bad-soft); border-color: var(--bad-border); }
.fb-head { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.fb-ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-3); color: var(--text-2); }
.feedback.ok .fb-ic { background: var(--ok-solid); color: #fff; }
.feedback.no .fb-ic { background: var(--bad-solid); color: #fff; }
.feedback.ok .fb-head b { color: var(--ok); }
.feedback.no .fb-head b { color: var(--bad); }
.fb-body { margin: 10px 0 0 36px; font-size: 14.5px; }
.fb-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.q-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.q-actions:empty { display: none; }
.q-actions .skip-btn { margin-left: auto; }
@media (max-width: 960px) {
  .q-actions .btn.primary { flex: 1; }
}

.kp { list-style: none; padding: 0; margin: 12px 0 6px; display: flex; flex-direction: column; gap: 6px; }
.kp label { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; transition: border-color .12s; }
.kp label:hover { border-color: var(--border-strong); }
.kp input { position: absolute; opacity: 0; pointer-events: none; }
.kp-box { width: 20px; height: 20px; flex: none; margin-top: 2px; border-radius: 6px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; color: transparent; transition: all .12s; }
.kp input:checked + .kp-box { background: var(--ok-solid); border-color: var(--ok-solid); color: #fff; }
.kp input:focus-visible + .kp-box { box-shadow: 0 0 0 3px var(--accent-ring); }
.kp code { font-family: var(--mono); font-size: .9em; padding: 0 .3em; border-radius: 4px; background: var(--surface-2); }
details.ref { margin-top: 10px; }
details summary { list-style: none; cursor: pointer; }
details summary::-webkit-details-marker { display: none; }
details.ref summary { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--accent-text); padding: 4px 0; }
details.ref .prose { margin-top: 8px; padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 14.5px; }

.answer-box {
  width: 100%; min-height: 150px; padding: 14px 16px; border-radius: 12px; resize: vertical;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: 15px/1.7 var(--font); outline: none;
  transition: border-color .12s, box-shadow .12s;
}
.answer-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.editor { margin-top: 18px; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--code-bg); transition: border-color .12s, box-shadow .12s; }
.editor:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.editor-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px 0 0; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.editor-tab { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; font: 600 12.5px var(--mono); color: var(--text-2); background: var(--code-bg); border-right: 1px solid var(--border); margin-bottom: -1px; }
.editor-tips { font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 4px; }
.editor-tips kbd { height: 18px; min-width: 18px; font-size: 10.5px; }
@media (max-width: 960px) { .editor-tips { display: none; } }
.editor-input {
  display: block; width: 100%; min-height: 240px; padding: 14px 16px; border: 0; outline: none; resize: none;
  font: 13.5px/1.7 var(--mono); tab-size: 4; white-space: pre; overflow-x: auto; overflow-wrap: normal;
  background: transparent; color: var(--text);
}
.test-out { margin-top: 14px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); font-size: 14px; animation: fade .2s; }
.test-out.loading { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
.test-out.ok { background: var(--ok-soft); border-color: var(--ok-border); }
.test-out.no, .test-out.err { background: var(--bad-soft); border-color: var(--bad-border); }
.to-head { display: flex; align-items: center; gap: 8px; }
.test-out.ok .to-head { color: var(--ok); }
.test-out.no .to-head, .test-out.err .to-head { color: var(--bad); }
.to-bar { flex: 1; max-width: 160px; height: 5px; border-radius: 9px; background: color-mix(in srgb, var(--bad-solid) 20%, transparent); overflow: hidden; margin-left: 6px; }
.to-bar i { display: block; height: 100%; background: var(--ok-solid); }
.test-out.ok .to-bar { background: color-mix(in srgb, var(--ok-solid) 20%, transparent); }
.tests { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tests li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
.t-ic { width: 20px; height: 20px; flex: none; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.tests li.pass .t-ic { background: var(--ok-solid); color: #fff; }
.tests li.fail .t-ic { background: var(--bad-solid); color: #fff; }
.tests li.pass span { color: var(--text-2); }
.tests li.fail > div > span { font-weight: 600; }
.cmp { margin-top: 6px; display: grid; gap: 4px; font-size: 13px; }
.cmp div { display: flex; gap: 8px; align-items: baseline; }
.cmp em { font-style: normal; color: var(--text-3); flex: none; width: 30px; }
.cmp code { font: 12.5px/1.6 var(--mono); padding: 2px 6px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border); overflow-wrap: anywhere; }
.to-sub { margin-top: 10px; font-size: 12px; color: var(--text-3); font-weight: 600; }
.test-out pre { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font: 12.5px/1.6 var(--mono); white-space: pre-wrap; overflow-x: auto; }
.solution { margin-top: 16px; padding: 16px 18px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); animation: fade .2s; }
.solution .fb-ic { background: var(--accent); color: #fff; }
.solution .fb-head b { color: var(--accent-text); }
.solution .code { background: var(--surface); }

.result-card { text-align: center; padding: 44px 28px 36px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); animation: pop .25s cubic-bezier(.2, .8, .2, 1); }
.result-ring { position: relative; width: fit-content; margin: 0 auto 18px; }
.rr-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.rr-text b { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rr-text b small { font-size: 16px; color: var(--text-3); font-weight: 500; }
.rr-text span { font-size: 12.5px; color: var(--text-3); }
.result-card h2 { font-size: 21px; margin-bottom: 8px; }
.result-card p { color: var(--text-2); }
.result-card.ok .ring-fg, .report-hero .ring.ok .ring-fg { stroke: var(--ok-solid); }
.result-card.low .ring-fg { stroke: var(--warn-solid); }
.result-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 26px; }

/* ============================================================
 * 刷题单
 * ============================================================ */
.filter-card { padding: 8px 24px 22px; }
.filter-row { display: grid; grid-template-columns: 48px 1fr; gap: 16px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--border); }
.filter-row > label { font-size: 13px; color: var(--text-3); font-weight: 500; padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  height: 32px; padding: 0 13px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 500;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2); transition: all .12s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-text); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.seg-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px; border: 0; border-radius: 7px; cursor: pointer;
  background: transparent; color: var(--text-2); font-size: 13.5px; font-weight: 500; transition: all .12s;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(16, 18, 27, .1), 0 0 0 1px var(--border); }
.seg-btn i { font-style: normal; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.seg.sm .seg-btn { height: 26px; font-size: 12.5px; padding: 0 10px; }
.filter-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 20px; flex-wrap: wrap; }
.drill-count { color: var(--text-2); }
.drill-count b { font-size: 20px; color: var(--text); margin-right: 2px; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  .filter-row { grid-template-columns: 1fr; gap: 8px; }
  .filter-row > label { padding-top: 0; }
  .filter-foot .btn { width: 100%; }
}
.prog-list { display: flex; flex-direction: column; gap: 2px; margin: 0 -10px; }
.prog-row {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer; transition: background .12s;
}
.prog-list.static .prog-row { cursor: default; grid-template-columns: 120px 1fr 50px; }
.prog-list.static .prog-row .meter { grid-column: 2; grid-row: 1; }
.prog-list.static .pr-num { grid-column: 3; text-align: right; }
button.prog-row:hover { background: var(--surface-2); }
.prog-row.on { background: var(--accent-soft); }
.pr-name { font-size: 13.5px; font-weight: 500; }
.pr-num { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.prog-row .meter { grid-column: 1 / -1; height: 4px; }
.prog-row.weak .meter i { background: var(--bad-solid); }
.prog-row.good .meter i { background: var(--ok-solid); }
.prog-row.weak .pr-num { color: var(--bad); font-weight: 600; }

/* ============================================================
 * 错题本
 * ============================================================ */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
.tile { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.tile-top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); font-weight: 500; }
.tile-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.tile b { font-size: 32px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile.hot { border-color: var(--bad-border); }
.tile.hot .tile-ic { background: var(--bad-soft); color: var(--bad); }
.tile.hot b { color: var(--bad); }
@media (max-width: 760px) {
  .tiles { grid-template-columns: 1fr; gap: 10px; }
  .tile { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 2px 12px; align-items: center; }
  .tile b { font-size: 24px; }
  .tile .btn { grid-column: 2; grid-row: 1 / 3; }
}
.group-list { margin: 0 -8px; }
.group summary { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 9px; transition: background .12s; }
.group summary:hover { background: var(--surface-2); }
.group summary b { font-weight: 600; }
.group summary .muted { flex: 1; font-size: 13px; }
.chev-d { display: grid; place-items: center; color: var(--text-3); transition: transform .15s; }
.group[open] .chev-d { transform: rotate(90deg); }
.group ul { list-style: none; margin: 2px 0 10px; padding: 0 8px 0 36px; display: flex; flex-direction: column; gap: 2px; }
.group li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; }
.group li:last-child { border-bottom: 0; }
.g-stem { flex: 1; min-width: 0; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============================================================
 * 模拟考
 * ============================================================ */
.exam-card { padding: 0; overflow: hidden; }
.exam-blueprint { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--border); background: var(--surface-2); }
.exam-blueprint div { padding: 20px; text-align: center; border-right: 1px solid var(--border); }
.exam-blueprint div:last-child { border-right: 0; }
.exam-blueprint b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.exam-blueprint span { font-size: 13px; color: var(--text-3); }
.exam-cta { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 24px; flex-wrap: wrap; }
.exam-cta h3 { font-size: 17px; margin-bottom: 4px; }
@media (max-width: 640px) { .exam-cta .btn-row, .exam-cta .btn { width: 100%; } .exam-cta .btn-row .btn { flex: 1; } }
.hist { margin: 0 -8px; }
.hist-row { display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 10px; transition: background .12s; }
.hist-row:hover { background: var(--surface-2); }
.hist-main { flex: 1; display: flex; flex-direction: column; }
.hist-main span { font-size: 12.5px; color: var(--text-3); }

.exam-layout { display: grid; grid-template-columns: minmax(0, 1fr) 264px; gap: 24px; align-items: start; }
.sheet-card { position: sticky; top: 20px; margin-top: 20px; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.sheet-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.sheet-sec { grid-column: 1 / -1; font-size: 11.5px; color: var(--text-3); font-weight: 600; margin-top: 8px; }
.sheet-grid button {
  position: relative; aspect-ratio: 1; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2); transition: all .12s;
}
.sheet-grid button:hover { border-color: var(--border-strong); }
.sheet-grid button.ans { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent-text); }
.sheet-grid button.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); color: var(--text); }
.sheet-grid button.flag::after { content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn-solid); }
.sheet-legend { display: flex; gap: 12px; margin: 14px 0; font-size: 12px; color: var(--text-3); }
.sheet-legend span { display: inline-flex; align-items: center; gap: 5px; }
.sheet-legend i { width: 10px; height: 10px; border-radius: 3px; }
.lg-ans { background: var(--accent-soft); border: 1px solid var(--accent); }
.lg-flag { background: var(--warn-solid); border-radius: 50% !important; }
.lg-cur { border: 2px solid var(--accent); }
.sheet-card .muted { margin-top: 8px; }
.btn.flagged { color: var(--warn); }
.grading { text-align: center; padding: 56px 20px; }
.grading h3 { margin-bottom: 6px; }
@media (max-width: 1100px) {
  .exam-layout { grid-template-columns: 1fr; }
  .sheet-card { position: static; order: 2; }
  .sheet-grid { grid-template-columns: repeat(10, 1fr); }
}
@media (max-width: 640px) { .sheet-grid { grid-template-columns: repeat(8, 1fr); } }

.report-hero { display: flex; align-items: center; gap: 32px; padding: 28px 32px; }
.report-hero .result-ring { margin: 0; }
.rh-body { flex: 1; }
.rh-body h2 { font-size: 20px; margin-bottom: 6px; }
.rh-body .btn-row { margin-top: 18px; }
@media (max-width: 640px) { .report-hero { flex-direction: column; text-align: center; padding: 24px 18px; } .rh-body .btn-row { justify-content: center; } }
.rp-list { display: flex; flex-direction: column; gap: 8px; }
.rp-item { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.rp-item summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; transition: background .12s; }
.rp-item summary:hover { background: var(--surface-2); }
.rp-no { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 12.5px; font-weight: 650; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.rp-mod { flex: 1; color: var(--text-2); font-size: 13.5px; }
.rp-res { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.rp-item.ok .rp-res { color: var(--ok); }
.rp-item.no .rp-res { color: var(--bad); }
.rp-item.pend .rp-res { color: var(--warn); }
.rp-item[open] .chev-d { transform: rotate(180deg); }
.rp-item .q-card { border: 0; border-top: 1px solid var(--border); border-radius: 0; box-shadow: none; }

/* ============================================================
 * 速查 / 设置
 * ============================================================ */
.sheet { padding: 8px 32px 28px; }
.sheet h3 { margin-top: 28px !important; padding-top: 22px; border-top: 1px solid var(--border); font-size: 17px; }
.sheet h3:first-child { border-top: 0; padding-top: 0; margin-top: 20px !important; }
@media (max-width: 960px) { .sheet { padding: 4px 18px 20px; } }
.settings .card-head { margin-bottom: 6px; }
.settings > p { margin-bottom: 16px; }
.set-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); }
.set-row:first-child { padding-top: 4px; }
.set-row:last-child { border-bottom: 0; padding-bottom: 4px; }
.set-ic { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.set-text { flex: 1; min-width: 0; }
.set-text b { font-weight: 600; }
.set-text p { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.switch { position: relative; width: 44px; height: 26px; flex: none; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: background .2s; }
.switch i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.switch input:checked + i { background: var(--accent); border-color: var(--accent); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { box-shadow: 0 0 0 3px var(--accent-ring); }
.keys { display: flex; flex-direction: column; }
.keys div { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; color: var(--text-2); }
.keys div:last-child { border-bottom: 0; }
.keys span:first-child { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); }

/* 修正 */
.cc-ring span { display: flex; align-items: center; justify-content: center; gap: 1px; }
.prose :not(pre) > code { white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

/* 跳过 / 标为已学 */
.head-count { font-size: 12.5px; font-weight: 400; margin-left: 6px; }
.timeline li { display: flex; align-items: center; gap: 6px; }
.timeline li > a { flex: 1; min-width: 0; }
.tl-toggle {
  flex: none; height: 28px; padding: 0 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 12.5px; font-weight: 500;
  opacity: 0; transition: opacity .12s, background .12s, color .12s, border-color .12s;
}
.timeline li:hover .tl-toggle, .tl-toggle:focus-visible { opacity: 1; }
.tl-toggle:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-2); }
.tl-toggle.on { color: var(--text-3); }
@media (hover: none), (max-width: 960px) { .tl-toggle { opacity: 1; } }
.timeline li.skipped .tl-dot { background: var(--surface-3); border-color: var(--surface-3); color: var(--text-2); }
.timeline li.skipped:not(:last-child) a::after { background: var(--border); }
.skip-lesson { color: var(--text-3); }
@media (max-width: 640px) { .timeline li a .chev { display: none; } }
@media (max-width: 640px) {
  .timeline li a .pill { display: none; }
  .timeline li a { padding: 12px 4px; gap: 12px; }
  .tl-toggle { height: 26px; padding: 0 8px; font-size: 12px; }
}

/* ============================================================
 * 底部固定操作栏：提交 / 下一题 永远在同一个位置
 * ============================================================ */
main.reading, main.exam { padding-bottom: 140px; }
.answer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--border); box-shadow: 0 -6px 20px rgba(16, 18, 27, .05);
  transition: background .2s, border-color .2s;
}
.answer-bar.ok { background: var(--ok-soft); border-top-color: var(--ok-border); }
.answer-bar.no { background: var(--bad-soft); border-top-color: var(--bad-border); }
.ab-inner { max-width: 704px; margin: 0 auto; display: flex; align-items: center; gap: 14px; min-height: 44px; }
.ab-status { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; animation: fade .2s; }
.ab-status:empty { visibility: hidden; }
.ab-ic { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.answer-bar.ok .ab-ic { background: var(--ok-solid); }
.answer-bar.no .ab-ic { background: var(--bad-solid); }
.ab-text { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.ab-text b { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.answer-bar.ok .ab-text b { color: var(--ok); }
.answer-bar.no .ab-text b { color: var(--bad); }
.ab-text small { font-size: 12px; color: var(--text-3); }
.ab-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.ab-actions .fb-actions { margin: 0; flex-wrap: nowrap; }
.ab-actions .btn.primary, .ab-actions .btn.success { min-width: 132px; height: 44px; font-size: 15px; border-radius: 11px; }
.ab-actions .btn.secondary, .ab-actions .btn.ghost { height: 44px; }
/* 模拟考：操作栏和题目列对齐，右侧留给答题卡 */
.answer-bar.exam .ab-inner { max-width: 1084px; display: grid; grid-template-columns: minmax(0, 1fr) 264px; }
.ab-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
@media (max-width: 1100px) { .answer-bar.exam .ab-inner { display: flex; } .ab-row { flex: 1; } }
@media (max-width: 960px) {
  .answer-bar { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .ab-text small { display: none; }
  .ab-actions .btn.primary, .ab-actions .btn.success { min-width: 0; padding: 0 18px; }
  .ab-status:empty { display: none; }
  .ab-status:empty + .ab-actions { flex: 1; justify-content: flex-end; }
  .ab-status:empty + .ab-actions .btn.primary { flex: 1; }
  .ab-status:empty + .ab-actions .fb-actions { flex: 1; }
  .ab-status:empty + .ab-actions .fb-actions .btn { flex: 1; }
}
</style>

  <aside class="sidebar">
    <a class="brand" href="#/" id="brand"></a>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <header class="mobile-top" id="mobile-top"></header>
  <div class="content"><main id="main"></main></div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="toast" role="status"></div>
<div id="modal"></div>

<script>window.EXAM_DATA = {"modules": [{"lessons": [{"title": "先学会读代码：变量、print、基本类型", "cards": ["这一节是\"热身\"，教你看懂最基本的 Python 代码。后面所有内容都建立在这上面。\n\n> 💡 **怎么用这个页面学**：灰色代码块里带「▶ 运行」按钮的，可以直接点运行看结果，**还可以改代码再运行**。不要只看，动手改一改印象最深。\n\n先运行一下这个最简单的程序：\n\n```python run\nprint(\"你好，Python\")\nprint(1 + 2)\n```\n\n`print(...)` 的作用是**把括号里的东西显示出来**。考试里大量题目问\"下面代码输出什么\"，其实就是问 `print` 显示了什么。", "### 变量：给数据起个名字\n\n```python run\nprice = 100        # 把 100 这个数，起名叫 price\ncount = 3\ntotal = price * count\nprint(total)\n```\n\n- `=` 不是\"等于\"，而是**\"把右边的值交给左边这个名字\"**。\n- `#` 后面是**注释**，给人看的，Python 会忽略它。\n- 同一个名字可以重新赋值，以最后一次为准：\n\n```python run\nx = 1\nx = x + 10     # 先算右边 1 + 10 = 11，再交给 x\nprint(x)\n```", "### 四种最基本的数据类型\n\n| 类型 | 叫法 | 例子 | 说明 |\n|---|---|---|---|\n| `int` | 整数 | `7`、`-3`、`0` | 没有小数点 |\n| `float` | 浮点数（小数） | `3.14`、`2.0` | 有小数点 |\n| `str` | 字符串（文字） | `'abc'`、`\"你好\"` | 用单引号或双引号包起来 |\n| `bool` | 布尔（真假） | `True`、`False` | 注意首字母大写 |\n\n用 `type(...)` 可以查看一个值是什么类型：\n\n```python run\nprint(type(7))\nprint(type(7.0))\nprint(type(\"7\"))\nprint(type(True))\n```\n\n> ⚠️ `7` 和 `\"7\"` 完全不同：前者是数字，后者是文字。`\"7\" + \"7\"` 得到 `\"77\"`（拼接），`7 + 7` 得到 `14`。", "### 缩进：Python 用空格表示\"属于谁\"\n\n```python run\nscore = 85\nif score >= 60:\n    print(\"及格\")        # 前面有 4 个空格，表示属于 if\n    print(\"继续加油\")\nprint(\"这一行不属于 if，总会执行\")\n```\n\n- 以冒号 `:` 结尾的行（`if`、`for`、`def` 等），下一行开始要**缩进 4 个空格**。\n- 缩进相同的连续几行，是同一\"块\"。\n\n### for 循环：对每个元素做同一件事\n\n```python run\nfor n in [10, 20, 30]:\n    print(n * 2)\n```\n\n读法：\"对于列表里的每一个 `n`，执行一次下面缩进的代码\"。\n\n`range(5)` 产生 0、1、2、3、4（**从 0 开始，不包括 5**）：\n\n```python run\nfor i in range(5):\n    print(i)\n```"]}, {"title": "列表 list：最常用的容器", "cards": ["**列表就是\"一排格子\"**，按顺序放东西，用方括号 `[]` 写：\n\n```python run\nnums = [10, 20, 30]\nnames = [\"张三\", \"李四\"]\nmixed = [1, \"a\", True]     # 什么类型都能放\nempty = []                 # 空列表\nprint(len(nums))           # len 求长度（有几个元素）\n```\n\n### 用下标取元素：从 0 开始数！\n\n```python run\nnums = [10, 20, 30]\nprint(nums[0])    # 第 1 个 → 10\nprint(nums[2])    # 第 3 个 → 30\nprint(nums[-1])   # 负数从后往前数，-1 是最后一个 → 30\n```\n\n| 下标 | 0 | 1 | 2 |\n|---|---|---|---|\n| 值 | 10 | 20 | 30 |\n| 负下标 | -3 | -2 | -1 |\n\n> ⚠️ `nums[3]` 会报错 `IndexError`：3 个元素的下标只有 0、1、2。", "### 切片：一次取一段\n\n`列表[开始:结束]`，**包含开始，不包含结束**（和 `range` 一样左闭右开）：\n\n```python run\na = [0, 1, 2, 3, 4]\nprint(a[1:3])   # 下标 1、2 → [1, 2]\nprint(a[:2])    # 省略开始 = 从头 → [0, 1]\nprint(a[2:])    # 省略结束 = 到尾 → [2, 3, 4]\nprint(a[:])     # 全部（得到一个新列表，后面讲\"复制\"时会用到）\n```", "### 修改列表\n\n列表是**可变的**：创建之后还能增、删、改。\n\n```python run\na = [1, 2]\na.append(3)        # 末尾加一个元素\nprint(a)\na[0] = 100         # 改第一个\nprint(a)\na.extend([7, 8])   # 把另一个列表的元素逐个加进来\nprint(a)\nx = a.pop()        # 删掉并返回最后一个\nprint(x, a)\n```\n\n### append 和 extend 的区别（高频考点）\n\n```python run\na = [1, 2]\na.append([3, 4])   # 把 [3, 4] 整个当成 1 个元素放进去\nprint(a)\n\nb = [1, 2]\nb.extend([3, 4])   # 把 3 和 4 逐个放进去\nprint(b)\n```", "### 判断\"在不在里面\"、遍历\n\n```python run\nfruits = [\"apple\", \"banana\"]\nprint(\"apple\" in fruits)      # True\nprint(\"pear\" in fruits)       # False\nfor f in fruits:\n    print(f)\n```\n\n> 📌 **本节要记住**\n> - 下标从 **0** 开始，`-1` 是最后一个\n> - 切片 `[a:b]` 含 a 不含 b\n> - `append` 加 1 个元素；`extend` 逐个加多个元素"]}, {"title": "元组 tuple：不能改的列表", "cards": ["元组和列表很像，也是\"一排格子\"，但用**圆括号**写，而且**创建后不能修改**：\n\n```python run\nt = (1, 2, 3)\nprint(t[0])        # 取值和列表一样\nprint(len(t))\n```\n\n```python run\nt = (1, 2, 3)\nt[0] = 100         # 试图修改 → 报错 TypeError\n```\n\n> 为什么要有\"不能改\"的东西？因为它**安全**：交出去的数据不会被别人偷偷改掉。而且不可变的东西才能当字典的\"键\"（下一节讲）。", "### 最大的坑：单个元素的元组要加逗号\n\n```python run\na = (1)       # 这只是数字 1 外面套了个括号（数学里的括号）\nb = (1,)      # 加了逗号，才是元组\nprint(type(a))\nprint(type(b))\n```\n\n其实**真正定义元组的是逗号**，括号可以省略：\n\n```python run\nc = 1, 2, 3\nprint(c, type(c))\n```\n\n这一点在下一节\"函数返回多个值\"里非常重要：`return a, b` 返回的其实是一个元组。\n\n> 📌 **本节要记住**\n> - 元组用 `()`，**不可修改**\n> - `(1)` 是整数，`(1,)` 才是元组\n> - 逗号才是元组的本体，`1, 2` 就是元组"]}, {"title": "字典 dict：按名字找东西", "cards": ["列表按**位置**（0、1、2）找东西；字典按**名字**（叫\"键\"）找东西。就像通讯录：按名字查电话。\n\n```python run\nphone = {\"张三\": \"138\", \"李四\": \"139\"}\nprint(phone[\"张三\"])\n```\n\n- 写法：`{键: 值, 键: 值}`\n- 一个\"键: 值\"叫一个**键值对**\n- 键**不能重复**，同一个键再赋值会覆盖", "### 增、改、查\n\n```python run\nd = {\"a\": 1}\nd[\"b\"] = 2          # 键不存在 → 新增\nd[\"a\"] = 100        # 键已存在 → 修改\nprint(d)\nprint(len(d))       # 有几个键值对\n```\n\n### 取一个不存在的键：两种写法的区别（必考）\n\n```python run\nd = {\"a\": 1}\nprint(d.get(\"x\"))       # 不存在 → 返回 None，不报错\nprint(d.get(\"x\", 0))    # 不存在 → 返回你给的默认值 0\nprint(d[\"x\"])           # 不存在 → 直接报错 KeyError\n```", "### in 判断的是\"键\"，不是\"值\"\n\n```python run\nd = {\"a\": 1, \"b\": 2}\nprint(\"a\" in d)              # True —— 'a' 是键\nprint(1 in d)                # False —— 1 是值，不是键\nprint(1 in d.values())       # True —— 想查值要用 .values()\n```\n\n### 遍历字典\n\n```python run\nd = {\"a\": 1, \"b\": 2}\nfor k in d:                  # 直接遍历得到的是键\n    print(k)\nfor k, v in d.items():       # .items() 同时拿到键和值\n    print(k, v)\n```\n\n> 字典会**记住插入的顺序**（Python 3.7 起），遍历时按插入顺序出来。", "### 最重要的用法：分组累加（代码题 31 的核心）\n\n\"按客户汇总金额\"就是：遇到一个客户，如果字典里还没有它就从 0 开始，然后加上金额。\n\n```python run\nrecords = [(\"C1\", 10), (\"C2\", 5), (\"C1\", 3)]\ntotal = {}\nfor cid, amount in records:\n    total[cid] = total.get(cid, 0) + amount\nprint(total)\n```\n\n`total.get(cid, 0)`：有就取出原来的值，没有就当 0。**这一行一定要背熟**，代码题会用到。\n\n### 哪些东西能当键？\n\n键必须是**不可变**的（准确说叫\"可哈希\"）：`int`、`str`、`tuple` 可以；`list`、`dict`、`set` **不行**。\n\n```python run\nd = {}\nd[(1, 2)] = \"元组可以当键\"\nprint(d)\nd[[1, 2]] = \"列表不行\"     # TypeError: unhashable type: 'list'\n```\n\n> 📌 **本节要记住**\n> - `d[k]` 键不存在报 `KeyError`；`d.get(k, 默认值)` 不报错\n> - `k in d` 查的是**键**\n> - `d.items()` 同时取键和值\n> - 累加模板：`d[k] = d.get(k, 0) + x`"]}, {"title": "集合 set：自动去重的口袋", "cards": ["集合就像一个**不记顺序、不允许重复**的口袋，用花括号写：\n\n```python run\ns = {3, 1, 3, 2, 1}\nprint(s)            # 重复的自动去掉\nprint(len(s))\n```\n\n### 最常见的用途：去重、快速判断\"有没有\"\n\n```python run\nids = [\"a\", \"b\", \"a\", \"c\", \"b\"]\nprint(set(ids))              # 去重\nseen = {\"a\", \"b\"}\nprint(\"a\" in seen)           # 查找非常快\n```\n\n> ⚠️ 集合**没有顺序**，不能用下标 `s[0]`，打印出来的顺序也不保证和放进去的一样。", "### 空集合的坑（必考）\n\n```python run\na = {}\nb = set()\nprint(type(a))     # dict！{} 是空字典\nprint(type(b))     # set，空集合只能这样写\n```\n\n### 集合运算\n\n```python run\nx = {1, 2, 3}\ny = {2, 3, 4}\nprint(x | y)    # 并集：两边所有的\nprint(x & y)    # 交集：两边都有的\nprint(x - y)    # 差集：x 有 y 没有的\n```", "### 预告代码题 32：稳定去重\n\n`set(ids)` 能去重，但**会打乱顺序**。题目常要求\"去重后保持第一次出现的顺序\"（叫**稳定去重**）。办法是：用集合记\"见过谁\"，用列表按顺序存结果：\n\n```python run\nids = [\"b\", \"a\", \"b\", \"c\", \"a\"]\nseen = set()\nresult = []\nfor x in ids:\n    if x not in seen:\n        seen.add(x)\n        result.append(x)\nprint(result)\n```\n\n> 📌 **本节要记住**\n> - 集合自动去重、**无序**\n> - 空集合是 `set()`，`{}` 是空字典\n> - 稳定去重 = `set` 记录见过的 + `list` 按顺序保存"]}, {"title": "对象引用：赋值不是复制", "cards": ["这是 Python 最容易让人\"想不通\"的地方，考试必考。\n\n想象**变量是贴在东西上的标签**，而不是装东西的盒子：\n\n```python run\na = [1, 2, 3]\nb = a           # 不是\"复制一份给 b\"，而是\"给同一个列表再贴一个标签 b\"\nb.append(4)\nprint(a)        # a 也变了！因为 a 和 b 是同一个列表\n```\n\n```\n a ──┐\n     ├──▶ [1, 2, 3, 4]      只有一个列表\n b ──┘\n```", "### `is` 和 `==` 的区别\n\n- `==`：**值**一样吗？（两份内容相同的文件）\n- `is`：是不是**同一个东西**？（是不是同一份文件）\n\n```python run\na = [1, 2]\nb = a\nc = [1, 2]\nprint(a == c)    # True —— 内容一样\nprint(a is c)    # False —— 是两个不同的列表\nprint(a is b)    # True —— 同一个列表\n```", "### 想要真正的复制：浅拷贝\n\n```python run\na = [1, 2, 3]\nb = a[:]         # 或 a.copy()、list(a)，都会造出一个新列表\nb.append(4)\nprint(a)         # a 不受影响\nprint(b)\nprint(a is b)\n```\n\n### 浅拷贝的\"浅\"：只复制外层\n\n如果列表里面还有列表，浅拷贝**只复制外面那层**，里面的小列表仍然是共用的：\n\n```python run\na = [[1], [2]]\nb = a[:]\nb[0].append(99)   # 改的是里面那个共用的小列表\nprint(a)          # a 也变了\n```\n\n要连里面一起复制，用**深拷贝**：\n\n```python run\nimport copy\na = [[1], [2]]\nb = copy.deepcopy(a)\nb[0].append(99)\nprint(a)          # a 不受影响\n```\n\n| 写法 | 效果 |\n|---|---|\n| `b = a` | 不复制，同一个对象 |\n| `a[:]`、`a.copy()`、`list(a)` | 浅拷贝：外层新，内层共用 |\n| `copy.deepcopy(a)` | 深拷贝：全部都是新的 |", "### 经典坑：`[[0] * 2] * 2`\n\n```python run\ngrid = [[0] * 2] * 2      # 外层的两个元素是\"同一个\"小列表\ngrid[0][0] = 1\nprint(grid)               # 两行一起变了！\n```\n\n`* 2` 复制的是**标签**，不是小列表本身。正确写法用推导式，每次都新建一个：\n\n```python run\ngrid = [[0] * 2 for _ in range(2)]\ngrid[0][0] = 1\nprint(grid)\n```\n\n> 📌 **本节要记住**\n> - `b = a` 不复制，改 b 等于改 a\n> - `==` 比值，`is` 比是不是同一个\n> - 切片 / `.copy()` 是浅拷贝；`copy.deepcopy` 是深拷贝\n> - `[[0]*n]*m` 每行是同一个列表"]}, {"title": "列表推导式：一行生成列表", "cards": ["很多时候我们要\"把一个列表里的每个元素处理一下，得到新列表\"。普通写法：\n\n```python run\nnums = [1, 2, 3, 4]\nsquares = []\nfor x in nums:\n    squares.append(x * x)\nprint(squares)\n```\n\n**列表推导式**把这 3 行压缩成 1 行：\n\n```python run\nnums = [1, 2, 3, 4]\nsquares = [x * x for x in nums]\nprint(squares)\n```\n\n读法：**\"对 nums 里每个 x，算出 x * x，收集成列表\"**。\n\n```\n[ x * x    for x in nums ]\n   ↑ 要什么     ↑ 从哪来\n```", "### 加条件过滤：if 写在后面\n\n```python run\nnums = [1, 2, 3, 4, 5, 6]\nevens = [x for x in nums if x % 2 == 0]    # % 是求余数，余 0 就是偶数\nprint(evens)\n```\n\n读法：\"对每个 x，**如果**是偶数，就收集 x\"。**不满足条件的会被丢掉**。\n\n### 二选一变换：if...else 写在前面\n\n```python run\nnums = [-1, 2, -3]\nfixed = [x if x > 0 else 0 for x in nums]\nprint(fixed)\n```\n\n读法：\"对每个 x，**大于 0 就用 x，否则用 0**\"。**不会丢掉任何元素**，个数不变。\n\n> ⚠️ **位置决定意思（必考）**\n> - `if` 在**后面**（for 之后）= **过滤**，元素可能变少\n> - `if...else` 在**前面**（for 之前）= **变换**，元素个数不变", "### 其他推导式\n\n```python run\nwords = [\"a\", \"bb\", \"a\"]\nprint({w: len(w) for w in words})   # 字典推导式\nprint({w for w in words})           # 集合推导式（去重）\nprint((x for x in [1, 2]))          # 圆括号不是元组推导式，而是\"生成器\"\n```\n\n最后一个很容易误会：圆括号得到的是**生成器**，不是元组。生成器在\"迭代器\"模块里会详细讲。\n\n> 📌 **本节要记住**\n> - `[表达式 for x in 列表 if 条件]`\n> - 后置 if 过滤；前置 if-else 变换\n> - `{k: v for ...}` 字典，`{x for ...}` 集合，`(x for ...)` 生成器"]}, {"title": "函数：return 多个值与解包", "cards": ["### 函数是什么\n\n函数就是\"**起了名字的一段代码**\"，可以反复调用。`def` 定义，`return` 交回结果：\n\n```python run\ndef add(a, b):        # a、b 是参数：调用时传进来的值\n    return a + b      # return：把结果交回给调用的地方\n\nresult = add(3, 4)\nprint(result)\n```\n\n- 调用函数：`函数名(参数)`\n- 执行到 `return` 函数就结束了，后面的代码不会执行\n\n### 没有 return 的函数返回 None\n\n```python run\ndef say(x):\n    print(x)          # 只是显示，没有 return\n\nr = say(\"hi\")\nprint(r)              # None：表示\"什么都没有\"\n```\n\n> ⚠️ `print` 是**显示**给人看，`return` 是**交回**给程序用。两者完全不同。", "### return 多个值：其实是返回一个元组\n\n```python run\ndef min_max(nums):\n    return min(nums), max(nums)    # 逗号 → 打包成元组\n\nr = min_max([3, 1, 5])\nprint(r)\nprint(type(r))\n```\n\n### 解包：把元组拆给多个变量\n\n```python run\ndef min_max(nums):\n    return min(nums), max(nums)\n\nlo, hi = min_max([3, 1, 5])    # 左边两个变量，右边两个值，一一对应\nprint(lo)\nprint(hi)\n```\n\n解包对任何\"能逐个取出元素\"的东西都有效：列表、元组、字符串都行。\n\n```python run\na, b = [10, 20]\nx, y = \"hi\"\nprint(a, b, x, y)\na, b = b, a        # 交换两个变量的经典写法\nprint(a, b)\n```", "### 个数对不上会报错\n\n```python run\na, b = [1, 2, 3]     # 左 2 个，右 3 个 → ValueError\n```\n\n### 星号收集剩下的\n\n```python run\nfirst, *rest = [1, 2, 3, 4]\nprint(first)\nprint(rest)          # 星号变量总是一个列表\n\nhead, *mid, tail = [1, 2, 3, 4, 5]\nprint(head, mid, tail)\n\na, *b = [1]\nprint(a, b)          # 没有剩余，b 就是空列表 []\n```\n\n> 📌 **本节要记住**\n> - 没有 `return` 的函数返回 `None`\n> - `return a, b` 返回的是**元组**\n> - 解包左右个数必须一致，否则 `ValueError`\n> - `*变量` 收集剩余元素，**总是列表**（可能为空）"]}, {"title": "排序：sorted 和 sort", "cards": ["### 两种排序方式\n\n```python run\nnums = [3, 1, 2]\nnew = sorted(nums)     # 返回一个排好序的新列表，原列表不动\nprint(new)\nprint(nums)\n```\n\n```python run\nnums = [3, 1, 2]\nnums.sort()            # 直接把原列表排好序\nprint(nums)\n```\n\n### 最大的坑：`list.sort()` 返回 None\n\n```python run\nnums = [3, 1, 2]\nr = nums.sort()\nprint(r)               # None！sort 是原地修改，不返回新列表\n```\n\n> ⚠️ 所以 `nums = nums.sort()` 是一个经典错误：nums 会变成 `None`。", "### 倒序：reverse=True\n\n```python run\nprint(sorted([3, 1, 2], reverse=True))\n```\n\n### 按指定规则排序：key\n\n`key` 告诉 Python **\"按什么来比较\"**。`lambda` 是一种一行写完的小函数：\n\n```python run\nwords = [\"ccc\", \"a\", \"bb\"]\nprint(sorted(words, key=len))          # 按长度排\n\npeople = [(\"张三\", 30), (\"李四\", 25)]\nprint(sorted(people, key=lambda p: p[1]))   # 按每个元组的第 2 个元素（年龄）排\n```\n\n`lambda p: p[1]` 等价于：\n\n```python\ndef get_age(p):\n    return p[1]\n```", "### 字符串排序：大写在小写前面\n\n```python run\nprint(sorted([\"b\", \"A\", \"c\", \"B\"]))\n```\n\n字符串是按字符编码一个个比的，大写字母的编码比小写小，所以大写排前面。\n\n### 排序是\"稳定\"的（必考）\n\n**稳定**的意思是：比较结果**相等**的元素，排完后保持原来的先后顺序。\n\n```python run\nrows = [(\"a\", 2), (\"b\", 1), (\"c\", 2)]\nprint(sorted(rows, key=lambda r: r[1]))\n# ('a', 2) 和 ('c', 2) 的 key 都是 2，所以保持原来 a 在 c 前面\n```", "### 多个条件排序：key 返回元组\n\n\"先按金额从大到小，金额相同再按编号从小到大\"：\n\n```python run\ndata = [(\"b\", 5), (\"a\", 9), (\"c\", 5)]\nprint(sorted(data, key=lambda r: (-r[1], r[0])))\n```\n\n- 元组会先比第 1 个，相同再比第 2 个\n- 数字取负号 `-r[1]`，就能让它**倒序**，而另一个条件仍然正序\n\n> 📌 **本节要记住**\n> - `sorted(x)` 返回新列表；`x.sort()` 原地排序、**返回 None**\n> - `reverse=True` 倒序；`key=` 指定比较依据\n> - Python 排序**稳定**\n> - 多条件：`key=lambda r: (-数值, 字符串)`"]}], "questions": [{"id": "py-1", "m": "py", "type": "single", "tags": [], "stem": "下面代码的输出是？\n\n```python\nx = 5\nx = x * 2\nprint(x)\n```", "options": ["`5`", "`10`", "`x * 2`", "报错"], "answer": [1], "why": ["`x` 被重新赋值了，以最后一次为准", "先算右边 `5 * 2 = 10`，再交给 `x`", "`print(x)` 显示的是 `x` 的值，不是文字", "这是完全合法的写法"], "explain": "`=` 是\"赋值\"：先算右边，再把结果交给左边的名字。", "check": "x = 5\nx = x * 2\nprint(x)", "lesson": 0}, {"id": "py-2", "m": "py", "type": "single", "tags": [], "stem": "`type(\"3.5\")` 的结果是？", "options": ["`float`", "`str`", "`int`", "`bool`"], "answer": [1], "why": ["有引号就是字符串，哪怕里面写的是数字", "被引号包起来的都是字符串", "既不是整数，也不是数字", "布尔只有 `True` 和 `False`"], "explain": "判断类型先看有没有引号：有引号就是 `str`。", "lesson": 0}, {"id": "py-3", "m": "py", "type": "single", "tags": [], "stem": "`list(range(3))` 的结果是？", "options": ["`[1, 2, 3]`", "`[0, 1, 2]`", "`[0, 1, 2, 3]`", "`[3]`"], "answer": [1], "why": ["range 从 0 开始，不是从 1", "从 0 开始，到 3 之前停（不含 3）", "不包括结尾的 3", "`range(3)` 表示 3 个数，不是数字 3 本身"], "explain": "`range(n)` 产生 `0, 1, ..., n-1`，共 n 个数。这个\"左闭右开\"规则在切片里也一样。", "check": "print(list(range(3)))", "lesson": 0}, {"id": "py-4", "m": "py", "type": "single", "tags": [], "stem": "已知 `a = ['x', 'y',
